name: Fix Amy SMC X AMD sequence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-amy-smc-x-amd-sequence.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enforce strict AMD lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          s = s.replace("var int amyxAMDManipBar = na\nvar box amyxAMDBox = na", "var int amyxAMDManipBar = na\nvar int amyxAMDDistBar = na\nvar box amyxAMDBox = na\nvar label amyxAMDManLabel = na\nvar label amyxAMDDistLabel = na", 1)

          old = "            amyxAMDStartBar := bar_index - amyxAMDLength\n            amyxAMDManipBar := na\n            if not na(amyxAMDBox)\n                box.delete(amyxAMDBox)\n            amyxAMDBox := box.new(amyxAMDStartBar, amyxAMDHigh, bar_index, amyxAMDLow, xloc = xloc.bar_index, bgcolor = color.new(BLUE, 96), border_color = color.new(BLUE, 72), text = 'ACC', text_color = BLUE, text_size = size.tiny, text_halign = text.align_center, text_valign = text.align_center)"
          new = "            amyxAMDStartBar := bar_index - amyxAMDLength\n            amyxAMDManipBar := na\n            amyxAMDDistBar := na\n            if not na(amyxAMDBox)\n                box.delete(amyxAMDBox)\n            if not na(amyxAMDManLabel)\n                label.delete(amyxAMDManLabel)\n            if not na(amyxAMDDistLabel)\n                label.delete(amyxAMDDistLabel)\n            amyxAMDManLabel := na\n            amyxAMDDistLabel := na\n            amyxAMDBox := box.new(amyxAMDStartBar, amyxAMDHigh, bar_index, amyxAMDLow, xloc = xloc.bar_index, bgcolor = color.new(BLUE, 96), border_color = color.new(BLUE, 65), text = 'ACC', text_color = BLUE, text_size = size.tiny, text_halign = text.align_center, text_valign = text.align_center)"
          if old not in s:
              raise SystemExit('ACC start block not found')
          s = s.replace(old, new, 1)

          s = s.replace("            amyAddChartLabel(bar_index, high + amyOffset * 3.0, 'MAN', true, RED)", "            if na(amyxAMDManLabel)\n                amyxAMDManLabel := label.new(bar_index, high + amyOffset * 2.2, 'MAN', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(RED, 84), style = label.style_label_down, textcolor = RED, size = size.tiny)", 1)
          s = s.replace("            amyAddChartLabel(bar_index, low - amyOffset * 3.0, 'MAN', false, GREEN)", "            if na(amyxAMDManLabel)\n                amyxAMDManLabel := label.new(bar_index, low - amyOffset * 2.2, 'MAN', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(GREEN, 84), style = label.style_label_up, textcolor = GREEN, size = size.tiny)", 1)

          old = "        if amyxBullDistribution\n            amyxAMDDistEvent := true\n            amyAddChartLabel(bar_index, high + amyOffset * 3.0, 'DIST', true, GREEN)\n            amyxAMDState := 0\n        else if amyxBearDistribution\n            amyxAMDDistEvent := true\n            amyAddChartLabel(bar_index, low - amyOffset * 3.0, 'DIST', false, RED)\n            amyxAMDState := 0\n        else if amyxBullInvalid or amyxBearInvalid or (not na(amyxAMDManipBar) and bar_index - amyxAMDManipBar > amyxAMDExpiry)\n            amyxAMDState := 0"
          new = "        if amyxBullDistribution\n            amyxAMDDistEvent := true\n            amyxAMDDistBar := bar_index\n            if na(amyxAMDDistLabel)\n                amyxAMDDistLabel := label.new(bar_index, high + amyOffset * 2.2, 'DIST', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(GREEN, 84), style = label.style_label_down, textcolor = GREEN, size = size.tiny)\n            amyxAMDState := 3\n        else if amyxBearDistribution\n            amyxAMDDistEvent := true\n            amyxAMDDistBar := bar_index\n            if na(amyxAMDDistLabel)\n                amyxAMDDistLabel := label.new(bar_index, low - amyOffset * 2.2, 'DIST', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(RED, 84), style = label.style_label_up, textcolor = RED, size = size.tiny)\n            amyxAMDState := 3\n        else if amyxBullInvalid or amyxBearInvalid or (not na(amyxAMDManipBar) and bar_index - amyxAMDManipBar > amyxAMDExpiry)\n            amyxAMDState := 0\n            if not na(amyxAMDBox)\n                box.delete(amyxAMDBox)\n                amyxAMDBox := na\n            if not na(amyxAMDManLabel)\n                label.delete(amyxAMDManLabel)\n                amyxAMDManLabel := na"
          if old not in s:
              raise SystemExit('DIST block not found')
          s = s.replace(old, new, 1)

          marker = "\nif not amyxShowAMD and barstate.islast\n"
          state3 = "\n    else if amyxAMDState == 3\n        // Completed cycle stays visible as exactly ACC -> MAN -> DIST.\n        if not na(amyxAMDBox) and not na(amyxAMDDistBar)\n            box.set_right(amyxAMDBox, amyxAMDDistBar)\n        if not na(amyxAMDDistBar) and bar_index - amyxAMDDistBar >= 3\n            amyxAMDState := 0\n"
          if marker not in s:
              raise SystemExit('AMD off marker not found')
          s = s.replace(marker, state3 + marker, 1)

          old = "    if not na(amyxAMDBox)\n        box.delete(amyxAMDBox)\n        amyxAMDBox := na\n\n//---------------------------------------------------------------------------------------------------------------------}\n// FIBONACCI EXTENSION"
          new = "    if not na(amyxAMDBox)\n        box.delete(amyxAMDBox)\n        amyxAMDBox := na\n    if not na(amyxAMDManLabel)\n        label.delete(amyxAMDManLabel)\n        amyxAMDManLabel := na\n    if not na(amyxAMDDistLabel)\n        label.delete(amyxAMDDistLabel)\n        amyxAMDDistLabel := na\n\n//---------------------------------------------------------------------------------------------------------------------}\n// FIBONACCI EXTENSION"
          if old not in s:
              raise SystemExit('AMD off cleanup block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-X.pine
          git diff --cached --quiet && exit 0
          git commit -m "Make AMD sequence strict ACC MAN DIST"
          git push origin main
