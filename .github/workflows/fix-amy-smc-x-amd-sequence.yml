name: Fix Amy SMC X AMD sequence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-amy-smc-x-amd-sequence.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enforce strict AMD lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          start_marker = "//---------------------------------------------------------------------------------------------------------------------}\n// AMD — Accumulation / Manipulation / Distribution\n//---------------------------------------------------------------------------------------------------------------------{\n"
          end_marker = "\n//---------------------------------------------------------------------------------------------------------------------}\n// FIBONACCI EXTENSION — TP1 / TP2 / MAX\n//---------------------------------------------------------------------------------------------------------------------{\n"

          if start_marker not in s or end_marker not in s:
              raise SystemExit('AMD block markers not found')

          before, rest = s.split(start_marker, 1)
          old_amd, after = rest.split(end_marker, 1)

          new_amd = r'''
float amyxAMDAtr = ta.atr(14)
float amyxAMDCandidateHigh = ta.highest(high[1], amyxAMDLength)
float amyxAMDCandidateLow = ta.lowest(low[1], amyxAMDLength)
float amyxAMDCandidateRange = amyxAMDCandidateHigh - amyxAMDCandidateLow
bool amyxAMDAccumCandidate = bar_index > amyxAMDLength and not na(amyxAMDAtr) and amyxAMDCandidateRange > 0 and amyxAMDCandidateRange <= amyxAMDAtr * amyxAMDRangeATR

// Strict lifecycle:
// 0 = waiting for ACC
// 1 = ACC active, waiting for one MAN
// 2 = MAN confirmed, waiting for DIST
// 3 = completed ACC -> MAN -> DIST cycle
var int amyxAMDState = 0
var int amyxAMDDirection = 0
var float amyxAMDHigh = na
var float amyxAMDLow = na
var int amyxAMDStartBar = na
var int amyxAMDManipBar = na
var int amyxAMDDistBar = na
var box amyxAMDBox = na
var label amyxAMDManLabel = na
var label amyxAMDDistLabel = na

bool amyxAMDManipEvent = false
bool amyxAMDDistEvent = false

amyxStartNewAMD() =>
    if not na(amyxAMDBox)
        box.delete(amyxAMDBox)
    if not na(amyxAMDManLabel)
        label.delete(amyxAMDManLabel)
    if not na(amyxAMDDistLabel)
        label.delete(amyxAMDDistLabel)

if barstate.isconfirmed and amyxShowAMD
    if amyxAMDState == 0
        if amyxAMDAccumCandidate
            if not na(amyxAMDBox)
                box.delete(amyxAMDBox)
            if not na(amyxAMDManLabel)
                label.delete(amyxAMDManLabel)
            if not na(amyxAMDDistLabel)
                label.delete(amyxAMDDistLabel)

            amyxAMDBox := na
            amyxAMDManLabel := na
            amyxAMDDistLabel := na
            amyxAMDState := 1
            amyxAMDDirection := 0
            amyxAMDHigh := amyxAMDCandidateHigh
            amyxAMDLow := amyxAMDCandidateLow
            amyxAMDStartBar := bar_index - amyxAMDLength
            amyxAMDManipBar := na
            amyxAMDDistBar := na
            amyxAMDBox := box.new(amyxAMDStartBar, amyxAMDHigh, bar_index, amyxAMDLow, xloc = xloc.bar_index, bgcolor = color.new(BLUE, 96), border_color = color.new(BLUE, 65), text = 'ACC', text_color = BLUE, text_size = size.tiny, text_halign = text.align_center, text_valign = text.align_center)

    else if amyxAMDState == 1
        if not na(amyxAMDBox)
            box.set_right(amyxAMDBox, bar_index)

        bool amyxSweepHigh = high > amyxAMDHigh and close < amyxAMDHigh
        bool amyxSweepLow = low < amyxAMDLow and close > amyxAMDLow

        if amyxSweepHigh and amyxSweepLow
            float amyxUpperExcursion = high - amyxAMDHigh
            float amyxLowerExcursion = amyxAMDLow - low
            if amyxUpperExcursion >= amyxLowerExcursion
                amyxSweepLow := false
            else
                amyxSweepHigh := false

        if amyxSweepHigh
            amyxAMDState := 2
            amyxAMDDirection := BEARISH
            amyxAMDManipBar := bar_index
            amyxAMDManipEvent := true
            if na(amyxAMDManLabel)
                amyxAMDManLabel := label.new(bar_index, high + amyOffset * 2.2, 'MAN', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(RED, 84), style = label.style_label_down, textcolor = RED, size = size.tiny)

        else if amyxSweepLow
            amyxAMDState := 2
            amyxAMDDirection := BULLISH
            amyxAMDManipBar := bar_index
            amyxAMDManipEvent := true
            if na(amyxAMDManLabel)
                amyxAMDManLabel := label.new(bar_index, low - amyOffset * 2.2, 'MAN', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(GREEN, 84), style = label.style_label_up, textcolor = GREEN, size = size.tiny)

        else if bar_index - amyxAMDStartBar > amyxAMDExpiry
            amyxAMDState := 0
            if not na(amyxAMDBox)
                box.delete(amyxAMDBox)
                amyxAMDBox := na

    else if amyxAMDState == 2
        if not na(amyxAMDBox)
            box.set_right(amyxAMDBox, bar_index)

        bool amyxBullDistribution = amyxAMDDirection == BULLISH and close > amyxAMDHigh
        bool amyxBearDistribution = amyxAMDDirection == BEARISH and close < amyxAMDLow
        bool amyxBullInvalid = amyxAMDDirection == BULLISH and close < amyxAMDLow
        bool amyxBearInvalid = amyxAMDDirection == BEARISH and close > amyxAMDHigh
        bool amyxAMDExpiredAfterManip = not na(amyxAMDManipBar) and bar_index - amyxAMDManipBar > amyxAMDExpiry

        if amyxBullDistribution
            amyxAMDDistEvent := true
            amyxAMDDistBar := bar_index
            if na(amyxAMDDistLabel)
                amyxAMDDistLabel := label.new(bar_index, high + amyOffset * 2.2, 'DIST', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(GREEN, 84), style = label.style_label_down, textcolor = GREEN, size = size.tiny)
            amyxAMDState := 3

        else if amyxBearDistribution
            amyxAMDDistEvent := true
            amyxAMDDistBar := bar_index
            if na(amyxAMDDistLabel)
                amyxAMDDistLabel := label.new(bar_index, low - amyOffset * 2.2, 'DIST', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(RED, 84), style = label.style_label_up, textcolor = RED, size = size.tiny)
            amyxAMDState := 3

        else if amyxBullInvalid or amyxBearInvalid or amyxAMDExpiredAfterManip
            // Incomplete cycle is discarded so an orphan MAN never remains on chart.
            amyxAMDState := 0
            amyxAMDDirection := 0
            if not na(amyxAMDBox)
                box.delete(amyxAMDBox)
                amyxAMDBox := na
            if not na(amyxAMDManLabel)
                label.delete(amyxAMDManLabel)
                amyxAMDManLabel := na

    else if amyxAMDState == 3
        // Keep exactly one completed ACC -> MAN -> DIST cycle visible.
        // Start a fresh cycle only after a short cooldown and a new valid accumulation.
        if not na(amyxAMDBox)
            box.set_right(amyxAMDBox, math.min(bar_index, nz(amyxAMDDistBar, bar_index)))

        bool amyxAMDNewCycleReady = not na(amyxAMDDistBar) and bar_index - amyxAMDDistBar >= 3 and amyxAMDAccumCandidate
        if amyxAMDNewCycleReady
            if not na(amyxAMDBox)
                box.delete(amyxAMDBox)
            if not na(amyxAMDManLabel)
                label.delete(amyxAMDManLabel)
            if not na(amyxAMDDistLabel)
                label.delete(amyxAMDDistLabel)

            amyxAMDBox := na
            amyxAMDManLabel := na
            amyxAMDDistLabel := na
            amyxAMDState := 1
            amyxAMDDirection := 0
            amyxAMDHigh := amyxAMDCandidateHigh
            amyxAMDLow := amyxAMDCandidateLow
            amyxAMDStartBar := bar_index - amyxAMDLength
            amyxAMDManipBar := na
            amyxAMDDistBar := na
            amyxAMDBox := box.new(amyxAMDStartBar, amyxAMDHigh, bar_index, amyxAMDLow, xloc = xloc.bar_index, bgcolor = color.new(BLUE, 96), border_color = color.new(BLUE, 65), text = 'ACC', text_color = BLUE, text_size = size.tiny, text_halign = text.align_center, text_valign = text.align_center)

if not amyxShowAMD and barstate.islast
    amyxAMDState := 0
    amyxAMDDirection := 0
    if not na(amyxAMDBox)
        box.delete(amyxAMDBox)
        amyxAMDBox := na
    if not na(amyxAMDManLabel)
        label.delete(amyxAMDManLabel)
        amyxAMDManLabel := na
    if not na(amyxAMDDistLabel)
        label.delete(amyxAMDDistLabel)
        amyxAMDDistLabel := na
'''.lstrip('\n')

          p.write_text(before + start_marker + new_amd + end_marker + after)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-X.pine
          git diff --cached --quiet && exit 0
          git commit -m "Make AMD sequence strict ACC MAN DIST"
          git push origin main
