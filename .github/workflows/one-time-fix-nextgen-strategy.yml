name: One-time Fix NextGen Strategy

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-nextgen-strategy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Pine constant timestamps
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AMY_ICT_NextGen_Strategy_Research.pine')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'startDate = input.time(timestamp(2019, 1, 1, 0, 0), "Backtest Start", group=grpTest)':
                  'startDate = input.time(1546272000000, "Backtest Start", group=grpTest)  // 2019-01-01 00:00 WITA',
              'endDate = input.time(timestamp(2030, 12, 31, 23, 59), "Backtest End", group=grpTest)':
                  'endDate = input.time(1924963140000, "Backtest End", group=grpTest)  // 2030-12-31 23:59 WITA',
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True

          if not changed:
              raise SystemExit('Timestamp lines are already corrected or no longer match.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMY_ICT_NextGen_Strategy_Research.pine
          git commit -m "fix: use constant WITA timestamps in Pine strategy"
          git push
