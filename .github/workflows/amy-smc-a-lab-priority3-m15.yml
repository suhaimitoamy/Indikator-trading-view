name: Amy SMC A LAB Priority3 M15 Baseline
on:
  push:
    paths:
      - '.github/workflows/amy-smc-a-lab-priority3-m15.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch A LAB M15 baseline only
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify invariants
        run: |
          grep -F "bool amyWfM5ParamGate = not na(amyRound9EntryRiskAtr) and amyRound9EntryRiskAtr >= 3.0" Amy-SMC-A-LAB.pine
          grep -F "float amyLabM5TargetCapR = amyLabM5HighRisk ? 0.35 : 0.375" Amy-SMC-A-LAB.pine
          grep -F "int amyTargetExpiryBarsNow = amyRound5M5 ? (amyLabM5HighRisk ? 192 : 60) : amyRound5M15 ? 32" Amy-SMC-A-LAB.pine
          grep -F "bool amyLabM15ZBaseline = true" Amy-SMC-A-LAB.pine
          grep -F "amyRound5M15 ? (amyLabM15ZBaseline ? amyFinalBias : 0)" Amy-SMC-A-LAB.pine
          grep -F "No M15 target cap, segmented target or expiry extension is active." Amy-SMC-A-LAB.pine
      - name: Commit A LAB only
        run: |
          git config user.name 'suhaimitoamy'
          git config user.email '34860608+suhaimitoamy@users.noreply.github.com'
          git add Amy-SMC-A-LAB.pine
          git diff --cached --check
          git commit -m 'test: restore M15 Z baseline after priority3 target expiry rejection'
          git push origin HEAD:main
