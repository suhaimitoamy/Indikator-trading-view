name: Amy SMC Z Round 10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/amy-smc-z-round10.yml'

permissions:
  contents: write

jobs:
  patch-round10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Round 10 quality grading patch
        run: |
          python .github/scripts/amy_smc_z_round10.py
          git diff --check -- Amy-SMC-Z.pine
          git diff --quiet -- Amy-SMC-Y.pine Amy-SMC-X.pine Amy-SMC.pine
          grep -q "TRADE • A+" Amy-SMC-Z.pine
          grep -q "amyRound10EntryBodyAtr >= 0.50" Amy-SMC-Z.pine
          grep -q "amyRound9EntryRiskAtr < 8.0" Amy-SMC-Z.pine
          grep -q "amyTargetRiskDistance \* 0.40" Amy-SMC-Z.pine
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-Z.pine
          git commit -m "Implement Amy SMC Z Round 10 A+ quality grading"
          git push
