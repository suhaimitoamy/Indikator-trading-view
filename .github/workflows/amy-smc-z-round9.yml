name: Amy SMC Z Round 9

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/amy-smc-z-round9.yml'

permissions:
  contents: write

jobs:
  patch-round9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Round 9 confirmed-transition patch
        run: |
          python .github/scripts/amy_smc_z_round9.py
          git diff --check -- Amy-SMC-Z.pine
          git diff --quiet -- Amy-SMC-Y.pine Amy-SMC-X.pine Amy-SMC.pine
          grep -q "amyRound9EntryRiskAtr >= 3.0" Amy-SMC-Z.pine
          grep -q "TRADE • CONFIRMED" Amy-SMC-Z.pine
          grep -q "WATCH • TRANSITION" Amy-SMC-Z.pine
          grep -q "amyProjectedTargetDistance = math.max(amyTargetRiskDistance \* 0.40, amyTargetAtr \* 0.22)" Amy-SMC-Z.pine
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-Z.pine
          git commit -m "Implement Amy SMC Z Round 9 confirmed transition gate"
          git push
