name: Tune Amy SMC X Weak Components

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-amy-smc-x-weak-components.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Tune weak components without touching LuxAlgo core
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          def repl(old, new, name):
              global s
              if old not in s:
                  raise SystemExit(f'{name} block not found')
              s = s.replace(old, new, 1)

          # 1) Pattern: keep all pattern types, but directional use requires agreement with accepted swing + internal structure.
          repl(
          """int amyPatternAge = na(amyLastPatternBar) ? 1000000 : bar_index - amyLastPatternBar
          bool amyPatternActive = amyLastPattern != 'NONE' and amyPatternAge <= amyPatternMaxAge
          int amyPatternBiasActive = amyPatternActive ? amyLastPatternDir : 0
          string amyPatternDisplay = amyPatternActive ? amyLastPattern : 'NONE'
          """,
          """int amyPatternAge = na(amyLastPatternBar) ? 1000000 : bar_index - amyLastPatternBar
          bool amyPatternActive = amyLastPattern != 'NONE' and amyPatternAge <= amyPatternMaxAge
          bool amyPatternStructureAligned = amyLastPatternDir != 0 and amyLastPatternDir == swingTrend.bias and amyLastPatternDir == internalTrend.bias
          int amyPatternBiasActive = amyPatternActive and amyPatternStructureAligned ? amyLastPatternDir : 0
          string amyPatternDisplay = amyPatternActive ? amyLastPattern : 'NONE'
          """, 'pattern context')

          # 2) Preserve the already-passed liquidity/event-history raw logic, but create stricter qualified sweep/break signals for chart/alerts and retest.
          old = """bool amyBSLSweep = barstate.isconfirmed and amyHighAvailable and high > amyBSL and close <= amyBSL and (na(amyLastSweptHigh) or amyLastSweptHigh != amyBSL) and (na(amyLastBrokenHigh) or amyLastBrokenHigh != amyBSL)
          bool amySSLSweep = barstate.isconfirmed and amyLowAvailable and low < amySSL and close >= amySSL and (na(amyLastSweptLow) or amyLastSweptLow != amySSL) and (na(amyLastBrokenLow) or amyLastBrokenLow != amySSL)
          bool amyBSLValidBreak = barstate.isconfirmed and amyHighAvailable and close > amyBSL and close[1] <= amyBSL and (na(amyLastBrokenHigh) or amyLastBrokenHigh != amyBSL)
          bool amySSLValidBreak = barstate.isconfirmed and amyLowAvailable and close < amySSL and close[1] >= amySSL and (na(amyLastBrokenLow) or amyLastBrokenLow != amySSL)
          """
          new = """bool amyBSLSweep = barstate.isconfirmed and amyHighAvailable and high > amyBSL and close <= amyBSL and (na(amyLastSweptHigh) or amyLastSweptHigh != amyBSL) and (na(amyLastBrokenHigh) or amyLastBrokenHigh != amyBSL)
          bool amySSLSweep = barstate.isconfirmed and amyLowAvailable and low < amySSL and close >= amySSL and (na(amyLastSweptLow) or amyLastSweptLow != amySSL) and (na(amyLastBrokenLow) or amyLastBrokenLow != amySSL)
          bool amyBSLValidBreak = barstate.isconfirmed and amyHighAvailable and close > amyBSL and close[1] <= amyBSL and (na(amyLastBrokenHigh) or amyLastBrokenHigh != amyBSL)
          bool amySSLValidBreak = barstate.isconfirmed and amyLowAvailable and close < amySSL and close[1] >= amySSL and (na(amyLastBrokenLow) or amyLastBrokenLow != amySSL)

          float amyEventAtr = ta.atr(14)
          float amyEventRange = high - low
          float amyEventBody = math.abs(close - open)
          float amyEventBodyRatio = amyEventRange > 0 ? amyEventBody / amyEventRange : 0.0
          bool amyEventDisplacement = not na(amyEventAtr) and amyEventBody >= amyEventAtr * 0.35 and amyEventBodyRatio >= 0.55
          float amyMinSweepExcursion = nz(amyEventAtr, 0.0) * 0.08
          float amyMinBreakExcursion = nz(amyEventAtr, 0.0) * 0.05
          bool amyQualifiedBSLSweep = amyBSLSweep and high >= amyBSL + amyMinSweepExcursion and close >= amyBSL - nz(amyEventAtr, 0.0) * 0.20
          bool amyQualifiedSSLSweep = amySSLSweep and low <= amySSL - amyMinSweepExcursion and close <= amySSL + nz(amyEventAtr, 0.0) * 0.20
          bool amyQualifiedBSLValidBreak = amyBSLValidBreak and amyEventDisplacement and close > open and close >= amyBSL + amyMinBreakExcursion
          bool amyQualifiedSSLValidBreak = amySSLValidBreak and amyEventDisplacement and close < open and close <= amySSL - amyMinBreakExcursion

          bool amyQualifiedSwingBullBOS = barstate.isconfirmed and currentAlerts.swingBullishBOS and amyEventDisplacement and close > open
          bool amyQualifiedSwingBearBOS = barstate.isconfirmed and currentAlerts.swingBearishBOS and amyEventDisplacement and close < open
          bool amyQualifiedSwingBullCHoCH = barstate.isconfirmed and currentAlerts.swingBullishCHoCH and amyEventDisplacement and close > open
          bool amyQualifiedSwingBearCHoCH = barstate.isconfirmed and currentAlerts.swingBearishCHoCH and amyEventDisplacement and close < open
          """
          repl(old, new, 'qualified structure events')

          for raw, qual, name in [
              ("if amyShowEvents\n        amyAddChartLabel(bar_index, high + amyOffset, 'SWEEP', true, RED)", "if amyShowEvents and amyQualifiedBSLSweep\n        amyAddChartLabel(bar_index, high + amyOffset, 'SWEEP', true, RED)", 'BSL sweep label'),
              ("if amyShowEvents\n        amyAddChartLabel(bar_index, low - amyOffset, 'SWEEP', false, GREEN)", "if amyShowEvents and amyQualifiedSSLSweep\n        amyAddChartLabel(bar_index, low - amyOffset, 'SWEEP', false, GREEN)", 'SSL sweep label'),
              ("if amyShowEvents\n        amyAddChartLabel(bar_index, high + amyOffset, 'VALID BREAK', true, GREEN)", "if amyShowEvents and amyQualifiedBSLValidBreak\n        amyAddChartLabel(bar_index, high + amyOffset, 'VALID BREAK', true, GREEN)", 'BSL break label'),
              ("if amyShowEvents\n        amyAddChartLabel(bar_index, low - amyOffset, 'VALID BREAK', false, RED)", "if amyShowEvents and amyQualifiedSSLValidBreak\n        amyAddChartLabel(bar_index, low - amyOffset, 'VALID BREAK', false, RED)", 'SSL break label'),
          ]:
              repl(raw, qual, name)

          # 3) Dealing range: lock to the most recent confirmed swing impulse instead of the ever-expanding trailing range.
          repl(
          """float amyRangeTop = trailing.top
          float amyRangeBottom = trailing.bottom
          float amyRangeEQ = not na(amyRangeTop) and not na(amyRangeBottom) ? math.avg(amyRangeTop, amyRangeBottom) : na
          string amyDealingRange = 'EQUILIBRIUM'
          int amyDealingBias = 0
          if not na(amyRangeEQ)
              if close > amyRangeEQ
                  amyDealingRange := 'PREMIUM'
                  amyDealingBias := BEARISH
              else if close < amyRangeEQ
                  amyDealingRange := 'DISCOUNT'
                  amyDealingBias := BULLISH
          """,
          """var float amyDRTop = na
          var float amyDRBottom = na
          var int amyDRBias = 0

          bool amyDRBullEvent = barstate.isconfirmed and (currentAlerts.swingBullishBOS or currentAlerts.swingBullishCHoCH)
          bool amyDRBearEvent = barstate.isconfirmed and (currentAlerts.swingBearishBOS or currentAlerts.swingBearishCHoCH)

          if amyDRBullEvent and not na(swingLow.currentLevel)
              amyDRBottom := swingLow.currentLevel
              amyDRTop := math.max(high, nz(swingHigh.currentLevel, high))
              amyDRBias := BULLISH
          else if amyDRBearEvent and not na(swingHigh.currentLevel)
              amyDRTop := swingHigh.currentLevel
              amyDRBottom := math.min(low, nz(swingLow.currentLevel, low))
              amyDRBias := BEARISH
          else if na(amyDRTop) and not na(swingHigh.currentLevel) and not na(swingLow.currentLevel) and swingHigh.currentLevel > swingLow.currentLevel
              amyDRTop := swingHigh.currentLevel
              amyDRBottom := swingLow.currentLevel
              amyDRBias := swingTrend.bias

          bool amyDRValid = not na(amyDRTop) and not na(amyDRBottom) and amyDRTop > amyDRBottom
          float amyRangeTop = amyDRValid ? amyDRTop : na
          float amyRangeBottom = amyDRValid ? amyDRBottom : na
          float amyRangeSpan = amyDRValid ? amyRangeTop - amyRangeBottom : na
          float amyRangeEQ = amyDRValid ? math.avg(amyRangeTop, amyRangeBottom) : na
          float amyEQUpper = amyDRValid ? amyRangeBottom + amyRangeSpan * 0.525 : na
          float amyEQLower = amyDRValid ? amyRangeBottom + amyRangeSpan * 0.475 : na
          string amyDealingRange = 'EQUILIBRIUM'
          int amyDealingBias = 0
          if amyDRValid
              if close > amyEQUpper
                  amyDealingRange := 'PREMIUM'
                  amyDealingBias := amyDRBias == BEARISH ? BEARISH : 0
              else if close < amyEQLower
                  amyDealingRange := 'DISCOUNT'
                  amyDealingBias := amyDRBias == BULLISH ? BULLISH : 0
          """, 'locked dealing range')

          # 4) Target ladder: only use liquidity families already accepted in the checklist plus the confirmed swing/recent fallback.
          marker = """amyNearestBelow(float a, float b, float c, float d, float reference) =>
              float result = na
              if not na(a) and a < reference
                  result := a
              if not na(b) and b < reference and (na(result) or b > result)
                  result := b
              if not na(c) and c < reference and (na(result) or c > result)
                  result := c
              if not na(d) and d < reference and (na(result) or d > result)
                  result := d
              result
          """
          extra = marker + """
          amyNearestAbove6(float a, float b, float c, float d, float e, float f, float reference) =>
              float result = na
              if not na(a) and a > reference
                  result := a
              if not na(b) and b > reference and (na(result) or b < result)
                  result := b
              if not na(c) and c > reference and (na(result) or c < result)
                  result := c
              if not na(d) and d > reference and (na(result) or d < result)
                  result := d
              if not na(e) and e > reference and (na(result) or e < result)
                  result := e
              if not na(f) and f > reference and (na(result) or f < result)
                  result := f
              result

          amyNearestBelow6(float a, float b, float c, float d, float e, float f, float reference) =>
              float result = na
              if not na(a) and a < reference
                  result := a
              if not na(b) and b < reference and (na(result) or b > result)
                  result := b
              if not na(c) and c < reference and (na(result) or c > result)
                  result := c
              if not na(d) and d < reference and (na(result) or d > result)
                  result := d
              if not na(e) and e < reference and (na(result) or e > result)
                  result := e
              if not na(f) and f < reference and (na(result) or f > result)
                  result := f
              result
          """
          repl(marker, extra, 'target helper expansion')

          repl(
          """float amyRecentHigh = ta.highest(high[1], 50)
          float amyRecentLow = ta.lowest(low[1], 50)
          float amyForwardBSL = amyNearestAbove(swingHigh.currentLevel, equalHigh.currentLevel, internalHigh.currentLevel, amyRecentHigh, close)
          float amyForwardSSL = amyNearestBelow(swingLow.currentLevel, equalLow.currentLevel, internalLow.currentLevel, amyRecentLow, close)
          """,
          """float amyRecentHigh = ta.highest(high[1], 50)
          float amyRecentLow = ta.lowest(low[1], 50)
          [amyPDH, amyPDL] = request.security(syminfo.tickerid, 'D', [high[1], low[1]], lookahead = barmerge.lookahead_on)
          [amyPWH, amyPWL] = request.security(syminfo.tickerid, 'W', [high[1], low[1]], lookahead = barmerge.lookahead_on)
          float amyWeakHigh = swingTrend.bias == BULLISH ? trailing.top : na
          float amyWeakLow = swingTrend.bias == BEARISH ? trailing.bottom : na
          float amyForwardBSL = amyNearestAbove6(equalHigh.currentLevel, amyWeakHigh, amyPDH, amyPWH, swingHigh.currentLevel, amyRecentHigh, close)
          float amyForwardSSL = amyNearestBelow6(equalLow.currentLevel, amyWeakLow, amyPDL, amyPWL, swingLow.currentLevel, amyRecentLow, close)
          """, 'passed liquidity target ladder')

          # 5) Further qualify pattern by HTF + locked dealing location. Pattern remains visible, but only contextual patterns are directional.
          repl(
          """int amyCurrentSwingBias = swingTrend.bias
          int amyCurrentInternalBias = internalTrend.bias
          int amySafeHTFBias = na(amyHTFSwing) ? 0 : amyHTFSwing

          // PASSED CORE — Jun-Jul 2026 backtest checkpoint.
          """,
          """int amyCurrentSwingBias = swingTrend.bias
          int amyCurrentInternalBias = internalTrend.bias
          int amySafeHTFBias = na(amyHTFSwing) ? 0 : amyHTFSwing
          bool amyPatternHTFAligned = amyPatternBiasActive != 0 and (amySafeHTFBias == 0 or amyPatternBiasActive == amySafeHTFBias)
          bool amyPatternLocationAligned = amyPatternBiasActive == BULLISH ? amyDealingRange != 'PREMIUM' : amyPatternBiasActive == BEARISH ? amyDealingRange != 'DISCOUNT' : false
          amyPatternBiasActive := amyPatternBiasActive != 0 and amyPatternHTFAligned and amyPatternLocationAligned ? amyPatternBiasActive : 0

          // PASSED CORE — Jun-Jul 2026 backtest checkpoint.
          """, 'pattern HTF/location filter')

          # 6) Invalidation: use the protected swing first; internal/trailing levels are fallbacks only.
          repl(
          """float amyBullInvalidation = amyNearestBelow(swingLow.currentLevel, trailing.bottom, amyRecentLow, internalLow.currentLevel, close)
          float amyBearInvalidation = amyNearestAbove(swingHigh.currentLevel, trailing.top, amyRecentHigh, internalHigh.currentLevel, close)
          float amyInvalidation = amyFinalBias == BULLISH ? amyBullInvalidation : amyBearInvalidation
          """,
          """float amyProtectedLow = not na(swingLow.currentLevel) and swingLow.currentLevel < close ? swingLow.currentLevel : na
          float amyProtectedHigh = not na(swingHigh.currentLevel) and swingHigh.currentLevel > close ? swingHigh.currentLevel : na
          float amyBullInvalidation = not na(amyProtectedLow) ? amyProtectedLow : amyNearestBelow(trailing.bottom, amyRecentLow, internalLow.currentLevel, na, close)
          float amyBearInvalidation = not na(amyProtectedHigh) ? amyProtectedHigh : amyNearestAbove(trailing.top, amyRecentHigh, internalHigh.currentLevel, na, close)
          float amyInvalidation = amyFinalBias == BULLISH ? amyBullInvalidation : amyBearInvalidation
          """, 'protected invalidation')

          # 7) OTE/Fib: lock only a displacement-backed swing impulse. Remove arbitrary initial raw-range lock.
          repl(
          """bool amyxBullStructureEvent = barstate.isconfirmed and (currentAlerts.swingBullishBOS or currentAlerts.swingBullishCHoCH)
          bool amyxBearStructureEvent = barstate.isconfirmed and (currentAlerts.swingBearishBOS or currentAlerts.swingBearishCHoCH)

          if amyxBullStructureEvent and not na(swingLow.currentLevel)
              amyxLockedBottom := swingLow.currentLevel
              amyxLockedTop := math.max(high, nz(swingHigh.currentLevel, high))
              amyxLockedBias := BULLISH
              amyxLockedStartBar := swingLow.barIndex
              amyxLockedEndBar := bar_index
          else if amyxBearStructureEvent and not na(swingHigh.currentLevel)
              amyxLockedTop := swingHigh.currentLevel
              amyxLockedBottom := math.min(low, nz(swingLow.currentLevel, low))
              amyxLockedBias := BEARISH
              amyxLockedStartBar := swingHigh.barIndex
              amyxLockedEndBar := bar_index
          else if na(amyxLockedTop) and amyxRawRangeValid
              amyxLockedTop := amyxRawSwingTop
              amyxLockedBottom := amyxRawSwingBottom
              amyxLockedBias := swingTrend.bias == BEARISH ? BEARISH : BULLISH
              amyxLockedStartBar := amyxLockedBias == BULLISH ? swingLow.barIndex : swingHigh.barIndex
              amyxLockedEndBar := amyxLockedBias == BULLISH ? swingHigh.barIndex : swingLow.barIndex
          """,
          """float amyxImpulseAtr = ta.atr(14)
          float amyxImpulseRange = high - low
          float amyxImpulseBody = math.abs(close - open)
          float amyxImpulseBodyRatio = amyxImpulseRange > 0 ? amyxImpulseBody / amyxImpulseRange : 0.0
          bool amyxImpulseDisplacement = not na(amyxImpulseAtr) and amyxImpulseBody >= amyxImpulseAtr * 0.45 and amyxImpulseBodyRatio >= 0.55
          bool amyxBullStructureEvent = barstate.isconfirmed and (currentAlerts.swingBullishBOS or currentAlerts.swingBullishCHoCH) and amyxImpulseDisplacement and close > open and close >= high - amyxImpulseRange * 0.25
          bool amyxBearStructureEvent = barstate.isconfirmed and (currentAlerts.swingBearishBOS or currentAlerts.swingBearishCHoCH) and amyxImpulseDisplacement and close < open and close <= low + amyxImpulseRange * 0.25

          if amyxBullStructureEvent and not na(swingLow.currentLevel)
              amyxLockedBottom := swingLow.currentLevel
              amyxLockedTop := math.max(high, nz(swingHigh.currentLevel, high))
              amyxLockedBias := BULLISH
              amyxLockedStartBar := swingLow.barIndex
              amyxLockedEndBar := bar_index
          else if amyxBearStructureEvent and not na(swingHigh.currentLevel)
              amyxLockedTop := swingHigh.currentLevel
              amyxLockedBottom := math.min(low, nz(swingLow.currentLevel, low))
              amyxLockedBias := BEARISH
              amyxLockedStartBar := swingHigh.barIndex
              amyxLockedEndBar := bar_index
          """, 'OTE/Fib qualified impulse')

          repl(
          """bool amyxOTETouch = barstate.isconfirmed and amyxShowOTE and amyxRangeValid and high >= amyxOTEBottom and low <= amyxOTETop
          """,
          """var int amyxLastOTETouchLeg = na
          bool amyxOTERawTouch = barstate.isconfirmed and amyxShowOTE and amyxRangeValid and high >= amyxOTEBottom and low <= amyxOTETop
          bool amyxOTETouch = amyxOTERawTouch and (na(amyxLastOTETouchLeg) or amyxLastOTETouchLeg != amyxLockedEndBar)
          if amyxOTETouch
              amyxLastOTETouchLeg := amyxLockedEndBar
          """, 'one-shot OTE touch')

          # 8) Amy custom alerts use the qualified weak-component layer. Passed raw event history remains untouched.
          repl(
          """alertcondition(amyBSLSweep or amySSLSweep, 'Liquidity Sweep', 'Liquidity sweep detected')
          alertcondition(amyBSLValidBreak or amySSLValidBreak, 'Valid Break', 'Valid structure/liquidity break detected')
          alertcondition(barstate.isconfirmed and amyPatternNow != 'NONE', 'Candlestick Pattern', 'Candlestick pattern detected')
          """,
          """alertcondition(amyQualifiedBSLSweep or amyQualifiedSSLSweep, 'Liquidity Sweep', 'Qualified liquidity sweep detected')
          alertcondition(amyQualifiedBSLValidBreak or amyQualifiedSSLValidBreak, 'Valid Break', 'Qualified structure/liquidity break detected')
          alertcondition(barstate.isconfirmed and amyPatternBiasActive != 0, 'Candlestick Pattern', 'Context-qualified candlestick pattern detected')
          """, 'qualified custom alerts')

          # Guards: AMD remains removed; accepted directional core remains isolated; LuxAlgo core section before AMY add-on is not rewritten.
          assert 'AMYX_AMD_GROUP' not in s
          assert "float amyFinalScore = amySafeHTFBias * 35 + amyCurrentSwingBias * 30 + amyCurrentInternalBias * 20 + amyLiquidityBiasActive * 15" in s
          assert "float amyContextScore = amySafeHTFBias * 25 + amyCurrentSwingBias * 25 + amyCurrentInternalBias * 15 + amyLiquidityBiasActive * 15" in s
          assert "amyForwardBSL = amyNearestAbove6" in s
          assert "amyDRBullEvent" in s
          assert "amyxImpulseDisplacement" in s
          assert "amyxLastOTETouchLeg" in s

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Tune Amy SMC X weak component logic'
          git push
