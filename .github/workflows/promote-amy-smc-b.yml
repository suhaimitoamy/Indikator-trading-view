name: Promote Amy SMC B Baseline
on:
  push:
    paths: ['.github/workflows/promote-amy-smc-b.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Build B and B-LAB
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify scope and frozen refs
        run: |
          git diff --check
          test "$(git hash-object Amy-SMC-Z.pine)" = "389036df09d03125a2f71189722953658a901170"
          test "$(git hash-object Amy-SMC-A.pine)" = "edb769a2bcfc59fe53237eda2a926fe31a14003b"
          test "$(git hash-object Amy-SMC-A-LAB.pine)" = "66b80304c44556040dc587557913bda309ca7b7d"
          test "$(git status --porcelain | awk '{print $2}' | sort | tr '\n' ' ')" = "Amy-SMC-B-LAB.pine Amy-SMC-B.pine "
          grep -F "float amyBM5TargetCapR = amyBM5HighRisk ? 0.35 : 0.375" Amy-SMC-B.pine
          grep -F "amyRound5M15 ? 32 : amyRound5H1 ? 24" Amy-SMC-B.pine
      - name: Commit B baseline
        run: |
          git config user.name suhaimitoamy
          git config user.email 34860608+suhaimitoamy@users.noreply.github.com
          git add Amy-SMC-B.pine Amy-SMC-B-LAB.pine
          git commit -m 'feat: promote Amy SMC B baseline with M5 TGT2'
          git push origin HEAD:main
