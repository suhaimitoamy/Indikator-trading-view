name: Fix Amy SMC Z SMA Warning

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-amy-smc-z-sma-warning.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply SMA warning fix
        run: |
          python .github/scripts/fix_amy_smc_z_sma_warning.py
          git diff --check
          git diff --exit-code -- Amy-SMC-Z.pine && { echo 'Expected Amy-SMC-Z.pine to change'; exit 1; } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-Z.pine
          git commit -m 'Fix Amy SMC Z ta.sma consistency warning'
          git push origin main
