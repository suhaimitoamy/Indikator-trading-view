name: Amy SMC Z OF16

on:
  push:
    branches:
      - experiment/amy-smc-z-of16
    paths:
      - '.github/workflows/amy-smc-z-of16.yml'

permissions:
  contents: write

jobs:
  build-of16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build intentional 2010-2026 overfit copy
        run: |
          python .github/scripts/amy_smc_z_of16.py
          git diff --check -- Amy-SMC-Z-OF16.pine
          git diff --quiet -- Amy-SMC-Z.pine Amy-SMC-Y.pine Amy-SMC-X.pine Amy-SMC.pine
          grep -q "Amy SMC Z OF16" Amy-SMC-Z-OF16.pine
          grep -q "amyRound5M15 and amySweepContinuationQualified" Amy-SMC-Z-OF16.pine
          grep -q "amyBreakBodyAtr < 2.00" Amy-SMC-Z-OF16.pine
          grep -q "amyTargetRiskDistance \* 0.28" Amy-SMC-Z-OF16.pine
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-Z-OF16.pine
          if git diff --cached --quiet; then
            echo "No OF16 output generated"
            exit 1
          fi
          git commit -m "Create Amy SMC Z OF16 intentional full-sample overfit"
          git push
