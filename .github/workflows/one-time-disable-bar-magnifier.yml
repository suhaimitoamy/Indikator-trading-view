name: One-time Disable Bar Magnifier

on:
  push:
    paths:
      - '.github/workflows/one-time-disable-bar-magnifier.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Premium-only bar magnifier
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AMY_ICT_NextGen_Strategy_Research.pine')
          text = path.read_text(encoding='utf-8')

          old = 'calc_on_order_fills=true, calc_on_every_tick=false, use_bar_magnifier=true,'
          new = 'calc_on_order_fills=true, calc_on_every_tick=false, use_bar_magnifier=false,'

          if old not in text:
              raise SystemExit('Expected strategy setting was not found.')

          text = text.replace(old, new, 1)
          text = text.replace(
              '// Set commission, spread/slippage, order size, and Bar Magnifier in Strategy\n// Properties before evaluating live feasibility.',
              '// Set commission, spread/slippage, and order size in Strategy Properties.\n// Bar Magnifier is disabled so the script remains usable on free plans.',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMY_ICT_NextGen_Strategy_Research.pine
          git commit -m "fix: disable Premium-only bar magnifier"
          git push
