name: Amy SMC A LAB M5 Priority1 Rollback
on:
  push:
    paths:
      - '.github/workflows/amy-smc-a-lab-m5-priority1-rollback.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch only Amy SMC A LAB
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-A-LAB.pine')
          s = p.read_text()
          old_gate = "bool amyWfM5ParamGate = amyEventBodyRatio >= 0.30 and amyBreakBodyAtr >= 0.35 and amyBreakBodyAtr < 2.50 and not na(amyRound9EntryRiskAtr) and amyRound9EntryRiskAtr >= 3.0 and amyRound9EntryRiskAtr < 8.0"
          new_gate = "bool amyWfM5ParamGate = not na(amyRound9EntryRiskAtr) and amyRound9EntryRiskAtr >= 3.0"
          if old_gate not in s:
              raise SystemExit('expected M5 gate not found')
          s = s.replace(old_gate, new_gate, 1)
          s = s.replace('// AMY SMC A WALK-FORWARD DEPLOYMENT GATE — selected using train 2018–2025 only.', '// AMY SMC A LAB PRIORITY #1 — no clean WFO winner; M5 rolled back to the frozen Z Round-9 execution gate.', 1)
          s = s.replace('// 2026 Jan–Jul remains out-of-sample and was not used to select these thresholds.', '// Fresh raw 2004–2026 train-only WFO: no candidate met direction >=75%, TP >=67.5824%, expectancy >=+0.042195R and 15/15 HC together.', 1)
          s = s.replace('// Latest M5 train-only set: body ratio >= 0.30, body/ATR 0.35–2.50, structural room 3.0–8.0 ATR.', '// Final LAB gate = directional candle confirmation (below) + structural room >=3 ATR; no body filter and no risk upper cap.', 1)
          s = s.replace("amyRound10M5APlus ? 'WF PROV • A+' : 'WF PROV • A'", "amyRound10M5APlus ? 'LAB Z-BASE • A+' : 'LAB Z-BASE • A'", 1)
          s = s.replace('// Walk-forward promotion status. M5 is provisional because most annual OOS windows have <30 signals.', '// Priority #1 result: M5 uses the frozen Z benchmark gate in LAB because no tested alternative won cleanly across all targets.', 1)
          s = s.replace('bool amyWfM5Provisional = true', 'bool amyWfM5Provisional = false', 1)
          marker = '// AMY SMC A ROUND 10 RESULT LOCK'
          note = '// AMY SMC A LAB PRIORITY #1 M5 RESULT LOCK\n// Z benchmark: 691 OOS, 75.11% directional, 57.74% TP, +0.0085R, 15/15 HC.\n// A-current extra gate: 364 OOS, 70.05% directional, 67.58% TP, +0.0422R, 1/15 HC.\n// Diagnostic: the A extra gate dropped 327 Z-valid signals whose directional accuracy was 80.73%; riskATR >=8 alone dropped 153 signals at 92.81% directional.\n// No train-selected body/risk/dead-zone/close/side-asymmetric/volatility/tree/logistic gate met all four required targets.\n// Keep Z Round-9 M5 execution semantics in LAB until a future experiment beats it cleanly.\n\n'
          if marker in s and 'AMY SMC A LAB PRIORITY #1 M5 RESULT LOCK' not in s:
              s = s.replace(marker, note + marker, 1)
          p.write_text(s)
          PY
          git config user.name 'suhaimitoamy'
          git config user.email '34860608+suhaimitoamy@users.noreply.github.com'
          git add Amy-SMC-A-LAB.pine
          git diff --cached --check
          git commit -m 'test: rollback A LAB M5 gate to Z benchmark'
          git push origin HEAD:main
