name: Lock Amy SMC X Passed Round 3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lock-amy-smc-x-passed-round3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Lock passed profiles without changing behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          old = "float amyPremiumGate = amyDRValid ? amyRangeBottom + amyRangeSpan * 0.65 : na\nfloat amyDiscountGate = amyDRValid ? amyRangeBottom + amyRangeSpan * 0.35 : na\n"
          new = "// PASSED PROFILE — Dealing Range H1: 83.33% (5/6). Keep this 65/35 profile unchanged while lower-TF variants remain under tuning.\nfloat amyPassedDRPremiumRatio = 0.65\nfloat amyPassedDRDiscountRatio = 0.35\nfloat amyPremiumGate = amyDRValid ? amyRangeBottom + amyRangeSpan * amyPassedDRPremiumRatio : na\nfloat amyDiscountGate = amyDRValid ? amyRangeBottom + amyRangeSpan * amyPassedDRDiscountRatio : na\n"
          if old not in s:
              raise SystemExit('Dealing Range gate block not found')
          s = s.replace(old, new, 1)

          ote_marker = "// OTE — 0.62 / 0.705 / 0.79\n"
          ote_new = "// PASSED CHECKPOINT — OTE→1.272 M15: 85.71% (6/7). Preserve the current locked-leg/OTE profile.\n" + ote_marker
          if ote_marker not in s:
              raise SystemExit('OTE marker not found')
          s = s.replace(ote_marker, ote_new, 1)

          fib_marker = "// FIBONACCI EXTENSION — TP1 / TP2 / MAX\n"
          fib_new = "// PASSED CHECKPOINT — Fib 1.272: M5 70.27% (26/37), M15 81.82% (9/11). Preserve TP1 ratio/profile.\n" + fib_marker
          if fib_marker not in s:
              raise SystemExit('Fib marker not found')
          s = s.replace(fib_marker, fib_new, 1)

          old_fib = "float amyxFibMaxRatio = amyxFibMaxInput == '2.618' ? 2.618 : 2.0\nfloat amyxFib1272 = na\n"
          new_fib = "float amyxFibMaxRatio = amyxFibMaxInput == '2.618' ? 2.618 : 2.0\nfloat amyxPassedFibTP1Ratio = 1.272\nfloat amyxFib1272 = na\n"
          if old_fib not in s:
              raise SystemExit('Fib ratio block not found')
          s = s.replace(old_fib, new_fib, 1)
          s = s.replace("amyxSwingBottom + amyxSwingRange * 1.272", "amyxSwingBottom + amyxSwingRange * amyxPassedFibTP1Ratio", 1)
          s = s.replace("amyxSwingTop - amyxSwingRange * 1.272", "amyxSwingTop - amyxSwingRange * amyxPassedFibTP1Ratio", 1)

          p.write_text(s)
          PY
      - name: Commit indicator lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Lock newly passed Amy SMC X profiles'
          git push
