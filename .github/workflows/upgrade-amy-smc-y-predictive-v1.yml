name: Upgrade Amy SMC Y Predictive V1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upgrade-amy-smc-y-predictive-v1.yml'

permissions:
  contents: write

jobs:
  upgrade-y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Upgrade Amy SMC Y predictive layer only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          x_before="$(git hash-object Amy-SMC-X.pine)"
          orig_before="$(git hash-object Amy-SMC.pine)"
          python .github/scripts/upgrade_amy_smc_y_predictive_v1.py
          test "$x_before" = "$(git hash-object Amy-SMC-X.pine)"
          test "$orig_before" = "$(git hash-object Amy-SMC.pine)"
          git add Amy-SMC-Y.pine
          git diff --cached --check
          test "$(git diff --cached --name-only | tr -d '\r')" = "Amy-SMC-Y.pine"
          git commit -m 'Improve Amy SMC Y predictive layer from 2010-2026 validation'
          git push
