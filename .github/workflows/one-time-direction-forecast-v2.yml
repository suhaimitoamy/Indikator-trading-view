name: Apply isolated Direction Forecast v2

on:
  push:
    branches:
      - feature/direction-forecast-20260714
    paths:
      - .github/workflows/one-time-direction-forecast-v2.yml
      - scripts/apply_direction_forecast_v2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/direction-forecast-20260714

      - name: Apply Direction Forecast v2 only
        run: python scripts/apply_direction_forecast_v2.py

      - name: Commit validated Direction Forecast
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-direction-forecast-v2.yml scripts/apply_direction_forecast_v2.py
          git add AMY_ICT_NextGen.pine DIRECTION_FORECAST_BACKTEST.md
          git commit -m "feat(forecast): validate selective direction engine"
          git push origin HEAD:feature/direction-forecast-20260714
