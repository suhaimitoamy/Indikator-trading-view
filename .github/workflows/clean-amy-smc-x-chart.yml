name: Clean Amy SMC X chart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-amy-smc-x-chart.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reduce chart clutter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          replacements = [
              ("amyShowBoxPrices     = input.bool(true, 'FVG / OB Prices', group = AMY_CHART_GROUP)",
               "amyShowBoxPrices     = input.bool(false, 'FVG / OB Prices', group = AMY_CHART_GROUP)"),
              ("amyShowLevelPrices   = input.bool(true, 'EQH/EQL + Strong/Weak Prices', group = AMY_CHART_GROUP)",
               "amyShowLevelPrices   = input.bool(false, 'EQH/EQL + Strong/Weak Prices', group = AMY_CHART_GROUP)"),
              ("if array.size(amyChartLabels) > 80", "if array.size(amyChartLabels) > 3"),
              ("bgcolor = color.new(BLUE, 92), border_color = color.new(BLUE, 55)",
               "bgcolor = color.new(BLUE, 96), border_color = color.new(BLUE, 72)"),
              ("amyxFibExtendBars = input.int(20, 'Extend Bars', minval = 5, maxval = 100, group = AMYX_FIB_GROUP)",
               "amyxFibExtendBars = input.int(12, 'Extend Bars', minval = 5, maxval = 100, group = AMYX_FIB_GROUP)"),
              ("amyxOTEExtendBars = input.int(20, 'Extend Bars', minval = 5, maxval = 100, group = AMYX_OTE_GROUP)",
               "amyxOTEExtendBars = input.int(12, 'Extend Bars', minval = 5, maxval = 100, group = AMYX_OTE_GROUP)")
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'target not found: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-X.pine
          git diff --cached --quiet && exit 0
          git commit -m "Reduce Amy SMC X chart clutter"
          git push origin main
