name: Amy SMC X Round 5 Predictive Refinement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/amy-smc-x-round5-predictive.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Round 5 predictive refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/amy_smc_x_round5_predictive.py
          git add Amy-SMC-X.pine
          git diff --cached --check
          test "$(git diff --cached --name-only | tr -d '\r')" = "Amy-SMC-X.pine"
          git commit -m 'Refine Amy SMC X predictive components round 5'
          git push
