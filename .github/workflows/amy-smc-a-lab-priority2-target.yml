name: Amy SMC A LAB Priority2 Target Patch
on:
  push:
    paths:
      - '.github/workflows/amy-smc-a-lab-priority2-target.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch A LAB target only
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify entry gate unchanged
        run: |
          grep -F "bool amyWfM5ParamGate = not na(amyRound9EntryRiskAtr) and amyRound9EntryRiskAtr >= 3.0" Amy-SMC-A-LAB.pine
          grep -F "bool amyRound9EntryConfirmed = amyRound9CandleConfirm and amyWfM5ParamGate" Amy-SMC-A-LAB.pine
          grep -F "int amyTargetExpiryBars = amyRound5M5 ? (amyLabM5HighRisk ? 192 : 60)" Amy-SMC-A-LAB.pine
      - name: Commit A LAB only
        run: |
          git config user.name 'suhaimitoamy'
          git config user.email '34860608+suhaimitoamy@users.noreply.github.com'
          git add Amy-SMC-A-LAB.pine
          git diff --cached --check
          git commit -m 'test: A LAB M5 segmented target expiry'
          git push origin HEAD:main
