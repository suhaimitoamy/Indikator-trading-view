name: Amy SMC Y Round 6

on:
  push:
    paths:
      - '.github/workflows/amy-smc-y-round6.yml'

permissions:
  contents: write

jobs:
  round6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Round 6 predictive best-of candidate
        run: |
          python .github/scripts/amy_smc_y_round6.py
          git diff --check -- Amy-SMC-Y.pine
          git diff --quiet -- Amy-SMC-X.pine Amy-SMC.pine
          grep -q "AMY SMC Y ROUND 6 — liquidity-conflict pattern regime" Amy-SMC-Y.pine
          grep -q "amyBreakBodyAtr < 1.50" Amy-SMC-Y.pine
          grep -q "string amyNextMove = amyNextDirection == BULLISH ? 'UP' : 'DOWN'" Amy-SMC-Y.pine
          grep -q "TARGET V1 — target is ALWAYS available" Amy-SMC-Y.pine
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-Y.pine
          if git diff --cached --quiet; then
            echo "No indicator changes"
            exit 1
          fi
          git commit -m "Improve Amy SMC Y predictive round 6 regimes"
          git push
