name: Rename Amy SMC Z internal title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-amy-smc-z.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename indicator title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Amy-SMC-Z.pine')
          text = path.read_text()
          old = "indicator('Amy SMC Y', 'Amy SMC Y'"
          new = "indicator('Amy SMC Z', 'Amy SMC Z'"
          if old not in text:
              raise SystemExit('Expected Amy SMC Y indicator declaration was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-Z.pine
          git diff --cached --quiet && exit 0
          git commit -m "chore: rename Amy SMC Z indicator title"
          git push origin HEAD:main
