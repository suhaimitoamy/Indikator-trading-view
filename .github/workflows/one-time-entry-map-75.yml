name: Apply Entry Map calibration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-entry-map-75.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Calibrate Entry Map only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AMY_ICT_NextGen.pine")
          text = path.read_text(encoding="utf-8")

          start_marker = "// ============================================================================\n// COMPACT ENTRY MAP — CHART ONLY, ONE LIVE SETUP"
          end_marker = "// ============================================================================\n// EVENT HISTORY"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          prefix = text[:start]
          suffix = text[end:]

          old_profile = '''profileExpiryBars = profileM5 ? 96 : profileM15 ? 72 : 36
          profileTp2R = profileM15 ? 1.75 : 2.0
          effectiveSlAtrPad = entryProfile == "Auto" and profileH1 ? 0.30 : slAtrPad
          profileNeedsPoi = profileM5 or profileH1
          profileBullTrigger = profileM5 ? mssBull : mssBull or bosBull
          profileBearTrigger = profileM5 ? mssBear : mssBear or bosBear'''

          new_profile = '''profileExpiryBars = profileM5 ? 48 : profileM15 ? 36 : 36
          profileTp1R = profileM5 ? 0.50 : profileM15 ? 0.35 : 0.30
          profileTp2R = profileM5 ? 1.25 : 1.75
          calibratedSlAtrPad = profileM5 ? 0.20 : profileM15 ? 0.10 : 0.25
          effectiveSlAtrPad = entryProfile == "Auto" ? calibratedSlAtrPad : slAtrPad
          profileMaxRiskAtr = 6.0
          profileSweepMemory = profileM5 ? 36 : profileM15 ? 12 : 18
          profileNeedsPoi = profileM5
          profileBullTrigger = mssBull
          profileBearTrigger = mssBear
          entryRecentBuySweep = not na(lastBuySweepBar) and bar_index - lastBuySweepBar <= profileSweepMemory
          entryRecentSellSweep = not na(lastSellSweepBar) and bar_index - lastSellSweepBar <= profileSweepMemory
          profileSessionValid = profileH1 ? inNY : validSession
          profileBullCandle = profileM5 ? close > open : profileM15 ? close >= low + barRange * 0.70 : close > open
          profileBearCandle = profileM5 ? close < open : profileM15 ? close <= high - barRange * 0.70 : close < open
          profileBullProbability = not profileM5 or bslDrawPercent >= 80
          profileBearProbability = not profileM5 or sslDrawPercent >= 80
          profileBullRejectionOk = not upperLiquidityRejection
          profileBearRejectionOk = not lowerLiquidityRejection
          profileEmaDistanceOk = not profileH1 or math.abs(close - ema1) <= atr * 2.0'''

          old_filters = '''longFilter = validSession and htfBullConfirmed and emaBull and recentSellSweep and mappingDir == 1 and (not profileNeedsPoi or nearBullPoi)
          shortFilter = validSession and htfBearConfirmed and emaBear and recentBuySweep and mappingDir == -1 and (not profileNeedsPoi or nearBearPoi)'''

          new_filters = '''longFilter = profileSessionValid and htfBullConfirmed and emaBull and entryRecentSellSweep and mappingDir == 1 and (not profileNeedsPoi or nearBullPoi) and profileBullCandle and profileBullProbability and profileBullRejectionOk and profileEmaDistanceOk
          shortFilter = profileSessionValid and htfBearConfirmed and emaBear and entryRecentBuySweep and mappingDir == -1 and (not profileNeedsPoi or nearBearPoi) and profileBearCandle and profileBearProbability and profileBearRejectionOk and profileEmaDistanceOk'''

          old_risk = '''    if setupRisk > 0 and setupRisk <= atr * 8.0
                  setupSl := rawSetupSl
                  setupTp1 := setupEntry + setupDir * setupRisk
                  setupTp2 := setupEntry + setupDir * setupRisk * profileTp2R'''

          new_risk = '''    if setupRisk > 0 and setupRisk <= atr * profileMaxRiskAtr
                  setupSl := rawSetupSl
                  setupTp1 := setupEntry + setupDir * setupRisk * profileTp1R
                  setupTp2 := setupEntry + setupDir * setupRisk * profileTp2R'''

          for old, new, name in [
              (old_profile, new_profile, "profile block"),
              (old_filters, new_filters, "filter block"),
              (old_risk, new_risk, "risk block"),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {name}, found {count}")
              text = text.replace(old, new, 1)

          new_start = text.index(start_marker)
          new_end = text.index(end_marker, new_start)
          if text[:new_start] != prefix:
              raise SystemExit("Content before Entry Map changed")
          if text[new_end:] != suffix:
              raise SystemExit("Content after Entry Map changed")

          required = [
              "profileTp1R = profileM5 ? 0.50 : profileM15 ? 0.35 : 0.30",
              "profileSweepMemory = profileM5 ? 36 : profileM15 ? 12 : 18",
              "profileBullProbability = not profileM5 or bslDrawPercent >= 80",
              "setupRisk <= atr * profileMaxRiskAtr",
              "setupRisk * profileTp1R",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Missing Entry Map calibration: {missing}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit Entry Map calibration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-entry-map-75.yml
          git add AMY_ICT_NextGen.pine
          git commit -m "Calibrate Entry Map for selective high win rate setups"
          git push origin HEAD:main
