name: Tune Amy SMC X internals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tune-amy-smc-x-internals.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Tune existing Amy SMC X logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          def sub1(pattern, replacement, label):
              global s
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s = s2

          # 1) Keep all existing candlestick-pattern names, but make detection selective.
          strict_pattern = r'''amyDetectPattern() =>
              float candleRange = high - low
              float candleBody = math.abs(close - open)
              float bodySafe = math.max(candleBody, syminfo.mintick)
              float upperWick = high - math.max(open, close)
              float lowerWick = math.min(open, close) - low
              float prevRange = high[1] - low[1]
              float prev2Range = high[2] - low[2]
              float body1 = math.abs(close[1] - open[1])
              float body2 = math.abs(close[2] - open[2])
              float atrLocal = ta.atr(14)
              bool rangeValid = candleRange > 0 and not na(atrLocal) and candleRange >= atrLocal * 0.50
              bool strongBody = rangeValid and candleBody >= candleRange * 0.52
              bool prevBodyValid = prevRange > 0 and body1 >= prevRange * 0.32
              bool shortDown = not na(close[3]) and close[1] < close[3]
              bool shortUp = not na(close[3]) and close[1] > close[3]

              bool bullishEngulfing = strongBody and prevBodyValid and close > open and close[1] < open[1] and open <= close[1] and close >= open[1] and candleBody >= body1 * 1.15
              bool bearishEngulfing = strongBody and prevBodyValid and close < open and close[1] > open[1] and open >= close[1] and close <= open[1] and candleBody >= body1 * 1.15

              bool hammer = rangeValid and shortDown and candleBody <= candleRange * 0.38 and lowerWick >= candleRange * 0.58 and upperWick <= candleRange * 0.14 and close >= low + candleRange * 0.72
              bool shootingStar = rangeValid and shortUp and candleBody <= candleRange * 0.38 and upperWick >= candleRange * 0.58 and lowerWick <= candleRange * 0.14 and close <= low + candleRange * 0.28

              bool bullishPinBar = rangeValid and close > open and candleBody <= candleRange * 0.30 and lowerWick >= candleRange * 0.62 and upperWick <= candleRange * 0.12 and close >= low + candleRange * 0.76
              bool bearishPinBar = rangeValid and close < open and candleBody <= candleRange * 0.30 and upperWick >= candleRange * 0.62 and lowerWick <= candleRange * 0.12 and close <= low + candleRange * 0.24

              bool doji = rangeValid and candleBody <= candleRange * 0.07 and upperWick >= candleRange * 0.25 and lowerWick >= candleRange * 0.25

              bool firstBearStrong = prev2Range > 0 and close[2] < open[2] and body2 >= prev2Range * 0.55
              bool firstBullStrong = prev2Range > 0 and close[2] > open[2] and body2 >= prev2Range * 0.55
              bool middleSmall = body2 > 0 and body1 <= body2 * 0.35
              bool morningStar = rangeValid and firstBearStrong and middleSmall and close > open and candleBody >= candleRange * 0.48 and close >= math.avg(open[2], close[2])
              bool eveningStar = rangeValid and firstBullStrong and middleSmall and close < open and candleBody >= candleRange * 0.48 and close <= math.avg(open[2], close[2])

              string patternName = 'NONE'
              int patternBias = 0
              if morningStar
                  patternName := 'Morning Star'
                  patternBias := BULLISH
              else if eveningStar
                  patternName := 'Evening Star'
                  patternBias := BEARISH
              else if bullishEngulfing
                  patternName := 'Bullish Engulfing'
                  patternBias := BULLISH
              else if bearishEngulfing
                  patternName := 'Bearish Engulfing'
                  patternBias := BEARISH
              else if hammer
                  patternName := 'Hammer'
                  patternBias := BULLISH
              else if shootingStar
                  patternName := 'Shooting Star'
                  patternBias := BEARISH
              else if bullishPinBar
                  patternName := 'Bullish Pin Bar'
                  patternBias := BULLISH
              else if bearishPinBar
                  patternName := 'Bearish Pin Bar'
                  patternBias := BEARISH
              else if doji
                  patternName := 'Doji'
                  patternBias := 0
              [patternName, patternBias]
          '''
          sub1(r"amyDetectPattern\(\) =>\n.*?    \[patternName, patternBias\]\n", strict_pattern, 'pattern detector')

          # 2) Pattern remains an existing feature, but its directional influence expires quickly.
          pattern_state = r'''[amyPatternNow, amyPatternDirNow] = amyDetectPattern()
          var string amyLastPattern = 'NONE'
          var int amyLastPatternDir = 0
          var int amyLastPatternBar = na
          var float amyLastPatternY = na
          var bool amyLastPatternAbove = false
          var color amyLastPatternColor = GRAY
          var label amyLatestPatternLabel = na
          float amyAtr14 = ta.atr(14)
          float amyOffset = math.max(nz(amyAtr14, high - low) * 0.30, syminfo.mintick * 10)
          int amyPatternMaxAge = 3

          if barstate.isconfirmed and amyPatternNow != 'NONE'
              amyLastPattern := amyPatternNow
              amyLastPatternDir := amyPatternDirNow
              amyLastPatternBar := bar_index
              amyLastPatternAbove := amyPatternDirNow <= 0
              amyLastPatternY := amyLastPatternAbove ? high + amyOffset * 2.0 : low - amyOffset * 2.0
              amyLastPatternColor := amyPatternDirNow == BULLISH ? GREEN : amyPatternDirNow == BEARISH ? RED : GRAY

          int amyPatternAge = na(amyLastPatternBar) ? 1000000 : bar_index - amyLastPatternBar
          bool amyPatternActive = amyLastPattern != 'NONE' and amyPatternAge <= amyPatternMaxAge
          int amyPatternBiasActive = amyPatternActive ? amyLastPatternDir : 0
          string amyPatternDisplay = amyPatternActive ? amyLastPattern : 'NONE'

          if barstate.islast
              if amyShowPatterns and amyPatternActive and not na(amyLastPatternBar)
                  if na(amyLatestPatternLabel)
                      amyLatestPatternLabel := label.new(amyLastPatternBar, amyLastPatternY, amyLastPattern, xloc = xloc.bar_index, yloc = yloc.price, color = color.new(amyLastPatternColor, 83), style = amyLastPatternAbove ? label.style_label_down : label.style_label_up, textcolor = amyLastPatternColor, size = size.tiny)
                  else
                      label.set_xy(amyLatestPatternLabel, amyLastPatternBar, amyLastPatternY)
                      label.set_text(amyLatestPatternLabel, amyLastPattern)
                      label.set_color(amyLatestPatternLabel, color.new(amyLastPatternColor, 83))
                      label.set_textcolor(amyLatestPatternLabel, amyLastPatternColor)
                      label.set_style(amyLatestPatternLabel, amyLastPatternAbove ? label.style_label_down : label.style_label_up)
              else if not na(amyLatestPatternLabel)
                  label.delete(amyLatestPatternLabel)
                  amyLatestPatternLabel := na

          '''
          sub1(r"\[amyPatternNow, amyPatternDirNow\] = amyDetectPattern\(\)\n.*?(?=var float amyLastSweptHigh = na)", pattern_state, 'pattern state')

          # Track freshness of liquidity context without changing the feature itself.
          s = s.replace("var int amyLastLiquidityBias = 0\n", "var int amyLastLiquidityBias = 0\nvar int amyLastLiquidityBar = na\n", 1)
          for token in ("amyLastLiquidityBias := BEARISH\n    amyAddEvent", "amyLastLiquidityBias := BULLISH\n    amyAddEvent"):
              replacement = token.replace("\n    amyAddEvent", "\n    amyLastLiquidityBar := bar_index\n    amyAddEvent")
              s = s.replace(token, replacement)

          # 3) Dashboard: forward-only targets, expiring context, structure-first scoring, calibrated confidence.
          dashboard_logic = r'''amyNearestAbove(float a, float b, float c, float d, float reference) =>
              float result = na
              if not na(a) and a > reference
                  result := a
              if not na(b) and b > reference and (na(result) or b < result)
                  result := b
              if not na(c) and c > reference and (na(result) or c < result)
                  result := c
              if not na(d) and d > reference and (na(result) or d < result)
                  result := d
              result

          amyNearestBelow(float a, float b, float c, float d, float reference) =>
              float result = na
              if not na(a) and a < reference
                  result := a
              if not na(b) and b < reference and (na(result) or b > result)
                  result := b
              if not na(c) and c < reference and (na(result) or c > result)
                  result := c
              if not na(d) and d < reference and (na(result) or d > result)
                  result := d
              result

          string amyHTF = amyAutoHTF()
          int amyHTFSwing = request.security(syminfo.tickerid, amyHTF, amyStructureBias(5)[1], lookahead = barmerge.lookahead_on)

          float amyRangeTop = trailing.top
          float amyRangeBottom = trailing.bottom
          float amyRangeEQ = not na(amyRangeTop) and not na(amyRangeBottom) ? math.avg(amyRangeTop, amyRangeBottom) : na
          string amyDealingRange = 'EQUILIBRIUM'
          int amyDealingBias = 0
          if not na(amyRangeEQ)
              if close > amyRangeEQ
                  amyDealingRange := 'PREMIUM'
                  amyDealingBias := BEARISH
              else if close < amyRangeEQ
                  amyDealingRange := 'DISCOUNT'
                  amyDealingBias := BULLISH

          int amyLiquidityAge = na(amyLastLiquidityBar) ? 1000000 : bar_index - amyLastLiquidityBar
          bool amyLiquidityActive = amyLiquidityAge <= 12
          int amyLiquidityBiasActive = amyLiquidityActive ? amyLastLiquidityBias : 0

          float amyRecentHigh = ta.highest(high[1], 50)
          float amyRecentLow = ta.lowest(low[1], 50)
          float amyForwardBSL = amyNearestAbove(swingHigh.currentLevel, equalHigh.currentLevel, internalHigh.currentLevel, amyRecentHigh, close)
          float amyForwardSSL = amyNearestBelow(swingLow.currentLevel, equalLow.currentLevel, internalLow.currentLevel, amyRecentLow, close)

          string amyLiquidityDisplay = ''
          if amyLiquidityActive and amyLastLiquiditySide != '' and not na(amyLastLiquidityLevel)
              amyLiquidityDisplay := amyLastLiquiditySide + ' ' + amyPrice(amyLastLiquidityLevel)
          else if swingTrend.bias == BULLISH and not na(amyForwardBSL)
              amyLiquidityDisplay := 'BSL ' + amyPrice(amyForwardBSL)
          else if swingTrend.bias == BEARISH and not na(amyForwardSSL)
              amyLiquidityDisplay := 'SSL ' + amyPrice(amyForwardSSL)
          else if not na(amyForwardBSL)
              amyLiquidityDisplay := 'BSL ' + amyPrice(amyForwardBSL)
          else if not na(amyForwardSSL)
              amyLiquidityDisplay := 'SSL ' + amyPrice(amyForwardSSL)
          else
              amyLiquidityDisplay := '-'

          int amyCurrentSwingBias = swingTrend.bias
          int amySafeHTFBias = na(amyHTFSwing) ? 0 : amyHTFSwing

          // Structure is the foundation; short-lived pattern/liquidity only refine it.
          float amyFinalScore = amySafeHTFBias * 35 + amyCurrentSwingBias * 30 + amyLiquidityBiasActive * 15 + amyDealingBias * 10 + amyPatternBiasActive * 10
          int amyFinalBias = BULLISH
          if amyFinalScore > 0
              amyFinalBias := BULLISH
          else if amyFinalScore < 0
              amyFinalBias := BEARISH
          else if amyCurrentSwingBias != 0
              amyFinalBias := amyCurrentSwingBias
          else if amySafeHTFBias != 0
              amyFinalBias := amySafeHTFBias
          else
              amyFinalBias := close >= open ? BULLISH : BEARISH

          string amyFinalBiasText = amyFinalBias == BULLISH ? 'BULLISH' : 'BEARISH'
          float amyBullInvalidation = amyNearestBelow(swingLow.currentLevel, trailing.bottom, amyRecentLow, internalLow.currentLevel, close)
          float amyBearInvalidation = amyNearestAbove(swingHigh.currentLevel, trailing.top, amyRecentHigh, internalHigh.currentLevel, close)
          float amyInvalidation = amyFinalBias == BULLISH ? amyBullInvalidation : amyBearInvalidation

          float amyHistoryScore = 0.0
          int amyEventCount = array.size(amyEventDirs)
          float amyBarMillis = math.max(1.0, timeframe.in_seconds() * 1000.0)
          if amyEventCount > 0
              for index = 0 to amyEventCount - 1
                  int eventDirection = array.get(amyEventDirs, index)
                  float eventStrength = array.get(amyEventPower, index)
                  int eventTimeValue = array.get(amyEventTimes, index)
                  float eventAgeBars = math.max(0.0, (time - eventTimeValue) / amyBarMillis)
                  float ageWeight = eventAgeBars <= 4 ? 1.00 : eventAgeBars <= 12 ? 0.65 : eventAgeBars <= 24 ? 0.35 : 0.0
                  float orderWeight = index == 0 ? 1.00 : index == 1 ? 0.80 : index == 2 ? 0.60 : 0.40
                  amyHistoryScore += eventDirection * eventStrength * ageWeight * orderWeight

          int amyHistoryBias = amyHistoryScore > 5 ? BULLISH : amyHistoryScore < -5 ? BEARISH : 0
          float amyContextScore = amySafeHTFBias * 25 + amyCurrentSwingBias * 25 + amyLiquidityBiasActive * 15 + amyDealingBias * 8 + amyPatternBiasActive * 7
          float amyNextRaw = amyHistoryScore * 0.55 + amyContextScore
          int amyNextDirection = BULLISH
          if amyNextRaw > 0
              amyNextDirection := BULLISH
          else if amyNextRaw < 0
              amyNextDirection := BEARISH
          else
              amyNextDirection := amyFinalBias

          string amyNextMove = amyNextDirection == BULLISH ? 'UP' : 'DOWN'
          float amyTarget = amyNextDirection == BULLISH ? amyForwardBSL : amyForwardSSL
          string amyTargetSide = amyNextDirection == BULLISH ? 'BSL' : 'SSL'

          // Confidence measures agreement, not just absolute score magnitude.
          float amyConfidenceRaw = 50.0
          if amySafeHTFBias != 0
              amyConfidenceRaw += amySafeHTFBias == amyNextDirection ? 8 : -8
          if amyCurrentSwingBias != 0
              amyConfidenceRaw += amyCurrentSwingBias == amyNextDirection ? 10 : -10
          if amyLiquidityBiasActive != 0
              amyConfidenceRaw += amyLiquidityBiasActive == amyNextDirection ? 6 : -6
          if amyDealingBias != 0
              amyConfidenceRaw += amyDealingBias == amyNextDirection ? 4 : -4
          if amyPatternBiasActive != 0
              amyConfidenceRaw += amyPatternBiasActive == amyNextDirection ? 3 : -3
          if amyHistoryBias != 0
              amyConfidenceRaw += amyHistoryBias == amyNextDirection ? 5 : -5
          if math.abs(amyNextRaw) < 18
              amyConfidenceRaw -= 5
          int amyConfidence = int(math.round(math.max(35.0, math.min(85.0, amyConfidenceRaw))))
          '''
          sub1(r"string amyHTF = amyAutoHTF\(\)\n.*?int amyConfidence = int\(math.round\(amyConfidenceRaw\)\)\n", dashboard_logic, 'dashboard logic')

          s = s.replace("table.cell(amyDashboard, 1, 5, amyLastPattern, text_color = amyLastPatternDir == BULLISH ? amyBullColor : amyLastPatternDir == BEARISH ? amyBearColor : GRAY, text_size = size.tiny)",
                        "table.cell(amyDashboard, 1, 5, amyPatternDisplay, text_color = amyPatternBiasActive == BULLISH ? amyBullColor : amyPatternBiasActive == BEARISH ? amyBearColor : GRAY, text_size = size.tiny)", 1)

          # 4) Stabilize the existing OTE/Fibonacci swing anchors: update only on confirmed swing-structure events.
          stable_anchor = r'''float amyxRawSwingTop = swingHigh.currentLevel
          float amyxRawSwingBottom = swingLow.currentLevel
          bool amyxRawRangeValid = not na(amyxRawSwingTop) and not na(amyxRawSwingBottom) and amyxRawSwingTop > amyxRawSwingBottom

          var float amyxLockedTop = na
          var float amyxLockedBottom = na
          var int amyxLockedBias = 0
          var int amyxLockedStartBar = na
          var int amyxLockedEndBar = na

          bool amyxBullStructureEvent = barstate.isconfirmed and (currentAlerts.swingBullishBOS or currentAlerts.swingBullishCHoCH)
          bool amyxBearStructureEvent = barstate.isconfirmed and (currentAlerts.swingBearishBOS or currentAlerts.swingBearishCHoCH)

          if amyxBullStructureEvent and not na(swingLow.currentLevel)
              amyxLockedBottom := swingLow.currentLevel
              amyxLockedTop := math.max(high, nz(swingHigh.currentLevel, high))
              amyxLockedBias := BULLISH
              amyxLockedStartBar := swingLow.barIndex
              amyxLockedEndBar := bar_index
          else if amyxBearStructureEvent and not na(swingHigh.currentLevel)
              amyxLockedTop := swingHigh.currentLevel
              amyxLockedBottom := math.min(low, nz(swingLow.currentLevel, low))
              amyxLockedBias := BEARISH
              amyxLockedStartBar := swingHigh.barIndex
              amyxLockedEndBar := bar_index
          else if na(amyxLockedTop) and amyxRawRangeValid
              amyxLockedTop := amyxRawSwingTop
              amyxLockedBottom := amyxRawSwingBottom
              amyxLockedBias := swingTrend.bias == BEARISH ? BEARISH : BULLISH
              amyxLockedStartBar := amyxLockedBias == BULLISH ? swingLow.barIndex : swingHigh.barIndex
              amyxLockedEndBar := amyxLockedBias == BULLISH ? swingHigh.barIndex : swingLow.barIndex

          bool amyxLockedInvalid = amyxLockedBias == BULLISH ? (not na(amyxLockedBottom) and close < amyxLockedBottom) : amyxLockedBias == BEARISH ? (not na(amyxLockedTop) and close > amyxLockedTop) : false
          if barstate.isconfirmed and amyxLockedInvalid
              amyxLockedTop := na
              amyxLockedBottom := na
              amyxLockedBias := 0
              amyxLockedStartBar := na
              amyxLockedEndBar := na

          float amyxSwingTop = amyxLockedTop
          float amyxSwingBottom = amyxLockedBottom
          bool amyxRangeValid = not na(amyxSwingTop) and not na(amyxSwingBottom) and amyxSwingTop > amyxSwingBottom and amyxLockedBias != 0
          float amyxSwingRange = amyxRangeValid ? amyxSwingTop - amyxSwingBottom : na
          int amyxLegBias = amyxLockedBias == BEARISH ? BEARISH : BULLISH
          color amyxLegColor = amyxLegBias == BULLISH ? GREEN : RED
          '''
          sub1(r"float amyxSwingTop = swingHigh.currentLevel\n.*?color amyxLegColor = amyxLegBias == BULLISH \? GREEN : RED\n", stable_anchor, 'stable OTE/Fib anchor')
          s = s.replace("int amyxOTELeft = amyxLegBias == BULLISH ? swingLow.barIndex : swingHigh.barIndex", "int amyxOTELeft = nz(amyxLockedStartBar, bar_index)", 1)
          s = s.replace("int amyxFibLeft = amyxLegBias == BULLISH ? swingHigh.barIndex : swingLow.barIndex", "int amyxFibLeft = nz(amyxLockedEndBar, bar_index)", 1)

          # Existing AMD input stays the same feature; tighten its default range requirement.
          s = s.replace("amyxAMDRangeATR   = input.float(3.0, 'Max Range × ATR'", "amyxAMDRangeATR   = input.float(1.75, 'Max Range × ATR'", 1)

          # 5) AMD remains ACC -> MAN -> DIST, now as a strict state machine with one MAN per cycle.
          strict_amd = r'''//---------------------------------------------------------------------------------------------------------------------}
          // AMD — Accumulation / Manipulation / Distribution
          //---------------------------------------------------------------------------------------------------------------------{

          float amyxAMDAtr = ta.atr(14)
          float amyxAMDCandidateHigh = ta.highest(high[1], amyxAMDLength)
          float amyxAMDCandidateLow = ta.lowest(low[1], amyxAMDLength)
          float amyxAMDCandidateRange = amyxAMDCandidateHigh - amyxAMDCandidateLow
          float amyxAMDAvgRange = ta.sma(high - low, amyxAMDLength)[1]
          bool amyxAMDCompression = not na(amyxAMDAtr) and not na(amyxAMDAvgRange) and amyxAMDAvgRange <= amyxAMDAtr * 0.90
          bool amyxAMDAccumCandidate = bar_index > amyxAMDLength and amyxAMDCandidateRange > 0 and amyxAMDCandidateRange <= amyxAMDAtr * amyxAMDRangeATR and amyxAMDCompression
          bool amyxAMDStableAccum = amyxAMDAccumCandidate and amyxAMDAccumCandidate[1]

          var int amyxAMDState = 0
          var int amyxAMDDirection = 0
          var float amyxAMDHigh = na
          var float amyxAMDLow = na
          var int amyxAMDStartBar = na
          var int amyxAMDManipBar = na
          var int amyxAMDDistBar = na
          var int amyxAMDLastEndBar = na
          var box amyxAMDBox = na
          var label amyxAMDManLabel = na
          var label amyxAMDDistLabel = na

          bool amyxAMDManipEvent = false
          bool amyxAMDDistEvent = false

          if barstate.isconfirmed and amyxShowAMD
              if amyxAMDState == 0
                  bool amyxAMDCooldownReady = na(amyxAMDLastEndBar) or bar_index - amyxAMDLastEndBar >= 5
                  if amyxAMDStableAccum and amyxAMDCooldownReady
                      amyxAMDState := 1
                      amyxAMDDirection := 0
                      amyxAMDHigh := amyxAMDCandidateHigh
                      amyxAMDLow := amyxAMDCandidateLow
                      amyxAMDStartBar := bar_index - amyxAMDLength
                      amyxAMDManipBar := na
                      amyxAMDDistBar := na
                      if not na(amyxAMDBox)
                          box.delete(amyxAMDBox)
                      if not na(amyxAMDManLabel)
                          label.delete(amyxAMDManLabel)
                      if not na(amyxAMDDistLabel)
                          label.delete(amyxAMDDistLabel)
                      amyxAMDManLabel := na
                      amyxAMDDistLabel := na
                      amyxAMDBox := box.new(amyxAMDStartBar, amyxAMDHigh, bar_index, amyxAMDLow, xloc = xloc.bar_index, bgcolor = color.new(BLUE, 96), border_color = color.new(BLUE, 65), text = 'ACC', text_color = BLUE, text_size = size.tiny, text_halign = text.align_center, text_valign = text.align_center)

              else if amyxAMDState == 1
                  if not na(amyxAMDBox)
                      box.set_right(amyxAMDBox, bar_index)

                  float amyxAMDMinExcursion = math.max(amyxAMDAtr * 0.12, syminfo.mintick * 3)
                  float amyxAMDInsideMargin = amyxAMDCandidateRange * 0.05
                  bool amyxSweepHigh = high >= amyxAMDHigh + amyxAMDMinExcursion and close <= amyxAMDHigh - amyxAMDInsideMargin
                  bool amyxSweepLow = low <= amyxAMDLow - amyxAMDMinExcursion and close >= amyxAMDLow + amyxAMDInsideMargin

                  if amyxSweepHigh and amyxSweepLow
                      float amyxUpperExcursion = high - amyxAMDHigh
                      float amyxLowerExcursion = amyxAMDLow - low
                      if amyxUpperExcursion >= amyxLowerExcursion
                          amyxSweepLow := false
                      else
                          amyxSweepHigh := false

                  if amyxSweepHigh
                      amyxAMDState := 2
                      amyxAMDDirection := BEARISH
                      amyxAMDManipBar := bar_index
                      amyxAMDManipEvent := true
                      if na(amyxAMDManLabel)
                          amyxAMDManLabel := label.new(bar_index, high + amyOffset * 2.2, 'MAN', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(RED, 84), style = label.style_label_down, textcolor = RED, size = size.tiny)
                  else if amyxSweepLow
                      amyxAMDState := 2
                      amyxAMDDirection := BULLISH
                      amyxAMDManipBar := bar_index
                      amyxAMDManipEvent := true
                      if na(amyxAMDManLabel)
                          amyxAMDManLabel := label.new(bar_index, low - amyOffset * 2.2, 'MAN', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(GREEN, 84), style = label.style_label_up, textcolor = GREEN, size = size.tiny)
                  else if bar_index - amyxAMDStartBar > amyxAMDExpiry
                      amyxAMDState := 0
                      amyxAMDLastEndBar := bar_index
                      if not na(amyxAMDBox)
                          box.delete(amyxAMDBox)
                          amyxAMDBox := na

              else if amyxAMDState == 2
                  if not na(amyxAMDBox)
                      box.set_right(amyxAMDBox, bar_index)

                  float amyxAMDBarRange = math.max(high - low, syminfo.mintick)
                  float amyxAMDBody = math.abs(close - open)
                  bool amyxAMDDisplacement = amyxAMDBody >= amyxAMDAtr * 0.45 and amyxAMDBody / amyxAMDBarRange >= 0.55
                  float amyxAMDBreakMargin = amyxAMDAtr * 0.05
                  bool amyxBullDistribution = amyxAMDDirection == BULLISH and amyxAMDDisplacement and close >= amyxAMDHigh + amyxAMDBreakMargin
                  bool amyxBearDistribution = amyxAMDDirection == BEARISH and amyxAMDDisplacement and close <= amyxAMDLow - amyxAMDBreakMargin
                  bool amyxBullInvalid = amyxAMDDirection == BULLISH and close < amyxAMDLow
                  bool amyxBearInvalid = amyxAMDDirection == BEARISH and close > amyxAMDHigh
                  bool amyxAMDExpired = not na(amyxAMDManipBar) and bar_index - amyxAMDManipBar > amyxAMDExpiry

                  if amyxBullDistribution
                      amyxAMDDistEvent := true
                      amyxAMDDistBar := bar_index
                      amyxAMDLastEndBar := bar_index
                      if na(amyxAMDDistLabel)
                          amyxAMDDistLabel := label.new(bar_index, high + amyOffset * 2.2, 'DIST', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(GREEN, 84), style = label.style_label_down, textcolor = GREEN, size = size.tiny)
                      amyxAMDState := 3
                  else if amyxBearDistribution
                      amyxAMDDistEvent := true
                      amyxAMDDistBar := bar_index
                      amyxAMDLastEndBar := bar_index
                      if na(amyxAMDDistLabel)
                          amyxAMDDistLabel := label.new(bar_index, low - amyOffset * 2.2, 'DIST', xloc = xloc.bar_index, yloc = yloc.price, color = color.new(RED, 84), style = label.style_label_up, textcolor = RED, size = size.tiny)
                      amyxAMDState := 3
                  else if amyxBullInvalid or amyxBearInvalid or amyxAMDExpired
                      amyxAMDState := 0
                      amyxAMDDirection := 0
                      amyxAMDLastEndBar := bar_index
                      if not na(amyxAMDBox)
                          box.delete(amyxAMDBox)
                          amyxAMDBox := na
                      if not na(amyxAMDManLabel)
                          label.delete(amyxAMDManLabel)
                          amyxAMDManLabel := na

              else if amyxAMDState == 3
                  if not na(amyxAMDBox) and not na(amyxAMDDistBar)
                      box.set_right(amyxAMDBox, amyxAMDDistBar)
                  if not na(amyxAMDDistBar) and bar_index - amyxAMDDistBar >= 3
                      amyxAMDState := 0

          if not amyxShowAMD and barstate.islast
              amyxAMDState := 0
              amyxAMDDirection := 0
              if not na(amyxAMDBox)
                  box.delete(amyxAMDBox)
                  amyxAMDBox := na
              if not na(amyxAMDManLabel)
                  label.delete(amyxAMDManLabel)
                  amyxAMDManLabel := na
              if not na(amyxAMDDistLabel)
                  label.delete(amyxAMDDistLabel)
                  amyxAMDDistLabel := na

          '''
          sub1(r"//---------------------------------------------------------------------------------------------------------------------\}\n// AMD — Accumulation / Manipulation / Distribution\n//---------------------------------------------------------------------------------------------------------------------\{\n.*?(?=//---------------------------------------------------------------------------------------------------------------------\}\n// FIBONACCI EXTENSION — TP1 / TP2 / MAX)", strict_amd, 'AMD state machine')

          p.write_text(s)
          PY

