name: Correct K1 human entry causal payload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-k1-human-entry-causal-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable source and replace only experiment comments
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA="d6e6d7c979dd5a852bddd9661bef0480caa2eb35"
          LAB_SHA="0f6e46b8f33769d25d3620bef40ae47c58639e8f"
          test "$(git hash-object Amy-SMC-D.pine)" = "$BASELINE_SHA"
          test "$(git hash-object Amy-SMC-D-LAB.pine)" = "$LAB_SHA"
          test -f .tmp/k1-human-entry-causal-payload.txt
          python - <<'PY'
          from pathlib import Path

          lab = Path('Amy-SMC-D-LAB.pine')
          payload_path = Path('.tmp/k1-human-entry-causal-payload.txt')
          text = lab.read_text(encoding='utf-8')
          payload = payload_path.read_text(encoding='utf-8')

          old_marker = '// AMY SMC D-LAB — K1 HUMAN ENTRY CONSTRUCTION — ACCEPTANCE/REJECTION + LOCAL SL (2026-08-12)'
          new_marker = '// AMY SMC D-LAB — K1 HUMAN ENTRY CONSTRUCTION — CAUSAL ACCEPTANCE/REJECTION + LOCAL SL (2026-08-12)'
          if text.count(old_marker) != 1:
              raise SystemExit(f'Expected exactly one old experiment marker, got {text.count(old_marker)}')
          if new_marker in text:
              raise SystemExit('Corrected experiment already present; refusing duplicate')
          if not payload.strip().startswith('//') or new_marker not in payload:
              raise SystemExit('Payload marker missing')
          for n, line in enumerate(payload.splitlines(), 1):
              if line.strip() and not line.lstrip().startswith('//'):
                  raise SystemExit(f'Non-comment payload line {n}: {line!r}')

          marker_i = text.index(old_marker)
          block_start = text.rfind('\n//---------------------------------------------------------------------------------------------------------------------}', 0, marker_i)
          if block_start < 0:
              raise SystemExit('Could not locate old experiment block start')
          prefix = text[:block_start]
          if 'AMY SMC D-LAB — K1 M15 TIMEOUT AUTOPSY PHASE 2' not in prefix:
              raise SystemExit('Phase-2 prefix marker missing')
          if '// K1 — Qualified Valid Break + Internal Structure' not in prefix:
              raise SystemExit('K1 executable prefix marker missing')

          corrected = prefix.rstrip() + '\n\n' + payload.strip() + '\n'
          lab.write_text(corrected, encoding='utf-8')

          # Strong immutability assertion: everything before old experiment block is byte-identical.
          reread = lab.read_text(encoding='utf-8')
          if not reread.startswith(prefix.rstrip() + '\n\n'):
              raise SystemExit('LAB prefix changed unexpectedly')
          if reread.count(new_marker) != 1 or old_marker in reread:
              raise SystemExit('Experiment replacement marker assertion failed')
          PY

          test "$(git hash-object Amy-SMC-D.pine)" = "$BASELINE_SHA"
          git diff --exit-code -- Amy-SMC-D.pine
          git diff -- Amy-SMC-D-LAB.pine

      - name: Commit corrected diagnostic payload only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-D-LAB.pine
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "Amy-SMC-D-LAB.pine"
          git commit -m "docs: correct K1 human entry causal experiment"
          git push origin HEAD:main
