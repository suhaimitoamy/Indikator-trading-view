name: Create Amy SMC A Redesign Experiments

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create stage 1 and stage 2 copies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src_path = Path('Amy-SMC-A-Liquidity-Fixed.pine')
          src = src_path.read_text(encoding='utf-8')

          # ------------------------------------------------------------------
          # Stage 1 — M5 regime redesign only.
          # WFO robust selection: CONSENSUS4_STRONG.
          # Vote = HTF + Swing + Internal + fixed Liquidity; active at |vote|>=2.
          # Latest train-only (2018-2025) execution gate:
          # body/ATR >= 0.35, structural risk 3.0-8.0 ATR, candle confirm required.
          # ------------------------------------------------------------------
          stage1 = src.replace(
              "indicator('Amy SMC A Liquidity Fixed', 'Amy SMC A Liquidity Fixed', overlay = true, max_labels_count = 500, max_lines_count = 500, max_boxes_count = 500)",
              "indicator('Amy SMC A Liquidity Fixed M5 Regime Redesign', 'Amy SMC A Liquidity Fixed M5 Regime Redesign', overlay = true, max_labels_count = 500, max_lines_count = 500, max_boxes_count = 500)\n// EXPERIMENTAL STAGE 1 — M5 Next Move regime redesign only. Baseline Liquidity-Fixed file remains untouched."
          )

          start_marker = '// AMY SMC A ROUND 8 — REGIME-ADAPTIVE NEXT MOVE.'
          end_marker = 'bool amyRound9M5TradeRegime = amyRound8M5TradeRegime and amyRound9M5TradeDirection != 0'
          if stage1.count(start_marker) != 1 or stage1.count(end_marker) != 1:
              raise SystemExit('Stage1 markers not unique')
          a = stage1.index(start_marker)
          b = stage1.index(end_marker, a) + len(end_marker)
          new_m5 = '''// AMY SMC A M5 REGIME REDESIGN — WALK-FORWARD CONSENSUS4_STRONG.\n// Candidate family was selected using TRAIN data only in each 8y→1y walk-forward window.\n// Robust winner: vote HTF + Swing + Internal + fixed Liquidity; require |vote| >= 2.\n// Signal on regime entry or direction change. M15/H1 logic is intentionally untouched.\nint amyM5RegimeVote = amySafeHTFBias + amyCurrentSwingBias + amyCurrentInternalBias + amyLiquidityBiasActive\nint amyM5RegimeRedesignDirection = amyM5RegimeVote > 0 ? BULLISH : amyM5RegimeVote < 0 ? BEARISH : 0\nbool amyM5Consensus4Regime = amyRound5M5 and math.abs(amyM5RegimeVote) >= 2\nbool amyRound8M5TradeRegime = amyM5Consensus4Regime\n\n// Train-only execution gate selected from 2018–2025 for the current deployment profile.\n// 2026 Jan–Jul was not used to select these thresholds.\nbool amyRound9M5RegimeEntry = amyRound8M5TradeRegime and (not amyRound8M5TradeRegime[1] or amyM5RegimeRedesignDirection != amyM5RegimeRedesignDirection[1])\nfloat amyRound9EntryInvalidation = amyM5RegimeRedesignDirection == BULLISH ? amyBullInvalidation : amyM5RegimeRedesignDirection == BEARISH ? amyBearInvalidation : na\nfloat amyRound9EntryRiskAtr = not na(amyRound9EntryInvalidation) and not na(amyEventAtr) and amyEventAtr > 0 ? math.abs(close - amyRound9EntryInvalidation) / amyEventAtr : na\nbool amyRound9CandleConfirm = amyM5RegimeRedesignDirection == BULLISH ? close > open : amyM5RegimeRedesignDirection == BEARISH ? close < open : false\nbool amyWfM5ParamGate = amyBreakBodyAtr >= 0.35 and not na(amyRound9EntryRiskAtr) and amyRound9EntryRiskAtr >= 3.0 and amyRound9EntryRiskAtr < 8.0\nbool amyRound9EntryConfirmed = amyRound9CandleConfirm and amyWfM5ParamGate\nvar int amyRound9M5TradeDirection = 0\nif barstate.isconfirmed\n    if not amyRound8M5TradeRegime\n        amyRound9M5TradeDirection := 0\n    else if amyRound9M5RegimeEntry\n        amyRound9M5TradeDirection := amyRound9EntryConfirmed ? amyM5RegimeRedesignDirection : 0\n\nbool amyRound9M5TradeRegime = amyRound8M5TradeRegime and amyRound9M5TradeDirection != 0'''
          stage1 = stage1[:a] + new_m5 + stage1[b:]
          stage1 = stage1.replace("'WATCH • TRANSITION'", "'WATCH • CONSENSUS'")
          Path('Amy-SMC-A-Liquidity-Fixed-M5-Regime-Redesign.pine').write_text(stage1, encoding='utf-8')

          # ------------------------------------------------------------------
          # Stage 2 — Final Bias redesign only.
          # Unconstrained signed-grid WFO winner: [-2, 0, 0, +1].
          # This is deliberately experimental because it effectively treats
          # HTF Swing as an anti-signal under the flip-to-flip metric.
          # Next Move/regime logic remains exactly as in Liquidity-Fixed base.
          # ------------------------------------------------------------------
          stage2 = src.replace(
              "indicator('Amy SMC A Liquidity Fixed', 'Amy SMC A Liquidity Fixed', overlay = true, max_labels_count = 500, max_lines_count = 500, max_boxes_count = 500)",
              "indicator('Amy SMC A Liquidity Fixed FinalBias SignedGrid', 'Amy SMC A Liquidity Fixed FinalBias SignedGrid', overlay = true, max_labels_count = 500, max_lines_count = 500, max_boxes_count = 500)\n// EXPERIMENTAL STAGE 2 — Final Bias formula redesign only. Next Move/regime logic is intentionally unchanged."
          )
          old_final = '''float amyFinalScore = amySafeHTFBias * 35 + amyCurrentSwingBias * 30 + amyCurrentInternalBias * 20 + amyLiquidityBiasActive * 15\nint amyFinalBias = BULLISH\nif amyFinalScore > 0\n    amyFinalBias := BULLISH\nelse if amyFinalScore < 0\n    amyFinalBias := BEARISH\nelse if amyCurrentSwingBias != 0\n    amyFinalBias := amyCurrentSwingBias\nelse if amySafeHTFBias != 0\n    amyFinalBias := amySafeHTFBias\nelse\n    amyFinalBias := close >= open ? BULLISH : BEARISH'''
          if stage2.count(old_final) != 1:
              raise SystemExit(f'Final Bias block count={stage2.count(old_final)}')
          new_final = '''// AMY SMC A FINAL BIAS REDESIGN — TRAIN-ONLY SIGNED GRID EXPERIMENT.\n// Latest 2018–2025 train selected [-2 HTF, 0 Swing, 0 Internal, +1 Liquidity] on M5/M15/H1.\n// Across walk-forward windows this family was the most consistent directional scorer, but the negative HTF weight\n// is intentionally marked EXPERIMENTAL because it means HTF Swing behaves as an anti-signal under flip-to-flip scoring.\nfloat amyFinalScore = amySafeHTFBias * -2 + amyLiquidityBiasActive * 1\nint amyFinalBias = BULLISH\nif amyFinalScore > 0\n    amyFinalBias := BULLISH\nelse if amyFinalScore < 0\n    amyFinalBias := BEARISH\nelse if amyLiquidityBiasActive != 0\n    amyFinalBias := amyLiquidityBiasActive\nelse if amyCurrentInternalBias != 0\n    amyFinalBias := amyCurrentInternalBias\nelse if amyCurrentSwingBias != 0\n    amyFinalBias := amyCurrentSwingBias\nelse if amySafeHTFBias != 0\n    amyFinalBias := amySafeHTFBias\nelse\n    amyFinalBias := close >= open ? BULLISH : BEARISH'''
          stage2 = stage2.replace(old_final, new_final)
          Path('Amy-SMC-A-Liquidity-Fixed-FinalBias-SignedGrid.pine').write_text(stage2, encoding='utf-8')
          PY

          git diff --check
          git status --short
          git add Amy-SMC-A-Liquidity-Fixed-M5-Regime-Redesign.pine Amy-SMC-A-Liquidity-Fixed-FinalBias-SignedGrid.pine
          if git diff --cached --quiet; then
            echo 'No target changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Amy SMC A redesign experiment copies'
          git push
