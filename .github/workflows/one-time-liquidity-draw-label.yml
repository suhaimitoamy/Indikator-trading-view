name: One-time liquidity draw label repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-liquidity-draw-label.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace Bull Bear direction with BSL SSL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AMY_ICT_NextGen.pine')
          text = path.read_text(encoding='utf-8')

          old_direction = '''alignmentSide = bullAlignmentAdjusted > bearAlignmentAdjusted ? "BULL" : bearAlignmentAdjusted > bullAlignmentAdjusted ? "BEAR" : "BALANCED"'''
          new_direction = '''alignmentSide = bullAlignmentAdjusted > bearAlignmentAdjusted ? "BSL" : bearAlignmentAdjusted > bullAlignmentAdjusted ? "SSL" : "WAIT"'''
          if old_direction not in text:
              raise SystemExit('Alignment direction marker not found')
          text = text.replace(old_direction, new_direction, 1)

          old_row = '''table.cell(dashboard, 0, 2, "Alignment", text_color=color.white, text_size=size.small, bgcolor=dashBg)'''
          new_row = '''table.cell(dashboard, 0, 2, "Liquidity Draw", text_color=color.white, text_size=size.small, bgcolor=dashBg)'''
          if old_row not in text:
              raise SystemExit('Dashboard alignment row marker not found')
          text = text.replace(old_row, new_row, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-time-liquidity-draw-label.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMY_ICT_NextGen.pine .github/workflows/one-time-liquidity-draw-label.yml
          git commit -m "Show mapping direction as BSL SSL liquidity draw"
          git push origin HEAD:main
