name: Convert Pine v3 to v4 with Groq

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Path file Pine v3 (contoh: indikator/ema_v3.pine)"
        required: true
        type: string
      output_file:
        description: "Path output (opsional)"
        required: false
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai

      - name: Run converter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INPUT_FILE: ${{ inputs.input_file }}
          OUTPUT_FILE: ${{ inputs.output_file }}
        run: python scripts/convert_pine_groq.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Convert Pine script to v4" || echo "No changes"
          git push
