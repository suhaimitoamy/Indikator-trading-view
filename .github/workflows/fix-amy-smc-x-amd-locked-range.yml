name: Fix Amy SMC X AMD locked range

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-amy-smc-x-amd-locked-range.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Use locked ACC range during manipulation check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()
          old = "float amyxAMDInsideMargin = amyxAMDCandidateRange * 0.05"
          new = "float amyxAMDInsideMargin = (amyxAMDHigh - amyxAMDLow) * 0.05"
          if s.count(old) != 1:
              raise SystemExit(f'expected one AMD margin line, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-X.pine
          git commit -m "Use locked accumulation range for AMD manipulation"
          git push origin main
