name: Apply calibrated direction forecast

on:
  push:
    branches:
      - feature/market-state-direction-forecast-20260714
    paths:
      - .github/workflows/one-time-direction-forecast.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-state-direction-forecast-20260714

      - name: Add market state direction forecast and liquidity draw dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AMY_ICT_NextGen.pine")
          text = path.read_text(encoding="utf-8")

          input_anchor = 'liquidityDirectionThreshold = input.int(97, "Prediction Confidence Threshold", minval=50, maxval=99, group=grpCtx)\n'
          input_block = '''liquidityDirectionThreshold = input.int(97, "Prediction Confidence Threshold", minval=50, maxval=99, group=grpCtx)

          grpForecast = "3. Direction Forecast"
          showDirectionForecast = input.bool(true, "Show Direction Forecast", group=grpForecast)
          '''
          if text.count(input_anchor) != 1:
              raise SystemExit(f"Expected one forecast input anchor, found {text.count(input_anchor)}")
          text = text.replace(input_anchor, input_block, 1)

          market_anchor = 'marketColor = mappingDir == 1 ? color.lime : mappingDir == -1 ? color.red : bullTransition ? color.aqua : bearTransition ? color.orange : color.yellow\n'
          forecast_block = '''marketColor = mappingDir == 1 ? color.lime : mappingDir == -1 ? color.red : bullTransition ? color.aqua : bearTransition ? color.orange : color.yellow

          // ============================================================================
          // DIRECTION FORECAST — CALIBRATED M15 MODEL, 48-HOUR HORIZON
          // Training: 2022-2024. Validation: 2025. Out-of-sample: Jan-Jun 2026.
          // Uses only completed M15 and H4 candles. NO CLEAR DIRECTION is intentional.
          // ============================================================================
          forecastClose = request.security(syminfo.tickerid, "15", close[1], lookahead=barmerge.lookahead_on)
          forecastEma21 = request.security(syminfo.tickerid, "15", ta.ema(close, 21)[1], lookahead=barmerge.lookahead_on)
          forecastEma34 = request.security(syminfo.tickerid, "15", ta.ema(close, 34)[1], lookahead=barmerge.lookahead_on)
          forecastEma90 = request.security(syminfo.tickerid, "15", ta.ema(close, 90)[1], lookahead=barmerge.lookahead_on)
          forecastEma21Prev3 = request.security(syminfo.tickerid, "15", ta.ema(close, 21)[4], lookahead=barmerge.lookahead_on)
          forecastEma90Prev3 = request.security(syminfo.tickerid, "15", ta.ema(close, 90)[4], lookahead=barmerge.lookahead_on)
          forecastClose12 = request.security(syminfo.tickerid, "15", close[13], lookahead=barmerge.lookahead_on)
          forecastClose24 = request.security(syminfo.tickerid, "15", close[25], lookahead=barmerge.lookahead_on)
          forecastRsi14 = request.security(syminfo.tickerid, "15", ta.rsi(close, 14)[1], lookahead=barmerge.lookahead_on)
          forecastAtr14 = request.security(syminfo.tickerid, "15", ta.atr(14)[1], lookahead=barmerge.lookahead_on)
          forecastAtrMean50 = request.security(syminfo.tickerid, "15", ta.sma(ta.atr(14), 50)[1], lookahead=barmerge.lookahead_on)
          forecastRangeHigh80 = request.security(syminfo.tickerid, "15", ta.highest(high, 80)[1], lookahead=barmerge.lookahead_on)
          forecastRangeLow80 = request.security(syminfo.tickerid, "15", ta.lowest(low, 80)[1], lookahead=barmerge.lookahead_on)

          forecastHtfClose = request.security(syminfo.tickerid, "240", close[1], lookahead=barmerge.lookahead_on)
          forecastHtfEma20 = request.security(syminfo.tickerid, "240", ta.ema(close, 20)[1], lookahead=barmerge.lookahead_on)
          forecastHtfEma20Prev = request.security(syminfo.tickerid, "240", ta.ema(close, 20)[2], lookahead=barmerge.lookahead_on)
          forecastHtfAtr14 = request.security(syminfo.tickerid, "240", ta.atr(14)[1], lookahead=barmerge.lookahead_on)

          forecastDataReady = not na(forecastClose) and not na(forecastEma21) and not na(forecastEma34) and not na(forecastEma90) and not na(forecastEma21Prev3) and not na(forecastEma90Prev3) and not na(forecastClose12) and not na(forecastClose24) and not na(forecastRsi14) and not na(forecastAtr14) and not na(forecastAtrMean50) and not na(forecastRangeHigh80) and not na(forecastRangeLow80) and not na(forecastHtfClose) and not na(forecastHtfEma20) and not na(forecastHtfEma20Prev) and not na(forecastHtfAtr14)

          forecastHtfBull = forecastHtfClose > forecastHtfEma20 and forecastHtfEma20 >= forecastHtfEma20Prev
          forecastHtfBear = forecastHtfClose < forecastHtfEma20 and forecastHtfEma20 <= forecastHtfEma20Prev
          forecastHtfDirection = forecastHtfBull ? 1.0 : forecastHtfBear ? -1.0 : 0.0

          forecastEmaBull = forecastEma21 > forecastEma34 and forecastEma34 > forecastEma90
          forecastEmaBear = forecastEma21 < forecastEma34 and forecastEma34 < forecastEma90
          forecastEmaDirection = forecastEmaBull ? 1.0 : forecastEmaBear ? -1.0 : 0.0

          forecastPriceDirection = forecastClose > forecastEma90 ? 1.0 : forecastClose < forecastEma90 ? -1.0 : 0.0
          forecastSlopeBull = forecastEma21 > forecastEma21Prev3 and forecastEma90 >= forecastEma90Prev3
          forecastSlopeBear = forecastEma21 < forecastEma21Prev3 and forecastEma90 <= forecastEma90Prev3
          forecastSlopeDirection = forecastSlopeBull ? 1.0 : forecastSlopeBear ? -1.0 : 0.0

          forecastMomentum = 0.50 * (forecastClose - forecastClose12) + 0.50 * (forecastClose - forecastClose24)
          forecastMomentumDirection = forecastMomentum > 0 ? 1.0 : forecastMomentum < 0 ? -1.0 : 0.0
          forecastRsiDirection = forecastRsi14 > 57.5 ? 1.0 : forecastRsi14 < 42.5 ? -1.0 : 0.0
          forecastTrendDirection = forecastEma34 > forecastEma90 ? 1.0 : forecastEma34 < forecastEma90 ? -1.0 : 0.0

          directionScore = 1.00 * forecastHtfDirection + 1.50 * forecastEmaDirection + 1.00 * forecastPriceDirection + 1.00 * forecastSlopeDirection + 0.75 * forecastMomentumDirection + 0.25 * forecastRsiDirection + 0.50 * forecastTrendDirection
          forecastVolRegime = forecastAtrMean50 > 0 ? forecastAtr14 / forecastAtrMean50 - 1.0 : na
          forecastRangeSpan = forecastRangeHigh80 - forecastRangeLow80
          forecastRangePosition = forecastRangeSpan > 0 ? ((forecastClose - forecastRangeLow80) / forecastRangeSpan - 0.50) * 2.0 : 0.0
          forecastHtfGap = forecastHtfAtr14 > 0 ? (forecastHtfClose - forecastHtfEma20) / forecastHtfAtr14 : 0.0

          bullishDirectionForecast = showDirectionForecast and forecastDataReady and directionScore >= 5.0 and forecastVolRegime <= 0.25
          bearishDirectionForecast = showDirectionForecast and forecastDataReady and directionScore <= -6.0 and forecastHtfGap >= -0.50 and forecastRangePosition >= -0.40
          directionForecastDir = bullishDirectionForecast ? 1 : bearishDirectionForecast ? -1 : 0
          directionForecast = directionForecastDir == 1 ? "BULLISH" : directionForecastDir == -1 ? "BEARISH" : "NO CLEAR DIRECTION"
          directionForecastProbability = directionForecastDir == 0 ? 50 : 56
          directionForecastText = directionForecastDir == 0 ? directionForecast : directionForecast + " · " + str.tostring(directionForecastProbability) + "% EST."
          directionForecastColor = directionForecastDir == 1 ? color.lime : directionForecastDir == -1 ? color.red : color.yellow
          '''
          if text.count(market_anchor) != 1:
              raise SystemExit(f"Expected one market-state anchor, found {text.count(market_anchor)}")
          text = text.replace(market_anchor, forecast_block, 1)

          dashboard_marker = '''// ============================================================================
          // COMPACT MAPPING DASHBOARD — ENTRY IS CHART-ONLY
          // ============================================================================'''
          dashboard_start = text.find(dashboard_marker)
          if dashboard_start < 0:
              raise SystemExit("Dashboard marker not found")

          dashboard_block = '''// ============================================================================
          // UNIFIED DASHBOARD — MARKET STATE / DIRECTION FORECAST / LIQUIDITY DRAW
          // ============================================================================
          dashHeader = color.rgb(58, 58, 58)
          dashBg = color.rgb(86, 86, 86)
          dashAlt = color.rgb(74, 74, 74)
          dashBorder = color.rgb(120, 120, 120)

          var table dashboard = table.new(position.bottom_right, 2, 18, bgcolor=dashBg, border_width=1, border_color=dashBorder)

          if barstate.isfirst
              table.merge_cells(dashboard, 0, 0, 1, 0)
              table.merge_cells(dashboard, 0, 1, 1, 1)
              table.merge_cells(dashboard, 0, 5, 1, 5)
              table.merge_cells(dashboard, 0, 9, 1, 9)
              table.merge_cells(dashboard, 0, 14, 1, 14)
              table.merge_cells(dashboard, 0, 15, 1, 15)
              table.merge_cells(dashboard, 0, 16, 1, 16)
              table.merge_cells(dashboard, 0, 17, 1, 17)

          if showDashboard and barstate.islast
              table.cell(dashboard, 0, 0, "AMY ICT — " + timeframe.period + " MARKET MAPPING", text_color=color.white, text_size=size.small, text_halign=text.align_left, bgcolor=dashHeader)

              table.cell(dashboard, 0, 1, "MARKET STATE — CURRENT CONDITION", text_color=color.white, text_size=size.small, text_halign=text.align_left, bgcolor=dashHeader)
              table.cell(dashboard, 0, 2, "Condition", text_color=color.white, text_size=size.small, bgcolor=dashBg)
              table.cell(dashboard, 1, 2, marketState, text_color=marketColor, text_size=size.small, text_halign=text.align_left, bgcolor=dashBg)
              table.cell(dashboard, 0, 3, "HTF / Structure", text_color=color.white, text_size=size.small, bgcolor=dashAlt)
              table.cell(dashboard, 1, 3, biasText + " / " + trend, text_color=marketColor, text_size=size.small, text_halign=text.align_left, bgcolor=dashAlt)
              table.cell(dashboard, 0, 4, "EMA / Context", text_color=color.white, text_size=size.small, bgcolor=dashBg)
              table.cell(dashboard, 1, 4, emaText + " / " + rangeText, text_color=inDiscount ? color.lime : inPremium ? color.orange : color.silver, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashBg)

              table.cell(dashboard, 0, 5, "DIRECTION FORECAST — PROBABILISTIC", text_color=color.white, text_size=size.small, text_halign=text.align_left, bgcolor=dashHeader)
              table.cell(dashboard, 0, 6, "Forecast", text_color=color.white, text_size=size.small, bgcolor=dashAlt)
              table.cell(dashboard, 1, 6, directionForecastText, text_color=directionForecastColor, text_size=size.small, text_halign=text.align_left, bgcolor=dashAlt)
              table.cell(dashboard, 0, 7, "Horizon", text_color=color.white, text_size=size.small, bgcolor=dashBg)
              table.cell(dashboard, 1, 7, "48 HOURS · M15 MODEL", text_color=color.white, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashBg)
              table.cell(dashboard, 0, 8, "Evidence", text_color=color.white, text_size=size.small, bgcolor=dashAlt)
              table.cell(dashboard, 1, 8, "Score " + str.tostring(directionScore, "#.##") + " · Vol " + str.tostring(forecastVolRegime, "#.##"), text_color=color.white, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashAlt)

              table.cell(dashboard, 0, 9, "LIQUIDITY DRAW — FIRST TARGET", text_color=color.white, text_size=size.small, text_halign=text.align_left, bgcolor=dashHeader)
              table.cell(dashboard, 0, 10, "First Draw", text_color=color.white, text_size=size.small, bgcolor=dashBg)
              table.cell(dashboard, 1, 10, liquidityDominance, text_color=predictionTextColor, text_size=size.small, text_halign=text.align_left, bgcolor=dashBg)
              table.cell(dashboard, 0, 11, "BSL Target", text_color=color.white, text_size=size.small, bgcolor=dashAlt)
              table.cell(dashboard, 1, 11, bslTargetDashboard, text_color=color.lime, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashAlt)
              table.cell(dashboard, 0, 12, "SSL Target", text_color=color.white, text_size=size.small, bgcolor=dashBg)
              table.cell(dashboard, 1, 12, sslTargetDashboard, text_color=color.red, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashBg)
              table.cell(dashboard, 0, 13, "Session / Liquidity", text_color=color.white, text_size=size.small, bgcolor=dashAlt)
              table.cell(dashboard, 1, 13, sessionText + " / " + liqText, text_color=validSession ? color.lime : color.white, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashAlt)

              table.cell(dashboard, 0, 14, "EVENT HISTORY", text_color=color.white, text_size=size.small, text_halign=text.align_left, bgcolor=dashHeader)
              table.cell(dashboard, 0, 15, event0, text_color=color.white, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashBg)
              table.cell(dashboard, 0, 16, event1, text_color=color.white, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashAlt)
              table.cell(dashboard, 0, 17, event2, text_color=color.white, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashBg)
          else if barstate.islast
              table.clear(dashboard, 0, 0, 1, 17)
          '''
          text = text[:dashboard_start] + dashboard_block

          required = [
              'grpForecast = "3. Direction Forecast"',
              'DIRECTION FORECAST — CALIBRATED M15 MODEL, 48-HOUR HORIZON',
              'directionScore >= 5.0',
              'directionScore <= -6.0',
              'NO CLEAR DIRECTION',
              'LIQUIDITY DRAW — FIRST TARGET',
              'table.new(position.bottom_right, 2, 18',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Missing required forecast content: {missing}")

          if text.count('request.security(syminfo.tickerid, "15"') != 13:
              raise SystemExit("Unexpected number of calibrated M15 requests")
          if text.count('request.security(syminfo.tickerid, "240"') != 4:
              raise SystemExit("Unexpected number of calibrated H4 requests")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate generated Pine structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("AMY_ICT_NextGen.pine").read_text(encoding="utf-8")
          pairs = {"(": ")", "[": "]", "{": "}"}
          for left, right in pairs.items():
              if text.count(left) != text.count(right):
                  raise SystemExit(f"Unbalanced {left}{right}: {text.count(left)} != {text.count(right)}")
          if text.count("var table dashboard") != 1:
              raise SystemExit("Dashboard declaration is not unique")
          if "COMPACT MAPPING DASHBOARD" in text:
              raise SystemExit("Old dashboard block still present")
          print("Pine structural validation passed")
          PY

      - name: Commit calibrated direction forecast
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-direction-forecast.yml
          git add AMY_ICT_NextGen.pine
          git commit -m "Add calibrated market direction forecast"
          git push origin HEAD:feature/market-state-direction-forecast-20260714
