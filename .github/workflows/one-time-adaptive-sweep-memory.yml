name: Apply adaptive sweep memory

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-adaptive-sweep-memory.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update sweep memory
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('AMY_ICT_NextGen.pine')
          text = p.read_text(encoding='utf-8')
          old = 'entrySweepMemoryBars = 48'
          new = 'entrySweepMemoryBars = timeframe.isminutes and timeframe.multiplier > 30 and timeframe.multiplier <= 60 ? 12 : 48'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one marker, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'entrySweepMemoryBars = timeframe.isminutes' AMY_ICT_NextGen.pine
      - name: Commit final update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-adaptive-sweep-memory.yml
          git add AMY_ICT_NextGen.pine
          git commit -m "Use adaptive sweep memory for H1 entries"
          git push origin HEAD:main
