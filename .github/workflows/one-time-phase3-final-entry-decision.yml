name: Append Phase 3 final entry decision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-phase3-final-entry-decision.yml'

permissions:
  contents: write

jobs:
  append-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append verified comment-only closure payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Amy-SMC-D.pine)" = 'd6e6d7c979dd5a852bddd9661bef0480caa2eb35'
          test "$(git hash-object Amy-SMC-D-LAB.pine)" = 'f2c666e8199812bee427f28c57ed13c4bf80cded'
          test -f .tmp/k1-entry-phase3-final-decision.txt
          ! grep -q 'PHASE 3 FINAL ENTRY-CONSTRUCTION DECISION' Amy-SMC-D-LAB.pine
          if grep -Ev '^[[:space:]]*(//.*)?$' .tmp/k1-entry-phase3-final-decision.txt; then
            echo 'Payload contains a non-comment line'
            exit 1
          fi
          cp Amy-SMC-D.pine /tmp/production.before
          cat .tmp/k1-entry-phase3-final-decision.txt >> Amy-SMC-D-LAB.pine
          cmp -s Amy-SMC-D.pine /tmp/production.before
          git diff --exit-code -- Amy-SMC-D.pine
          test "$(git diff --name-only)" = 'Amy-SMC-D-LAB.pine'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-D-LAB.pine
          git commit -m 'docs: close Phase 3 entry construction decision'
          git push origin main
