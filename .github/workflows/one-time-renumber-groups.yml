name: Renumber indicator input groups

on:
  push:
    branches:
      - feature/market-state-direction-forecast-20260714
    paths:
      - .github/workflows/one-time-renumber-groups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-state-direction-forecast-20260714
      - name: Keep input groups sequential
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("AMY_ICT_NextGen.pine")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'grpEma = "3. EMA"': 'grpEma = "4. EMA"',
              'grpStruct = "4. Structure"': 'grpStruct = "5. Structure"',
              'grpSR = "5. Support Resistance"': 'grpSR = "6. Support Resistance"',
              'grpPoi = "6. ICT Base OB / FVG"': 'grpPoi = "7. ICT Base OB / FVG"',
              'grpEntry = "7. Entry Map"': 'grpEntry = "8. Entry Map"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence of {old!r}, found {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit group numbering
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-renumber-groups.yml
          git add AMY_ICT_NextGen.pine
          git commit -m "Keep indicator input groups sequential"
          git push origin HEAD:feature/market-state-direction-forecast-20260714
