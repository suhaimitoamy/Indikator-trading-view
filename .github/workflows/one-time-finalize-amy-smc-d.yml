name: Finalize Amy SMC D baseline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-finalize-amy-smc-d.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build clean D from Z plus validated Dealing Range fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          z = Path('Amy-SMC-Z.pine').read_text(encoding='utf-8')
          c = Path('Amy-SMC-C-LAB.pine').read_text(encoding='utf-8')
          assert 'AMY SMC B BASELINE — PROMOTED M5 TGT2 SEGMENTED TARGET / EXPIRY.' in c
          assert 'amyBM5TargetCapR' in c and 'amyTargetExpiryBarsNow' in c
          assert 'amyBM15Mgmt' not in c and 'H1 TRADE MANAGEMENT' not in c
          assert 'AMY SMC B BASELINE — PROMOTED M5 TGT2 SEGMENTED TARGET / EXPIRY.' not in z
          assert 'amyBM5TargetCapR' not in z and 'amyTargetExpiryBarsNow' not in z
          start = 'bool amyDRValid = not na(amyDRTop) and not na(amyDRBottom) and amyDRTop > amyDRBottom\n'
          end = 'int amyLiquidityAge = na(amyLastLiquidityBar) ? 1000000 : bar_index - amyLastLiquidityBar\n'
          for label, text in [('Z', z), ('C-LAB', c)]:
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f'{label}: dealing-range anchors not unique')
          zi, zj = z.index(start), z.index(end, z.index(start))
          ci, cj = c.index(start), c.index(end, c.index(start))
          dr = c[ci:cj]
          required = [
              'float amyCDealingPremiumRatio = amyRound5M5 ? 0.70 : amyRound5M15 ? 0.60 : amyPassedDRPremiumRatio',
              'float amyCDealingDiscountRatio = amyRound5M5 ? 0.30 : amyRound5M15 ? 0.40 : amyPassedDRDiscountRatio',
              'float amyCH1RangeTop = amyRound5H1 ? ta.highest(high[1], 240) : na',
              'float amyCH1RangeBottom = amyRound5H1 ? ta.lowest(low[1], 240) : na',
              'float amyCH1PremiumGate = amyCH1DRValid ? amyCH1RangeBottom + amyCH1RangeSpan * 0.55 : na',
              'float amyCH1DiscountGate = amyCH1DRValid ? amyCH1RangeBottom + amyCH1RangeSpan * 0.45 : na',
              'if amyRound5H1', 'if amyCDealingPureTF'
          ]
          for marker in required:
              if marker not in dr:
                  raise SystemExit(f'DR guard missing: {marker}')
          dr = dr.replace('// AMY SMC C — DEALING RANGE PURE-LOCATION PROFILES.', '// AMY SMC D — DEALING RANGE PURE-LOCATION PROFILES.')
          dr = dr.replace('// C H1 — dedicated rolling range', '// D H1 — dedicated rolling range')
          dr = dr.replace('// C H1: pure-location descriptive state', '// D H1: pure-location descriptive state')
          dr = dr.replace('// C M5/M15: the field itself is the validated pure-location signal.', '// D M5/M15: the field itself is the validated pure-location signal.')
          dr = dr.replace('frozen B/Z behavior', 'frozen Z behavior')
          d = z[:zi] + dr + z[zj:]
          d = d.replace("indicator('Amy SMC Z', 'Amy SMC Z'", "indicator('Amy SMC D', 'Amy SMC D'", 1)
          d_norm = d.replace("indicator('Amy SMC D', 'Amy SMC D'", "indicator('Amy SMC Z', 'Amy SMC Z'", 1)
          di, dj = d_norm.index(start), d_norm.index(end, d_norm.index(start))
          assert d_norm[:di] == z[:zi] and d_norm[dj:] == z[zj:]
          forbidden = ['AMY SMC B BASELINE — PROMOTED M5 TGT2 SEGMENTED TARGET / EXPIRY.','amyBM5TargetCapR','amyBM5HighRisk','amyBM5LockedTarget','amyBM5TargetExpired','amyTargetExpiryBarsNow','amyBM15Mgmt','amyBH1Mgmt','M15 TRADE MANAGEMENT','H1 TRADE MANAGEMENT']
          for marker in forbidden:
              if marker in d:
                  raise SystemExit(f'forbidden execution marker leaked into D: {marker}')
          assert 'AMY SMC Z ROUND 8 TARGET V1' in d
          assert 'float amyTarget = not amyHasExecutionSignal' in d
          dlab = d.replace("indicator('Amy SMC D', 'Amy SMC D'", "indicator('Amy SMC D LAB', 'Amy SMC D LAB'", 1)
          Path('Amy-SMC-D.pine').write_text(d, encoding='utf-8')
          Path('Amy-SMC-D-LAB.pine').write_text(dlab, encoding='utf-8')
          print('BUILD_D_OK')
          print('D_EQUALS_Z_OUTSIDE_DR=YES')
          print('B_EXECUTION_EXCLUDED=YES')
          PY
          mkdir -p reports
          cat > reports/AMY-SMC-D-CHEATSHEET.md <<'EOF'
          # Amy SMC D — Directional Accuracy Cheat-Sheet

          **Baseline:** `Amy-SMC-D.pine`
          **Purpose:** referensi baku pembacaan dashboard manual; directional/context only.
          **Data:** raw XAUUSD 2005–Jul 2026; OOS 2012–Jul 2026 bila dicantumkan; 2004 warm-up.
          **Low-confidence:** <30 evaluable events per yearly/window slice.

          ## Final baseline definition

          Amy SMC D = **logic Amy SMC Z asli + hanya tiga fix descriptive Dealing Range**:

          - **M5:** pure-location; Premium >=70% bearish, Discount <=30% bullish.
          - **M15:** pure-location; Premium >=60% bearish, Discount <=40% bullish.
          - **H1:** high/low dari **previous 240 closed H1 bars** (`high[1]`/`low[1]`); Premium >=55% bearish, Discount <=45% bullish; tanpa Swing/Internal/HTF context gate.

          D **tidak membawa** M5 TGT2 segmented target/expiry dari B dan **tidak membawa** ATR trade-management M15/H1 dari B-LAB. Original Z logic, termasuk Z Target V1, tetap utuh.

          ## RELIABLE / FIXED only

          | Field | Status | M5 | M15 | H1 | Catatan manual |
          |---|---|---:|---:|---:|---|
          | Dealing Range | **FIXED** | **65.54%** full; OOS 65.41%, 15/15 HC | **62.48%** full; OOS 62.98%, 15/15 HC | **63.09%** full; **64.52% OOS**, 15/15 HC | Descriptive location state |
          | Swing Structure — fresh | **RELIABLE** | **81.42%**, N=5,822 | **88.97%**, N=1,941 | **94.55%**, N=422; low yearly sample | Baca hanya saat baru flip |
          | Internal Structure — fresh | **RELIABLE** | **69.27%**, N=40,283 | **74.44%**, N=14,172 | **80.15%**, N=3,617 | Fresh structure evidence |
          | HTF Swing — fresh | **RELIABLE** | **68.94%**, N=52,961 | **76.20%**, N=12,554 | **82.16%**, N=2,926 | Jangan invert |
          | Final Bias — fresh | **RELIABLE when fresh** | **71.41%**, N=41,820 | **77.87%**, N=11,433 | **84.20%**, N=2,822 | Fresh only; stale bukan primary direction |
          | Next Move | **RELIABLE** | **73.62%**, N=944; OOS 74.89% | **77.87%**, N=11,433; OOS 77.98% | **83.34%**, N=2,906; OOS 83.92% | Primary forward direction; invalidation-based, tanpa TP scoring |
          | Sweep Continuation | **RELIABLE M5/M15** | **79.86%**, N=4,678 | **84.72%**, N=1,616 | **92.48%**, N=319; low yearly sample | Arah setelah raw sweep |
          | Raw Valid Break | **RELIABLE** | **83.99%**, N=10,096 | **89.73%**, N=3,565 | **96.07%**, N=814 | Strong structural-survival evidence |
          | Qualified Valid Break | **RELIABLE where sampled** | **88.92%**, N=352; low yearly sample | **90.66%**, N=1,328; 21/22 HC | **97.82%**, N=412; low yearly sample | Hormati low-sample flag |
          | Qualified CHoCH | **RELIABLE where sampled** | **78.50%**, N=963; 21/22 HC | **92.60%**, N=473; low yearly sample | **97.56%**, N=82; low sample | Evidence kuat saat muncul |
          | Raw Pattern | **RELIABLE** | **65.21%**, N=180,069 | **70.97%**, N=56,662 | **75.03%**, N=12,634 | Raw candlestick evidence |
          | Qualified Pattern | **RELIABLE M15/H1** | **67.45%**, N=424; low yearly coverage | **90.56%**, N=5,108; 22/22 HC | **93.60%**, N=1,359; 22/22 HC | Prefer qualified M15/H1 |

          Continuous Swing/Internal/HTF/Final Bias, raw continuous Liquidity, Event History, raw Sweep, dan Qualified BOS sengaja tidak dimasukkan karena statusnya SUBSTITUTE/CONTEXT ONLY/LOW SAMPLE, bukan standalone daily directional read yang disahkan.
          EOF
          grep -n "DEALING RANGE PURE-LOCATION\|amyCH1RangeTop\|amyCDealingPremiumRatio\|AMY SMC Z ROUND 8 TARGET V1" Amy-SMC-D.pine
          if grep -n "AMY SMC B BASELINE\|amyBM5TargetCapR\|amyBM15Mgmt\|H1 TRADE MANAGEMENT" Amy-SMC-D.pine; then exit 1; fi

      - name: Commit final D and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-finalize-amy-smc-d.yml
          git add Amy-SMC-D.pine Amy-SMC-D-LAB.pine reports/AMY-SMC-D-CHEATSHEET.md
          git commit -m "Promote clean Amy SMC D directional baseline"
          git push origin HEAD:main
