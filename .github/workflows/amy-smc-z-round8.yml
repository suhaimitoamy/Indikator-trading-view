name: Amy SMC Z Round 8

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/amy-smc-z-round8.yml'

permissions:
  contents: write

jobs:
  patch-round8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Round 8 regime-adaptive patch
        run: |
          python .github/scripts/amy_smc_z_round8.py
          git diff --check -- Amy-SMC-Z.pine
          git diff --quiet -- Amy-SMC-Y.pine Amy-SMC-X.pine Amy-SMC.pine
          grep -q "TRADE • TRANSITION" Amy-SMC-Z.pine
          grep -q "WATCH • SWEEP" Amy-SMC-Z.pine
          grep -q "Round 8 Regime Signal" Amy-SMC-Z.pine
          grep -q "amyNextDirection == BEARISH ? 'DOWN' : 'WAIT'" Amy-SMC-Z.pine
          grep -q "amyTargetRiskDistance \* 0.40" Amy-SMC-Z.pine
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-Z.pine
          if git diff --cached --quiet; then
            echo "No Round 8 changes generated"
            exit 1
          fi
          git commit -m "Implement Amy SMC Z Round 8 regime-adaptive predictor"
          git push
