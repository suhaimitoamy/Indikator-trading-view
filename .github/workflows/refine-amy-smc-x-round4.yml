name: Refine Amy SMC X Round 4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refine-amy-smc-x-round4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Tune lower-TF dealing range and pattern
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          old = """bool amyDRBullContext = amyDRBias == BULLISH and swingTrend.bias == BULLISH and internalTrend.bias != BEARISH
bool amyDRBearContext = amyDRBias == BEARISH and swingTrend.bias == BEARISH and internalTrend.bias != BULLISH
"""
          new = """// H1 65/35 profile is already PASSED and remains byte-for-byte equivalent in behavior.
// Only lower timeframes get stricter structural confirmation.
float amyCurrentTfSec = timeframe.in_seconds()
bool amyDRLowerTF = not na(amyCurrentTfSec) and amyCurrentTfSec <= 900
bool amyDRBullHTFConfirm = na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == BULLISH
bool amyDRBearHTFConfirm = na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == BEARISH
bool amyDRBullContextBase = amyDRBias == BULLISH and swingTrend.bias == BULLISH and internalTrend.bias != BEARISH
bool amyDRBearContextBase = amyDRBias == BEARISH and swingTrend.bias == BEARISH and internalTrend.bias != BULLISH
bool amyDRBullContext = amyDRBullContextBase and (not amyDRLowerTF or (internalTrend.bias == BULLISH and amyDRBullHTFConfirm))
bool amyDRBearContext = amyDRBearContextBase and (not amyDRLowerTF or (internalTrend.bias == BEARISH and amyDRBearHTFConfirm))
"""
          if old not in s:
              raise SystemExit('DR context block not found')
          s = s.replace(old, new, 1)

          old = """int amyPatternVotes = amyPatternBiasActive == 0 ? 0 : (amySafeHTFBias == amyPatternBiasActive ? 1 : 0) + (amyCurrentSwingBias == amyPatternBiasActive ? 1 : 0) + (amyCurrentInternalBias == amyPatternBiasActive ? 1 : 0) + (amyLiquidityBiasActive == amyPatternBiasActive ? 1 : 0)
int amyPatternOpposes = amyPatternBiasActive == 0 ? 0 : (amySafeHTFBias != 0 and amySafeHTFBias == -amyPatternBiasActive ? 1 : 0) + (amyCurrentSwingBias != 0 and amyCurrentSwingBias == -amyPatternBiasActive ? 1 : 0) + (amyCurrentInternalBias != 0 and amyCurrentInternalBias == -amyPatternBiasActive ? 1 : 0) + (amyLiquidityBiasActive != 0 and amyLiquidityBiasActive == -amyPatternBiasActive ? 1 : 0)
bool amyPatternReversal = amyLastPattern == 'Morning Star' or amyLastPattern == 'Evening Star' or amyLastPattern == 'Hammer' or amyLastPattern == 'Shooting Star' or amyLastPattern == 'Bullish Pin Bar' or amyLastPattern == 'Bearish Pin Bar'
bool amyPatternLocalBoth = amyPatternBiasActive != 0 and amyCurrentSwingBias == amyPatternBiasActive and amyCurrentInternalBias == amyPatternBiasActive
bool amyPatternLiquidityConfirm = amyPatternBiasActive != 0 and amyLiquidityBiasActive == amyPatternBiasActive
bool amyPatternContextQualified = amyPatternBiasActive != 0 and amyPatternVotes >= 2 and amyPatternOpposes <= 1 and (not amyPatternReversal or amyPatternLiquidityConfirm or amyPatternLocalBoth)
amyPatternBiasActive := amyPatternContextQualified ? amyPatternBiasActive : 0
"""
          new = """int amyPatternCandidate = amyPatternBiasActive
int amyPatternVotes = amyPatternCandidate == 0 ? 0 : (amySafeHTFBias == amyPatternCandidate ? 1 : 0) + (amyCurrentSwingBias == amyPatternCandidate ? 1 : 0) + (amyCurrentInternalBias == amyPatternCandidate ? 1 : 0) + (amyLiquidityBiasActive == amyPatternCandidate ? 1 : 0)
int amyPatternOpposes = amyPatternCandidate == 0 ? 0 : (amySafeHTFBias != 0 and amySafeHTFBias == -amyPatternCandidate ? 1 : 0) + (amyCurrentSwingBias != 0 and amyCurrentSwingBias == -amyPatternCandidate ? 1 : 0) + (amyCurrentInternalBias != 0 and amyCurrentInternalBias == -amyPatternCandidate ? 1 : 0) + (amyLiquidityBiasActive != 0 and amyLiquidityBiasActive == -amyPatternCandidate ? 1 : 0)
bool amyPatternReversal = amyLastPattern == 'Morning Star' or amyLastPattern == 'Evening Star' or amyLastPattern == 'Hammer' or amyLastPattern == 'Shooting Star' or amyLastPattern == 'Bullish Pin Bar' or amyLastPattern == 'Bearish Pin Bar'
bool amyPatternLocalBoth = amyPatternCandidate != 0 and amyCurrentSwingBias == amyPatternCandidate and amyCurrentInternalBias == amyPatternCandidate
bool amyPatternLiquidityConfirm = amyPatternCandidate != 0 and amyLiquidityBiasActive == amyPatternCandidate
bool amyPatternBearPriority = amyLastPattern == 'Bearish Engulfing' or amyLastPattern == 'Evening Star' or amyLastPattern == 'Bearish Pin Bar'
bool amyPatternBullish = amyPatternCandidate == BULLISH
int amyPatternRequiredVotes = amyPatternBearPriority ? 2 : 3
bool amyPatternConflictOK = amyPatternBearPriority ? amyPatternOpposes <= 1 : amyPatternOpposes == 0
bool amyPatternBullExtra = not amyPatternBullish or amyPatternLiquidityConfirm or amyPatternLocalBoth
bool amyPatternReversalExtra = not amyPatternReversal or amyPatternLiquidityConfirm or amyPatternLocalBoth
bool amyPatternContextQualified = amyPatternCandidate != 0 and amyPatternVotes >= amyPatternRequiredVotes and amyPatternConflictOK and amyPatternBullExtra and amyPatternReversalExtra
amyPatternBiasActive := amyPatternContextQualified ? amyPatternCandidate : 0
"""
          if old not in s:
              raise SystemExit('Pattern qualification block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Tune weak dealing range and pattern filters'
          git push

      - name: Tune BOS CHoCH and liquidity events
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()
          old = """bool amyQualifiedBSLSweep = amyBSLSweep and high >= amyBSL + amyMinSweepExcursion and close >= amyBSL - nz(amyEventAtr, 0.0) * 0.20
bool amyQualifiedSSLSweep = amySSLSweep and low <= amySSL - amyMinSweepExcursion and close <= amySSL + nz(amyEventAtr, 0.0) * 0.20
bool amyQualifiedBSLValidBreak = amyBSLValidBreak and amyEventDisplacement and close > open and close >= amyBSL + amyMinBreakExcursion
bool amyQualifiedSSLValidBreak = amySSLValidBreak and amyEventDisplacement and close < open and close <= amySSL - amyMinBreakExcursion
"""
          new = """bool amyEventHTFBullOK = na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == BULLISH
bool amyEventHTFBearOK = na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == BEARISH
bool amySweepBearStructureOK = internalTrend.bias != BULLISH and (swingTrend.bias == BEARISH or amyEventHTFBearOK)
bool amySweepBullStructureOK = internalTrend.bias != BEARISH and (swingTrend.bias == BULLISH or amyEventHTFBullOK)
bool amyQualifiedBSLSweep = amyBSLSweep and high >= amyBSL + amyMinSweepExcursion and close >= amyBSL - nz(amyEventAtr, 0.0) * 0.20 and amySweepBearStructureOK
bool amyQualifiedSSLSweep = amySSLSweep and low <= amySSL - amyMinSweepExcursion and close <= amySSL + nz(amyEventAtr, 0.0) * 0.20 and amySweepBullStructureOK
bool amyQualifiedBSLValidBreak = amyBSLValidBreak and amyEventDisplacement and close > open and close >= amyBSL + amyMinBreakExcursion and internalTrend.bias == BULLISH and amyEventHTFBullOK
bool amyQualifiedSSLValidBreak = amySSLValidBreak and amyEventDisplacement and close < open and close <= amySSL - amyMinBreakExcursion and internalTrend.bias == BEARISH and amyEventHTFBearOK
"""
          if old not in s:
              raise SystemExit('Liquidity qualifier block not found')
          s = s.replace(old, new, 1)

          old = """// Directional BOS gets one extra confirmation from the accepted HTF Swing. CHoCH keeps the previous rule.
bool amyQualifiedSwingBullBOS = amyBaseQualifiedSwingBullBOS and (na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == BULLISH)
bool amyQualifiedSwingBearBOS = amyBaseQualifiedSwingBearBOS and (na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == BEARISH)
bool amyQualifiedSwingBullCHoCH = amyBaseQualifiedSwingBullCHoCH
bool amyQualifiedSwingBearCHoCH = amyBaseQualifiedSwingBearCHoCH
"""
          new = """// Directional qualification is stricter than the frozen OTE/Fib base qualifier.
// Passed OTE/Fib behavior remains untouched because it still reads amyBaseQualifiedSwing*.
bool amyQualifiedSwingBullBOS = amyBaseQualifiedSwingBullBOS and internalTrend.bias == BULLISH and amyEventHTFBullOK
bool amyQualifiedSwingBearBOS = amyBaseQualifiedSwingBearBOS and internalTrend.bias == BEARISH and amyEventHTFBearOK
bool amyQualifiedSwingBullCHoCH = amyBaseQualifiedSwingBullCHoCH and internalTrend.bias == BULLISH and (amyEventHTFBullOK or amySSLSweep)
bool amyQualifiedSwingBearCHoCH = amyBaseQualifiedSwingBearCHoCH and internalTrend.bias == BEARISH and (amyEventHTFBearOK or amyBSLSweep)
"""
          if old not in s:
              raise SystemExit('BOS/CHoCH directional block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Tune weak BOS CHoCH and liquidity event qualifiers'
          git push

      - name: Protect strong levels and gate targets honestly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()
          marker = """bool amyQualifiedSwingBearCHoCH = amyBaseQualifiedSwingBearCHoCH and internalTrend.bias == BEARISH and (amyEventHTFBearOK or amyBSLSweep)

if amyBSLSweep
"""
          insert = """bool amyQualifiedSwingBearCHoCH = amyBaseQualifiedSwingBearCHoCH and internalTrend.bias == BEARISH and (amyEventHTFBearOK or amyBSLSweep)

// Amy protected swing layer: strong levels are only promoted after a qualified structural break.
// This does not modify LuxAlgo's original structure engine.
var float amyProtectedStrongHigh = na
var float amyProtectedStrongLow = na
var int amyProtectedStrongHighBar = na
var int amyProtectedStrongLowBar = na
if barstate.isconfirmed
    if (amyBaseQualifiedSwingBullBOS or amyBaseQualifiedSwingBullCHoCH) and not na(swingLow.currentLevel)
        amyProtectedStrongLow := swingLow.currentLevel
        amyProtectedStrongLowBar := swingLow.barIndex
    if (amyBaseQualifiedSwingBearBOS or amyBaseQualifiedSwingBearCHoCH) and not na(swingHigh.currentLevel)
        amyProtectedStrongHigh := swingHigh.currentLevel
        amyProtectedStrongHighBar := swingHigh.barIndex

if amyBSLSweep
"""
          if marker not in s:
              raise SystemExit('Strong-level insertion marker not found')
          s = s.replace(marker, insert, 1)

          old = """            if currentText == 'Strong High'
                label.set_text(currentLabel, 'Strong High ' + amyPrice(trailing.top))
            else if currentText == 'Weak High'
                label.set_text(currentLabel, 'Weak High ' + amyPrice(trailing.top))
            else if currentText == 'Strong Low'
                label.set_text(currentLabel, 'Strong Low ' + amyPrice(trailing.bottom))
            else if currentText == 'Weak Low'
                label.set_text(currentLabel, 'Weak Low ' + amyPrice(trailing.bottom))
"""
          new = """            if str.contains(currentText, 'Strong High')
                if not na(amyProtectedStrongHigh) and not na(amyProtectedStrongHighBar)
                    label.set_xy(currentLabel, amyProtectedStrongHighBar, amyProtectedStrongHigh)
                    label.set_text(currentLabel, 'Strong High ' + amyPrice(amyProtectedStrongHigh))
                else
                    label.set_text(currentLabel, 'Strong High ' + amyPrice(trailing.top))
            else if currentText == 'Weak High'
                label.set_text(currentLabel, 'Weak High ' + amyPrice(trailing.top))
            else if str.contains(currentText, 'Strong Low')
                if not na(amyProtectedStrongLow) and not na(amyProtectedStrongLowBar)
                    label.set_xy(currentLabel, amyProtectedStrongLowBar, amyProtectedStrongLow)
                    label.set_text(currentLabel, 'Strong Low ' + amyPrice(amyProtectedStrongLow))
                else
                    label.set_text(currentLabel, 'Strong Low ' + amyPrice(trailing.bottom))
            else if currentText == 'Weak Low'
                label.set_text(currentLabel, 'Weak Low ' + amyPrice(trailing.bottom))
"""
          if old not in s:
              raise SystemExit('Strong/Weak display block not found')
          s = s.replace(old, new, 1)

          old = """float amyProtectedLow = not na(swingLow.currentLevel) and swingLow.currentLevel < close ? swingLow.currentLevel : na
float amyProtectedHigh = not na(swingHigh.currentLevel) and swingHigh.currentLevel > close ? swingHigh.currentLevel : na
float amyBullInvalidation = not na(amyProtectedLow) ? amyProtectedLow : amyNearestBelow(trailing.bottom, amyRecentLow, internalLow.currentLevel, na, close)
float amyBearInvalidation = not na(amyProtectedHigh) ? amyProtectedHigh : amyNearestAbove(trailing.top, amyRecentHigh, internalHigh.currentLevel, na, close)
"""
          new = """float amyProtectedLow = not na(amyProtectedStrongLow) and amyProtectedStrongLow < close ? amyProtectedStrongLow : not na(swingLow.currentLevel) and swingLow.currentLevel < close ? swingLow.currentLevel : na
float amyProtectedHigh = not na(amyProtectedStrongHigh) and amyProtectedStrongHigh > close ? amyProtectedStrongHigh : not na(swingHigh.currentLevel) and swingHigh.currentLevel > close ? swingHigh.currentLevel : na
float amyBullInvalidation = not na(amyProtectedLow) ? amyProtectedLow : amyNearestBelow(trailing.bottom, amyRecentLow, internalLow.currentLevel, na, close)
float amyBearInvalidation = not na(amyProtectedHigh) ? amyProtectedHigh : amyNearestAbove(trailing.top, amyRecentHigh, internalHigh.currentLevel, na, close)
"""
          if old not in s:
              raise SystemExit('Invalidation block not found')
          s = s.replace(old, new, 1)

          old = """string amyNextMove = amyNextDirection == BULLISH ? 'UP' : 'DOWN'
float amyTargetRiskDistance = not na(amyInvalidation) ? math.abs(close - amyInvalidation) : 0.0
"""
          new = """string amyNextMove = amyNextDirection == BULLISH ? 'UP' : 'DOWN'
int amyTargetCoreVotes = (amySafeHTFBias == amyNextDirection ? 1 : 0) + (amyCurrentSwingBias == amyNextDirection ? 1 : 0) + (amyCurrentInternalBias == amyNextDirection ? 1 : 0) + (amyLiquidityBiasActive == amyNextDirection ? 1 : 0)
int amyTargetCoreOpposes = (amySafeHTFBias != 0 and amySafeHTFBias == -amyNextDirection ? 1 : 0) + (amyCurrentSwingBias != 0 and amyCurrentSwingBias == -amyNextDirection ? 1 : 0) + (amyCurrentInternalBias != 0 and amyCurrentInternalBias == -amyNextDirection ? 1 : 0) + (amyLiquidityBiasActive != 0 and amyLiquidityBiasActive == -amyNextDirection ? 1 : 0)
bool amyTargetHistoryOK = amyHistoryBias == 0 or amyHistoryBias == amyNextDirection
bool amyTargetEligible = amyTargetCoreVotes >= 3 and amyTargetCoreOpposes <= 1 and amyTargetHistoryOK
float amyTargetRiskDistance = not na(amyInvalidation) ? math.abs(close - amyInvalidation) : 0.0
"""
          if old not in s:
              raise SystemExit('Target eligibility insertion point not found')
          s = s.replace(old, new, 1)

          old = """float amyTarget = amyNextDirection == BULLISH ? amyNearestAbove(amyBullTargetBase, amyInternalBullTarget, na, na, amyBullTargetRef) : amyNearestBelow(amyBearTargetBase, amyInternalBearTarget, na, na, amyBearTargetRef)
string amyTargetSide = amyNextDirection == BULLISH ? 'BSL' : 'SSL'
"""
          new = """float amyTargetCandidate = amyNextDirection == BULLISH ? amyNearestAbove(amyBullTargetBase, amyInternalBullTarget, na, na, amyBullTargetRef) : amyNearestBelow(amyBearTargetBase, amyInternalBearTarget, na, na, amyBearTargetRef)
float amyTarget = amyTargetEligible ? amyTargetCandidate : na
string amyTargetSide = amyNextDirection == BULLISH ? 'BSL' : 'SSL'
"""
          if old not in s:
              raise SystemExit('Target assignment block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Protect strong levels and gate weak targets'
          git push

      - name: Calibrate confidence conservatively
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()
          old = """// Confidence measures agreement across accepted components only.
float amyConfidenceRaw = 50.0
if amySafeHTFBias != 0
    amyConfidenceRaw += amySafeHTFBias == amyNextDirection ? 8 : -8
if amyCurrentSwingBias != 0
    amyConfidenceRaw += amyCurrentSwingBias == amyNextDirection ? 10 : -10
if amyCurrentInternalBias != 0
    amyConfidenceRaw += amyCurrentInternalBias == amyNextDirection ? 6 : -6
if amyLiquidityBiasActive != 0
    amyConfidenceRaw += amyLiquidityBiasActive == amyNextDirection ? 6 : -6
if amyHistoryBias != 0
    amyConfidenceRaw += amyHistoryBias == amyNextDirection ? 5 : -5
if math.abs(amyNextRaw) < 18
    amyConfidenceRaw -= 5
int amyConfidence = int(math.round(math.max(35.0, math.min(85.0, amyConfidenceRaw))))
"""
          new = """// Confidence is deliberately conservative: the previously weak 80-85 bucket is no longer easy to reach.
int amyConfidenceAvailable = 0
int amyConfidenceAgree = 0
int amyConfidenceOppose = 0
if amySafeHTFBias != 0
    amyConfidenceAvailable += 1
    amyConfidenceAgree += amySafeHTFBias == amyNextDirection ? 1 : 0
    amyConfidenceOppose += amySafeHTFBias == -amyNextDirection ? 1 : 0
if amyCurrentSwingBias != 0
    amyConfidenceAvailable += 1
    amyConfidenceAgree += amyCurrentSwingBias == amyNextDirection ? 1 : 0
    amyConfidenceOppose += amyCurrentSwingBias == -amyNextDirection ? 1 : 0
if amyCurrentInternalBias != 0
    amyConfidenceAvailable += 1
    amyConfidenceAgree += amyCurrentInternalBias == amyNextDirection ? 1 : 0
    amyConfidenceOppose += amyCurrentInternalBias == -amyNextDirection ? 1 : 0
if amyLiquidityBiasActive != 0
    amyConfidenceAvailable += 1
    amyConfidenceAgree += amyLiquidityBiasActive == amyNextDirection ? 1 : 0
    amyConfidenceOppose += amyLiquidityBiasActive == -amyNextDirection ? 1 : 0
float amyConfidenceRaw = 45.0 + amyConfidenceAgree * 8.0 - amyConfidenceOppose * 10.0
if amyHistoryBias != 0
    amyConfidenceRaw += amyHistoryBias == amyNextDirection ? 5.0 : -6.0
if math.abs(amyNextRaw) < 18
    amyConfidenceRaw -= 5.0
if na(amyTarget)
    amyConfidenceRaw -= 4.0
bool amyConfidenceUnanimous = amyConfidenceAvailable >= 4 and amyConfidenceAgree == amyConfidenceAvailable and amyConfidenceOppose == 0 and (amyHistoryBias == 0 or amyHistoryBias == amyNextDirection) and not na(amyTarget)
float amyConfidenceCap = amyConfidenceUnanimous ? 82.0 : 79.0
int amyConfidence = int(math.round(math.max(35.0, math.min(amyConfidenceCap, amyConfidenceRaw))))
"""
          if old not in s:
              raise SystemExit('Confidence block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Calibrate weak confidence bucket conservatively'
          git push

      - name: Qualify higher Fibonacci extensions without touching TP1
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()
          old = """var int amyxLockedStartBar = na
var int amyxLockedEndBar = na

float amyxImpulseAtr = ta.atr(14)
"""
          new = """var int amyxLockedStartBar = na
var int amyxLockedEndBar = na
var bool amyxExtendedEligible = false

float amyxImpulseAtr = ta.atr(14)
"""
          if old not in s:
              raise SystemExit('Extended eligibility var marker not found')
          s = s.replace(old, new, 1)

          old = """    amyxLockedStartBar := swingLow.barIndex
    amyxLockedEndBar := bar_index
else if amyxBearStructureEvent and not na(swingHigh.currentLevel)
"""
          new = """    amyxLockedStartBar := swingLow.barIndex
    amyxLockedEndBar := bar_index
    amyxExtendedEligible := amyxImpulseDisplacement and amyxImpulseBody >= amyxImpulseAtr * 0.60 and amyxImpulseBodyRatio >= 0.60 and amyCurrentInternalBias == BULLISH and (amySafeHTFBias == 0 or amySafeHTFBias == BULLISH)
else if amyxBearStructureEvent and not na(swingHigh.currentLevel)
"""
          if old not in s:
              raise SystemExit('Bull extension lock marker not found')
          s = s.replace(old, new, 1)

          old = """    amyxLockedStartBar := swingHigh.barIndex
    amyxLockedEndBar := bar_index

bool amyxLockedInvalid ="""
          new = """    amyxLockedStartBar := swingHigh.barIndex
    amyxLockedEndBar := bar_index
    amyxExtendedEligible := amyxImpulseDisplacement and amyxImpulseBody >= amyxImpulseAtr * 0.60 and amyxImpulseBodyRatio >= 0.60 and amyCurrentInternalBias == BEARISH and (amySafeHTFBias == 0 or amySafeHTFBias == BEARISH)

bool amyxLockedInvalid ="""
          if old not in s:
              raise SystemExit('Bear extension lock marker not found')
          s = s.replace(old, new, 1)

          old = """    amyxLockedStartBar := na
    amyxLockedEndBar := na

float amyxSwingTop ="""
          new = """    amyxLockedStartBar := na
    amyxLockedEndBar := na
    amyxExtendedEligible := false

float amyxSwingTop ="""
          if old not in s:
              raise SystemExit('Extension invalidation reset marker not found')
          s = s.replace(old, new, 1)

          s = s.replace("amyxFibLine2 := line.new(amyxFibLeft, amyxFib1618, amyxFibRight, amyxFib1618, xloc = xloc.bar_index, color = color.new(amyxLegColor, 15), style = line.style_dashed)", "amyxFibLine2 := line.new(amyxFibLeft, amyxFib1618, amyxFibRight, amyxFib1618, xloc = xloc.bar_index, color = color.new(amyxExtendedEligible ? amyxLegColor : GRAY, 15), style = line.style_dashed)", 1)
          s = s.replace("amyxFibLine3 := line.new(amyxFibLeft, amyxFibMax, amyxFibRight, amyxFibMax, xloc = xloc.bar_index, color = amyxLegColor, style = line.style_solid)", "amyxFibLine3 := line.new(amyxFibLeft, amyxFibMax, amyxFibRight, amyxFibMax, xloc = xloc.bar_index, color = amyxExtendedEligible ? amyxLegColor : GRAY, style = line.style_solid)", 1)
          s = s.replace("line.set_color(amyxFibLine2, color.new(amyxLegColor, 15))", "line.set_color(amyxFibLine2, color.new(amyxExtendedEligible ? amyxLegColor : GRAY, 15))", 1)
          s = s.replace("line.set_color(amyxFibLine3, amyxLegColor)", "line.set_color(amyxFibLine3, amyxExtendedEligible ? amyxLegColor : GRAY)", 1)
          s = s.replace("label.set_textcolor(amyxFibLabel2, amyxLegColor)", "label.set_textcolor(amyxFibLabel2, amyxExtendedEligible ? amyxLegColor : GRAY)", 1)
          s = s.replace("label.set_textcolor(amyxFibLabel3, amyxLegColor)", "label.set_textcolor(amyxFibLabel3, amyxExtendedEligible ? amyxLegColor : GRAY)", 1)
          s = s.replace("label.set_text(amyxFibLabel2, 'TP2 1.618  ' + amyPrice(amyxFib1618))", "label.set_text(amyxFibLabel2, (amyxExtendedEligible ? 'TP2 1.618  ' : 'TP2 1.618 • LOW CONF  ') + amyPrice(amyxFib1618))", 1)
          s = s.replace("label.set_text(amyxFibLabel3, 'MAX ' + amyxFibMaxInput + '  ' + amyPrice(amyxFibMax))", "label.set_text(amyxFibLabel3, (amyxExtendedEligible ? 'MAX ' : 'MAX • LOW CONF ') + amyxFibMaxInput + '  ' + amyPrice(amyxFibMax))", 1)
          p.write_text(s)
          PY
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Qualify weak higher Fib extensions without changing TP1'
          git push

      - name: Mark weak FVG and OB context without changing LuxAlgo core
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()
          old = """            string gapName = gap.bias == BULLISH ? 'Bullish FVG' : 'Bearish FVG'
            string gapText = gapName + '\\n' + amyPrice(gap.top) + ' — ' + amyPrice(gap.bottom)
            color gapTextColor = gap.bias == BULLISH ? GREEN : RED
"""
          new = """            string gapName = gap.bias == BULLISH ? 'Bullish FVG' : 'Bearish FVG'
            bool gapContextAligned = gap.bias == swingTrend.bias and internalTrend.bias != -gap.bias and (na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == gap.bias)
            string gapText = gapName + (gapContextAligned ? ' • ALIGNED' : ' • CONTEXT WEAK') + '\\n' + amyPrice(gap.top) + ' — ' + amyPrice(gap.bottom)
            color gapTextColor = gapContextAligned ? (gap.bias == BULLISH ? GREEN : RED) : GRAY
"""
          if old not in s:
              raise SystemExit('FVG display block not found')
          s = s.replace(old, new, 1)

          old = """            string obName = currentOB.bias == BULLISH ? 'Bullish Internal OB' : 'Bearish Internal OB'
            string obText = obName + '\\n' + amyPrice(currentOB.barHigh) + ' — ' + amyPrice(currentOB.barLow)
            color obTextColor = currentOB.bias == BULLISH ? GREEN : RED
"""
          new = """            string obName = currentOB.bias == BULLISH ? 'Bullish Internal OB' : 'Bearish Internal OB'
            bool obContextAligned = currentOB.bias == swingTrend.bias and internalTrend.bias != -currentOB.bias and (na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == currentOB.bias)
            string obText = obName + (obContextAligned ? ' • ALIGNED' : ' • CONTEXT WEAK') + '\\n' + amyPrice(currentOB.barHigh) + ' — ' + amyPrice(currentOB.barLow)
            color obTextColor = obContextAligned ? (currentOB.bias == BULLISH ? GREEN : RED) : GRAY
"""
          if old not in s:
              raise SystemExit('Internal OB display block not found')
          s = s.replace(old, new, 1)

          old = """            string obName = currentOB.bias == BULLISH ? 'Bullish Swing OB' : 'Bearish Swing OB'
            string obText = obName + '\\n' + amyPrice(currentOB.barHigh) + ' — ' + amyPrice(currentOB.barLow)
            color obTextColor = currentOB.bias == BULLISH ? GREEN : RED
"""
          new = """            string obName = currentOB.bias == BULLISH ? 'Bullish Swing OB' : 'Bearish Swing OB'
            bool obContextAligned = currentOB.bias == swingTrend.bias and internalTrend.bias != -currentOB.bias and (na(amyHTFSwing) or amyHTFSwing == 0 or amyHTFSwing == currentOB.bias)
            string obText = obName + (obContextAligned ? ' • ALIGNED' : ' • CONTEXT WEAK') + '\\n' + amyPrice(currentOB.barHigh) + ' — ' + amyPrice(currentOB.barLow)
            color obTextColor = obContextAligned ? (currentOB.bias == BULLISH ? GREEN : RED) : GRAY
"""
          if old not in s:
              raise SystemExit('Swing OB display block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Mark weak FVG and OB context without touching core'
