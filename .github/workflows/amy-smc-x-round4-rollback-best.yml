name: Amy SMC X Round 4 Best-Of Rollback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/amy-smc-x-round4-rollback-best.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Revert failed Round 4 changes and retain winners
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 0672d691168bd8cf30bf86404b0aa60e843d62d2
          python .github/scripts/amy_smc_x_round4_bestof.py
          git add Amy-SMC-X.pine
          git diff --cached --check
          test "$(git diff --cached --name-only | tr -d '\r')" = "Amy-SMC-X.pine"
          git commit -m 'Retain only improved Amy SMC X Round 4 profiles'
          git push
