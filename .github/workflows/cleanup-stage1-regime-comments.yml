name: Align Stage1 Redesign Annotations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Amy-SMC-A-Liquidity-Fixed-M5-Regime-Redesign.pine')
          s=p.read_text(encoding='utf-8')
          old="bool amyRound10EntryAPlusQualified = amyRound9EntryConfirmed and not na(amyRound10EntryBodyAtr) and amyRound10EntryBodyAtr >= 0.50 and amyRound10EntryBodyAtr < 2.50 and amyEventBodyRatio >= 0.30 and amyRound9EntryRiskAtr < 8.0"
          new="// Legacy A+ subset was tuned on the pre-redesign transition regime and is intentionally disabled here until separately revalidated.\nbool amyRound10EntryAPlusQualified = false"
          if s.count(old)!=1: raise SystemExit(f'A+ block count={s.count(old)}')
          s=s.replace(old,new)
          oldc="// Walk-forward promotion status. M5 is provisional because most annual OOS windows have <30 signals."
          newc="// Walk-forward promotion status. The redesigned M5 regime has 15/15 high-confidence OOS windows, but remains experimental/provisional because execution expectancy is positive in only 10/15 windows and 2026 is approximately flat."
          if s.count(oldc)!=1: raise SystemExit(f'provisional comment count={s.count(oldc)}')
          s=s.replace(oldc,newc)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git add Amy-SMC-A-Liquidity-Fixed-M5-Regime-Redesign.pine
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: align M5 redesign status with WFO'
          git push
