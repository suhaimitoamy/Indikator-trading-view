name: Repair K1 timeout one-shot transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-one-shot-k1-timeout.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make folded Base64 whitespace-tolerant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/one-shot-k1-timeout-autopsy.yml')
          s = p.read_text(encoding='utf-8')
          old = "printf '%s' \"$PAYLOAD_B64\" | base64 -d >> Amy-SMC-D-LAB.pine"
          new = "printf '%s' \"$PAYLOAD_B64\" | base64 -di >> Amy-SMC-D-LAB.pine"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-one-shot-k1-timeout.yml
          git add .github/workflows/one-shot-k1-timeout-autopsy.yml
          git diff --cached --check
          git commit -m "fix: tolerate folded whitespace in K1 payload"
          git push
