name: Finalize Amy SMC C LAB H1 dealing range indentation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-amy-smc-c-lab-h1-dr-indent.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize only Dealing Range calculation block
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('Amy-SMC-C-LAB.pine')
          text = p.read_text(encoding='utf-8')
          start_marker = "string amyDealingRange = 'EQUILIBRIUM'\nint amyDealingBias = 0\n"
          end_marker = "\nint amyLiquidityAge ="
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Dealing Range boundary markers are not unique')
          i = text.index(start_marker)
          j = text.index(end_marker, i)
          current = text[i:j]
          for marker in [
              'if amyRound5H1',
              'if amyCH1DRValid',
              'if close >= amyCH1PremiumGate',
              'if amyCDealingPureTF',
              'if close >= amyCDealingPremiumGate',
              'amyDRBearContext',
              'amyDRBullContext',
          ]:
              if marker not in current:
                  raise SystemExit(f'current block guard missing: {marker}')

          new_calc = textwrap.dedent("""
              string amyDealingRange = 'EQUILIBRIUM'
              int amyDealingBias = 0
              if amyRound5H1
                  // C H1: pure-location descriptive state from previous 240 closed H1 bars.
                  // PREMIUM = bearish, DISCOUNT = bullish; 45%-55% remains equilibrium/neutral.
                  if amyCH1DRValid
                      if close >= amyCH1PremiumGate
                          amyDealingRange := 'PREMIUM'
                          amyDealingBias := BEARISH
                      else if close <= amyCH1DiscountGate
                          amyDealingRange := 'DISCOUNT'
                          amyDealingBias := BULLISH
              else if amyDRValid
                  if amyCDealingPureTF
                      // C M5/M15: the field itself is the validated pure-location signal.
                      // PREMIUM = bearish, DISCOUNT = bullish; middle band remains equilibrium/neutral.
                      if close >= amyCDealingPremiumGate
                          amyDealingRange := 'PREMIUM'
                          amyDealingBias := BEARISH
                      else if close <= amyCDealingDiscountGate
                          amyDealingRange := 'DISCOUNT'
                          amyDealingBias := BULLISH
                  else
                      // Other timeframes retain the frozen B/Z behavior exactly.
                      if close > amyEQUpper
                          amyDealingRange := 'PREMIUM'
                          amyDealingBias := close >= amyPremiumGate and amyDRBearContext ? BEARISH : 0
                      else if close < amyEQLower
                          amyDealingRange := 'DISCOUNT'
                          amyDealingBias := close <= amyDiscountGate and amyDRBullContext ? BULLISH : 0
          """).strip('\n')
          text = text[:i] + new_calc + text[j:]

          # Verify exact H1 and frozen M5/M15 markers after normalization.
          required = [
              "float amyCH1RangeTop = amyRound5H1 ? ta.highest(high[1], 240) : na",
              "float amyCH1RangeBottom = amyRound5H1 ? ta.lowest(low[1], 240) : na",
              "float amyCH1PremiumGate = amyCH1DRValid ? amyCH1RangeBottom + amyCH1RangeSpan * 0.55 : na",
              "float amyCH1DiscountGate = amyCH1DRValid ? amyCH1RangeBottom + amyCH1RangeSpan * 0.45 : na",
              "float amyCDealingPremiumRatio = amyRound5M5 ? 0.70 : amyRound5M15 ? 0.60 : amyPassedDRPremiumRatio",
              "float amyCDealingDiscountRatio = amyRound5M5 ? 0.30 : amyRound5M15 ? 0.40 : amyPassedDRDiscountRatio",
          ]
          for marker in required:
              if text.count(marker) != 1:
                  raise SystemExit(f'guard failed: {marker!r}')
          p.write_text(text, encoding='utf-8')
          print('NORMALIZE_OK')
          PY
          git diff --check -- Amy-SMC-C-LAB.pine
          sed -n '1235,1285p' Amy-SMC-C-LAB.pine
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-amy-smc-c-lab-h1-dr-indent.yml
          git add Amy-SMC-C-LAB.pine
          git diff --cached --check
          git commit -m "Normalize Amy SMC C LAB H1 dealing range block"
          git push origin HEAD:main
