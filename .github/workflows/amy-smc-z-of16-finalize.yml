name: Amy SMC Z OF16 Finalize

on:
  push:
    branches:
      - experiment/amy-smc-z-of16
    paths:
      - '.github/workflows/amy-smc-z-of16-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply OF16 final full-sample fit
        run: |
          python .github/scripts/amy_smc_z_of16_finalize.py
          git diff --check -- Amy-SMC-Z-OF16.pine
          git diff --quiet -- Amy-SMC-Z.pine Amy-SMC-Y.pine Amy-SMC-X.pine Amy-SMC.pine
          grep -q "amyCurrentInternalBias \* 100.0" Amy-SMC-Z-OF16.pine
          grep -q "amyTargetOutsidePad = syminfo.mintick" Amy-SMC-Z-OF16.pine
          grep -q "amyTargetQualityOK = false" Amy-SMC-Z-OF16.pine
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-Z-OF16.pine
          git commit -m "Finalize Amy SMC Z OF16 full-sample overfit"
          git push
