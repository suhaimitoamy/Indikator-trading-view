name: Append K1 hybrid stop phase3 payload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-k1-hybrid-stop-phase3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable source and append comments only
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA="d6e6d7c979dd5a852bddd9661bef0480caa2eb35"
          LAB_SHA="61f73f33b2a42519f417bdddc0c0141da824a875"
          PAYLOAD=".tmp/k1-hybrid-stop-phase3-payload.txt"
          MARKER="AMY SMC D-LAB — K1 ENTRY CONSTRUCTION PHASE 3 — HYBRID FALLBACK + BREAKOUT STOP (2026-08-12)"

          test "$(git hash-object Amy-SMC-D.pine)" = "$BASELINE_SHA"
          test "$(git hash-object Amy-SMC-D-LAB.pine)" = "$LAB_SHA"
          test -f "$PAYLOAD"
          ! grep -Fq "$MARKER" Amy-SMC-D-LAB.pine
          grep -Fq "AMY SMC D-LAB — K1 HUMAN ENTRY CONSTRUCTION — CAUSAL ACCEPTANCE/REJECTION + LOCAL SL (2026-08-12)" Amy-SMC-D-LAB.pine
          grep -Fq "K1 — Qualified Valid Break + Internal Structure" Amy-SMC-D-LAB.pine

          python - <<'PY'
          from pathlib import Path
          lab = Path('Amy-SMC-D-LAB.pine')
          payload = Path('.tmp/k1-hybrid-stop-phase3-payload.txt').read_text(encoding='utf-8')
          marker = 'AMY SMC D-LAB — K1 ENTRY CONSTRUCTION PHASE 3 — HYBRID FALLBACK + BREAKOUT STOP (2026-08-12)'
          if marker not in payload:
              raise SystemExit('payload marker missing')
          for n, line in enumerate(payload.splitlines(), 1):
              if line.strip() and not line.lstrip().startswith('//'):
                  raise SystemExit(f'non-comment payload line {n}: {line!r}')
          original = lab.read_text(encoding='utf-8')
          if marker in original:
              raise SystemExit('duplicate phase3 marker')
          lab.write_text(original.rstrip() + '\n' + payload.rstrip() + '\n', encoding='utf-8')
          reread = lab.read_text(encoding='utf-8')
          if not reread.startswith(original.rstrip() + '\n'):
              raise SystemExit('existing LAB prefix changed')
          if reread.count(marker) != 1:
              raise SystemExit('phase3 marker count is not one')
          PY

          test "$(git hash-object Amy-SMC-D.pine)" = "$BASELINE_SHA"
          git diff --exit-code -- Amy-SMC-D.pine
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "Amy-SMC-D-LAB.pine"

      - name: Commit LAB documentation payload only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-D-LAB.pine
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "Amy-SMC-D-LAB.pine"
          git commit -m "docs: add K1 hybrid fallback and breakout stop experiment"
          git push origin HEAD:main
