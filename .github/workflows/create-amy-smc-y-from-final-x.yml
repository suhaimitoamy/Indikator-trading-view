name: Create Amy SMC Y from Final X

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/create-amy-smc-y-from-final-x.yml'

permissions:
  contents: write

jobs:
  create-y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Create Amy SMC Y from finalized X
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/create_amy_smc_y_from_final_x.py
          git add Amy-SMC-X.pine Amy-SMC-Y.pine
          # Amy SMC Y intentionally inherits the exact Pine formatting from X, including legacy whitespace.
          # Only check the small X baseline-note edit for newly introduced whitespace problems.
          git diff --cached --check -- Amy-SMC-X.pine
          changed="$(git diff --cached --name-only | tr -d '\r')"
          printf '%s\n' "$changed"
          test "$changed" = $'Amy-SMC-X.pine\nAmy-SMC-Y.pine'
          git commit -m 'Create Amy SMC Y from finalized X baseline'
          git push
