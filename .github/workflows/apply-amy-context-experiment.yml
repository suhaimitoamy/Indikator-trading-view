name: Apply AMY Context Experiment

on:
  push:
    branches:
      - backtest/amy-market-context-v4
    paths:
      - .github/workflows/apply-amy-context-experiment.yml
      - .github/scripts/patch_amy_market_context_experiment.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: backtest/amy-market-context-v4

      - name: Apply guarded Pine patch
        run: python .github/scripts/patch_amy_market_context_experiment.py

      - name: Commit experiment and remove temporary automation
        run: |
          rm .github/workflows/apply-amy-context-experiment.yml
          rm .github/scripts/patch_amy_market_context_experiment.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMY_Market_Context_V4.pine .github
          git commit -m "Experiment: harden FVG OB and DOL honesty filters"
          git push origin HEAD:backtest/amy-market-context-v4
