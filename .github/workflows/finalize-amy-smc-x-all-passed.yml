name: Finalize Amy SMC X All Passed

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-amy-smc-x-all-passed.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Consolidate all passed Amy SMC X profiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/finalize_amy_smc_x_all_passed.py
          git add Amy-SMC-X.pine
          git diff --cached --check
          test "$(git diff --cached --name-only | tr -d '\r')" = "Amy-SMC-X.pine"
          git commit -m 'Consolidate all passed Amy SMC X profiles'
          git push
