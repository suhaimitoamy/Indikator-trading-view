name: Add Pullback to Amy SMC D

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-add-pullback-to-amy-smc-d.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply isolated Pullback feature to Amy SMC D
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          PATH = Path('Amy-SMC-D.pine')
          EXPECTED_BLOB = 'd6e6d7c979dd5a852bddd9661bef0480caa2eb35'

          actual_blob = subprocess.check_output(['git', 'hash-object', str(PATH)], text=True).strip()
          if actual_blob != EXPECTED_BLOB:
              raise SystemExit(f'Baseline mismatch: expected {EXPECTED_BLOB}, got {actual_blob}')

          text = PATH.read_text(encoding='utf-8')
          original = text

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one marker, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "bool amyHasExecutionSignal = amyNextDirection != 0\n"
              "string amyNextMove = amyNextDirection == BULLISH ? 'UP' : amyNextDirection == BEARISH ? 'DOWN' : 'WAIT'\n"
              "// Select invalidation from the actual execution direction. WAIT has no synthetic invalidation/target.\n",
              "bool amyHasExecutionSignal = amyNextDirection != 0\n"
              "string amyNextMove = amyNextDirection == BULLISH ? 'UP' : amyNextDirection == BEARISH ? 'DOWN' : 'WAIT'\n"
              "// Pullback mirrors the already-gated Next Move state; it adds no independent predictor or classifier.\n"
              "int amyPullbackDirection = amyNextDirection == BULLISH ? BEARISH : amyNextDirection == BEARISH ? BULLISH : 0\n"
              "string amyPullback = amyPullbackDirection == BULLISH ? 'UP' : amyPullbackDirection == BEARISH ? 'DOWN' : 'WAIT'\n"
              "// Select invalidation from the actual execution direction. WAIT has no synthetic invalidation/target.\n",
              'Pullback logic',
          )

          replace_once(
              "var table amyDashboard = table.new(position.bottom_right, 2, 16, bgcolor = color.new(color.black, 12), border_color = color.new(GRAY, 65), border_width = 1)",
              "var table amyDashboard = table.new(position.bottom_right, 2, 17, bgcolor = color.new(color.black, 12), border_color = color.new(GRAY, 65), border_width = 1)",
              'dashboard row count',
          )

          replace_once(
              "    table.merge_cells(amyDashboard, 0, 12, 1, 12)",
              "    table.merge_cells(amyDashboard, 0, 13, 1, 13)",
              'event history merge row',
          )

          replace_once(
              "        color amyNextColor = amyNextDirection == BULLISH ? amyBullColor : amyNextDirection == BEARISH ? amyBearColor : GRAY\n"
              "        string amyHeader = 'MARKET BIAS — ' + amyTfName(timeframe.period)\n",
              "        color amyNextColor = amyNextDirection == BULLISH ? amyBullColor : amyNextDirection == BEARISH ? amyBearColor : GRAY\n"
              "        color amyPullbackColor = amyPullbackDirection == BULLISH ? amyBullColor : amyPullbackDirection == BEARISH ? amyBearColor : GRAY\n"
              "        string amyHeader = 'MARKET BIAS — ' + amyTfName(timeframe.period)\n",
              'Pullback color',
          )

          replace_once(
              "        table.cell(amyDashboard, 0, 8, 'Next Move', text_color = color.white, bgcolor = color.new(amyNextColor, 82), text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 8, amyNextMove, text_color = amyNextColor, bgcolor = color.new(amyNextColor, 82), text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 9, 'Target', text_color = color.silver, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 9, amyHasExecutionSignal ? amyTargetSide + ' ' + amyPrice(amyTarget) : '-', text_color = color.white, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 10, 'Regime', text_color = color.silver, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 10, amyRound10Regime, text_color = amyRound9M5TradeRegime ? amyNextColor : (amyRound9M5SweepWatch or amyRound9M5TransitionWatch) ? color.orange : color.silver, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 11, 'Confidence', text_color = color.silver, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 11, amyHasExecutionSignal ? str.tostring(amyConfidence) + '%' : '-', text_color = amyNextColor, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 12, 'EVENT HISTORY', bgcolor = color.new(GRAY, 82), text_color = color.white, text_size = size.tiny)\n",
              "        table.cell(amyDashboard, 0, 8, 'Next Move', text_color = color.white, bgcolor = color.new(amyNextColor, 82), text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 8, amyNextMove, text_color = amyNextColor, bgcolor = color.new(amyNextColor, 82), text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 9, 'Pullback', text_color = color.white, bgcolor = color.new(amyPullbackColor, 82), text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 9, amyPullback, text_color = amyPullbackColor, bgcolor = color.new(amyPullbackColor, 82), text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 10, 'Target', text_color = color.silver, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 10, amyHasExecutionSignal ? amyTargetSide + ' ' + amyPrice(amyTarget) : '-', text_color = color.white, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 11, 'Regime', text_color = color.silver, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 11, amyRound10Regime, text_color = amyRound9M5TradeRegime ? amyNextColor : (amyRound9M5SweepWatch or amyRound9M5TransitionWatch) ? color.orange : color.silver, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 12, 'Confidence', text_color = color.silver, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 1, 12, amyHasExecutionSignal ? str.tostring(amyConfidence) + '%' : '-', text_color = amyNextColor, text_size = size.tiny)\n"
              "        table.cell(amyDashboard, 0, 13, 'EVENT HISTORY', bgcolor = color.new(GRAY, 82), text_color = color.white, text_size = size.tiny)\n",
              'dashboard Pullback row and shifts',
          )

          replace_once(
              "            int historyRow = 13 + historyIndex",
              "            int historyRow = 14 + historyIndex",
              'history row offset',
          )

          replace_once(
              "        for dashboardRow = 0 to 15",
              "        for dashboardRow = 0 to 16",
              'dashboard clear range',
          )

          PATH.write_text(text, encoding='utf-8')
          subprocess.check_call(['git', 'diff', '--check', '--', str(PATH)])

          diff = subprocess.check_output(['git', 'diff', '--unified=1', '--', str(PATH)], text=True)
          if 'Pullback' not in diff:
              raise SystemExit('Pullback diff missing')
          if text == original:
              raise SystemExit('No changes applied')
          print(diff)
          PY

      - name: Commit Pullback feature and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-add-pullback-to-amy-smc-d.yml
          git add Amy-SMC-D.pine
          git commit -m "feat: add Pullback to Amy SMC D dashboard"
          git push origin HEAD:main
