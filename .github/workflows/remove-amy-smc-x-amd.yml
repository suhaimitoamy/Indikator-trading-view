name: Remove AMD from Amy SMC X

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-amy-smc-x-amd.yml'

permissions:
  contents: write

jobs:
  remove-amd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove AMD module only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          s = s.replace('// OTE / AMD / Fibonacci Extension', '// OTE / Fibonacci Extension')
          s = s.replace("AMYX_AMD_GROUP = 'Amy AMD'\n", '')

          amd_inputs = """amyxShowAMD       = input.bool(true, 'Show AMD', group = AMYX_AMD_GROUP)\namyxAMDLength     = input.int(12, 'Accumulation Bars', minval = 5, maxval = 50, group = AMYX_AMD_GROUP)\namyxAMDRangeATR   = input.float(1.75, 'Max Range × ATR', minval = 1.0, maxval = 8.0, step = 0.25, group = AMYX_AMD_GROUP)\namyxAMDExpiry     = input.int(36, 'Cycle Expiry Bars', minval = 10, maxval = 150, group = AMYX_AMD_GROUP)\n\n"""
          if amd_inputs not in s:
              raise SystemExit('AMD inputs block not found')
          s = s.replace(amd_inputs, '', 1)

          start_marker = "//---------------------------------------------------------------------------------------------------------------------}\n// AMD — Accumulation / Manipulation / Distribution\n//---------------------------------------------------------------------------------------------------------------------{\n"
          end_marker = "//---------------------------------------------------------------------------------------------------------------------}\n// FIBONACCI EXTENSION — TP1 / TP2 / MAX\n//---------------------------------------------------------------------------------------------------------------------{\n"
          start = s.find(start_marker)
          end = s.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('AMD module markers not found')
          s = s[:start] + end_marker + s[end + len(end_marker):]

          s = s.replace("alertcondition(amyxAMDManipEvent, 'AMD Manipulation', 'AMD manipulation detected')\n", '')
          s = s.replace("alertcondition(amyxAMDDistEvent, 'AMD Distribution', 'AMD distribution detected')\n", '')

          forbidden = ['amyxAMD', 'AMYX_AMD_GROUP']
          leftovers = [x for x in forbidden if x in s]
          if leftovers:
              raise SystemExit('AMD leftovers remain: ' + ', '.join(leftovers))

          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-X.pine
          git commit -m 'Remove AMD from Amy SMC X'
          git push origin main
