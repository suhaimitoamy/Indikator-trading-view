name: Apply AMY visual tune

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-amy-visual-tune.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply visual patch
        run: python .github/scripts/patch_amy_visual_tune.py

      - name: Remove temporary patch files
        run: |
          rm .github/scripts/patch_amy_visual_tune.py
          rm .github/workflows/apply-amy-visual-tune.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMY_Market_Context_Final.pine .github/scripts/patch_amy_visual_tune.py .github/workflows/apply-amy-visual-tune.yml
          git commit -m "Tune AMY box opacity and dashboard position"
          git push
