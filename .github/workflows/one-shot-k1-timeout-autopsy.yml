name: One-shot K1 Timeout Autopsy Phase 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-k1-timeout-autopsy.yml'

permissions:
  contents: write

jobs:
  append-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified diagnostic comments
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet f06ff44d014c5cf42766ba760b64f68be5443d5b HEAD -- Amy-SMC-D-LAB.pine
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lab = Path('Amy-SMC-D-LAB.pine')
          tmp = Path('reports/.tmp-k1-timeout-phase2.txt')
          old = subprocess.check_output(['git','show','f06ff44d014c5cf42766ba760b64f68be5443d5b:Amy-SMC-D-LAB.pine'], text=True)
          current = lab.read_text(encoding='utf-8')
          assert current == old, 'LAB differs from Phase-1 head before append.'
          payload = tmp.read_text(encoding='utf-8')
          assert 'K1 M15 TIMEOUT AUTOPSY PHASE 2' in payload
          for line in payload.splitlines():
              assert (not line.strip()) or line.lstrip().startswith('//'), f'Non-comment payload line: {line!r}'
          lab.write_text(current + payload, encoding='utf-8')
          new = lab.read_text(encoding='utf-8')
          assert new.startswith(old)
          assert new[len(old):] == payload
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm reports/.tmp-k1-timeout-phase2.txt
          git add Amy-SMC-D-LAB.pine
          git diff --cached --check
          git commit -m "docs: add K1 M15 timeout autopsy phase 2"
          git push
