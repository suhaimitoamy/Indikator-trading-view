name: Refine Amy SMC X Unpassed Components

on:
  push:
    branches:
      - main
    paths:
      - 'tools/refine_amy_smc_x_unpassed.py'
      - '.github/workflows/refine-amy-smc-x-unpassed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python tools/refine_amy_smc_x_unpassed.py
      - name: Commit indicator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-X.pine
          git diff --cached --check
          git commit -m 'Refine Amy SMC X unpassed components'
          git push
