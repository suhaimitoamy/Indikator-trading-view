name: One-time liquidity direction threshold 99

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-liquidity-threshold-99.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set high-selectivity direction threshold
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('AMY_ICT_NextGen.pine')
          text = path.read_text(encoding='utf-8')
          old = 'liquidityDirectionThreshold = input.int(90, "BSL / SSL Direction Threshold", minval=50, maxval=99, group=grpCtx)'
          new = 'liquidityDirectionThreshold = input.int(99, "BSL / SSL Direction Threshold", minval=50, maxval=99, group=grpCtx)'
          if old not in text:
              raise SystemExit('Threshold marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-time-liquidity-threshold-99.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMY_ICT_NextGen.pine .github/workflows/one-time-liquidity-threshold-99.yml
          git commit -m "Use 99 percent threshold for high precision liquidity direction"
          git push origin HEAD:main
