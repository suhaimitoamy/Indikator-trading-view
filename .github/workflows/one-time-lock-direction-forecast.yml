name: Lock direction forecast for full horizon

on:
  push:
    branches:
      - feature/market-state-direction-forecast-20260714
    paths:
      - .github/workflows/one-time-lock-direction-forecast.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-state-direction-forecast-20260714

      - name: Align live forecast with episode backtest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AMY_ICT_NextGen.pine")
          text = path.read_text(encoding="utf-8")

          old_comment = '''// Uses only completed M15 and H4 candles. NO CLEAR DIRECTION is intentional.'''
          new_comment = '''// Uses only completed M15 and H4 candles. NO CLEAR DIRECTION is intentional.
          // Once issued, a forecast is locked for the full 48-hour evaluation horizon.'''
          if text.count(old_comment) != 1:
              raise SystemExit(f"Expected one forecast comment, found {text.count(old_comment)}")
          text = text.replace(old_comment, new_comment, 1)

          old = '''bullishDirectionForecast = showDirectionForecast and forecastDataReady and directionScore >= 5.0 and forecastVolRegime <= 0.25
          bearishDirectionForecast = showDirectionForecast and forecastDataReady and directionScore <= -6.0 and forecastHtfGap >= -0.50 and forecastRangePosition >= -0.40
          directionForecastDir = bullishDirectionForecast ? 1 : bearishDirectionForecast ? -1 : 0
          directionForecast = directionForecastDir == 1 ? "BULLISH" : directionForecastDir == -1 ? "BEARISH" : "NO CLEAR DIRECTION"
          directionForecastProbability = directionForecastDir == 0 ? 50 : 56
          directionForecastText = directionForecastDir == 0 ? directionForecast : directionForecast + " · " + str.tostring(directionForecastProbability) + "% EST."
          directionForecastColor = directionForecastDir == 1 ? color.lime : directionForecastDir == -1 ? color.red : color.yellow'''

          new = '''rawBullishDirectionForecast = showDirectionForecast and forecastDataReady and directionScore >= 5.0 and forecastVolRegime <= 0.25
          rawBearishDirectionForecast = showDirectionForecast and forecastDataReady and directionScore <= -6.0 and forecastHtfGap >= -0.50 and forecastRangePosition >= -0.40
          forecastHorizonMs = 48 * 60 * 60 * 1000

          var int directionForecastDir = 0
          var int directionForecastStartedAt = na
          var int directionForecastExpiresAt = na

          forecastWindowExpired = directionForecastDir != 0 and not na(directionForecastExpiresAt) and time_close >= directionForecastExpiresAt
          forecastCanStart = directionForecastDir == 0 or forecastWindowExpired

          if barstate.isconfirmed and forecastCanStart
              if rawBullishDirectionForecast or rawBearishDirectionForecast
                  directionForecastDir := rawBullishDirectionForecast ? 1 : -1
                  directionForecastStartedAt := time_close
                  directionForecastExpiresAt := time_close + forecastHorizonMs
              else
                  directionForecastDir := 0
                  directionForecastStartedAt := na
                  directionForecastExpiresAt := na

          if not showDirectionForecast
              directionForecastDir := 0
              directionForecastStartedAt := na
              directionForecastExpiresAt := na

          directionForecast = directionForecastDir == 1 ? "BULLISH" : directionForecastDir == -1 ? "BEARISH" : "NO CLEAR DIRECTION"
          directionForecastProbability = directionForecastDir == 0 ? 50 : 56
          directionForecastRemainingHours = directionForecastDir != 0 and not na(directionForecastExpiresAt) ? int(math.max(0, math.ceil((directionForecastExpiresAt - time_close) / 3600000.0))) : 0
          directionForecastText = directionForecastDir == 0 ? directionForecast : directionForecast + " · " + str.tostring(directionForecastProbability) + "% EST."
          directionForecastHorizonText = directionForecastDir == 0 ? "48 HOURS · WAITING" : str.tostring(directionForecastRemainingHours) + "H LEFT · M15 MODEL"
          directionForecastColor = directionForecastDir == 1 ? color.lime : directionForecastDir == -1 ? color.red : color.yellow'''

          if text.count(old) != 1:
              raise SystemExit(f"Expected one unlocked forecast block, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old_horizon = '''table.cell(dashboard, 1, 7, "48 HOURS · M15 MODEL", text_color=color.white, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashBg)'''
          new_horizon = '''table.cell(dashboard, 1, 7, directionForecastHorizonText, text_color=color.white, text_size=size.tiny, text_halign=text.align_left, bgcolor=dashBg)'''
          if text.count(old_horizon) != 1:
              raise SystemExit(f"Expected one dashboard horizon cell, found {text.count(old_horizon)}")
          text = text.replace(old_horizon, new_horizon, 1)

          required = [
              "forecastHorizonMs = 48 * 60 * 60 * 1000",
              "var int directionForecastDir = 0",
              "forecastWindowExpired",
              "directionForecastExpiresAt := time_close + forecastHorizonMs",
              "directionForecastHorizonText",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Missing forecast lock content: {missing}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate forecast lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("AMY_ICT_NextGen.pine").read_text(encoding="utf-8")
          if text.count("var int directionForecastDir") != 1:
              raise SystemExit("Direction forecast state is not unique")
          if "bullishDirectionForecast =" in text or "bearishDirectionForecast =" in text:
              raise SystemExit("Unlocked forecast variables remain")
          if text.count("directionForecastHorizonText") != 2:
              raise SystemExit("Forecast horizon text declaration/use mismatch")
          print("Forecast horizon lock validation passed")
          PY

      - name: Commit forecast horizon lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-lock-direction-forecast.yml
          git add AMY_ICT_NextGen.pine
          git commit -m "Lock direction forecast for its 48 hour horizon"
          git push origin HEAD:feature/market-state-direction-forecast-20260714
