name: One-shot D-LAB BSL label typo fix
on:
  push:
    paths:
      - '.github/workflows/dlab-bsl-label-fix-oneshot.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline and fix label typo only
        run: |
          set -euo pipefail
          test "$(git hash-object Amy-SMC-D.pine)" = "d6e6d7c979dd5a852bddd9661bef0480caa2eb35"
          grep -q "AMY SMC D-LAB — EXECUTABLE COMBINATORIAL SIGNAL (LAB ONLY)" Amy-SMC-D-LAB.pine
          python - <<'PY'
          from pathlib import Path
          p=Path('Amy-SMC-D-LAB.pine')
          s=p.read_text(encoding='utf-8')
          old="'\\nUNTRY ' + amyPrice(amyDlabBslStrongBullAtrEntry) +"
          new="'\\nENTRY ' + amyPrice(amyDlabBslStrongBullAtrEntry) +"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one label typo, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit typo fix and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/dlab-bsl-label-fix-oneshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-D-LAB.pine .github/workflows/dlab-bsl-label-fix-oneshot.yml
          git commit -m "fix: correct BSL executable entry label"
          git push origin HEAD:main
