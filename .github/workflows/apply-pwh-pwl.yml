name: Apply PWH and PWL liquidity levels

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-pwh-pwl.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add PWH and PWL
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("AMY_ICT_NextGen.pine")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'showPrevDay = input.bool(true, "Show PDH / PDL", group=grpCore)\n',
              'showPrevDay = input.bool(true, "Show PDH / PDL", group=grpCore)\nshowPrevWeek = input.bool(true, "Show PWH / PWL", group=grpCore)\n',
          )

          weekly_block = '''// ============================================================================
          // PREVIOUS WEEK LIQUIDITY — PWH / PWL
          // ============================================================================
          pwh = request.security(syminfo.tickerid, "W", high[1], lookahead=barmerge.lookahead_on)
          pwl = request.security(syminfo.tickerid, "W", low[1], lookahead=barmerge.lookahead_on)
          newTradingWeek = nz(ta.change(time("W"))) != 0

          var line pwhLine = na
          var line pwlLine = na
          var label pwhLabel = na
          var label pwlLabel = na
          var bool pwhConsumed = false
          var bool pwlConsumed = false

          if newTradingWeek
              pwhConsumed := false
              pwlConsumed := false

          if not na(pwh) and high >= pwh
              pwhConsumed := true
          if not na(pwl) and low <= pwl
              pwlConsumed := true

          if showPrevWeek and not na(pwh) and not na(pwl)
              if newTradingWeek or na(pwhLine)
                  if not na(pwhLine)
                      line.delete(pwhLine)
                  if not na(pwlLine)
                      line.delete(pwlLine)
                  if not na(pwhLabel)
                      label.delete(pwhLabel)
                  if not na(pwlLabel)
                      label.delete(pwlLabel)
                  pwhLine := line.new(bar_index, pwh, bar_index + 1, pwh, extend=extend.right, color=color.new(color.fuchsia, 10), style=line.style_dotted, width=2)
                  pwlLine := line.new(bar_index, pwl, bar_index + 1, pwl, extend=extend.right, color=color.new(color.aqua, 10), style=line.style_dotted, width=2)
                  pwhLabel := label.new(bar_index + 3, pwh, "PWH " + f_price(pwh), style=label.style_label_left, color=color.new(color.fuchsia, 35), textcolor=color.white, size=size.tiny)
                  pwlLabel := label.new(bar_index + 3, pwl, "PWL " + f_price(pwl), style=label.style_label_left, color=color.new(color.aqua, 35), textcolor=color.white, size=size.tiny)
              line.set_y1(pwhLine, pwh)
              line.set_y2(pwhLine, pwh)
              line.set_y1(pwlLine, pwl)
              line.set_y2(pwlLine, pwl)
              line.set_color(pwhLine, color.new(color.fuchsia, pwhConsumed ? 72 : 10))
              line.set_color(pwlLine, color.new(color.aqua, pwlConsumed ? 72 : 10))
              label.set_xy(pwhLabel, bar_index + 3, pwh)
              label.set_xy(pwlLabel, bar_index + 3, pwl)
              label.set_text(pwhLabel, "PWH " + f_price(pwh))
              label.set_text(pwlLabel, "PWL " + f_price(pwl))
              label.set_color(pwhLabel, color.new(color.fuchsia, pwhConsumed ? 72 : 35))
              label.set_color(pwlLabel, color.new(color.aqua, pwlConsumed ? 72 : 35))
          else if not showPrevWeek
              if not na(pwhLine)
                  line.delete(pwhLine)
                  pwhLine := na
              if not na(pwlLine)
                  line.delete(pwlLine)
                  pwlLine := na
              if not na(pwhLabel)
                  label.delete(pwhLabel)
                  pwhLabel := na
              if not na(pwlLabel)
                  label.delete(pwlLabel)
                  pwlLabel := na

          '''

          marker = '''// ============================================================================
          // CONTEXT + EMA
          // ============================================================================'''
          replace_once(marker, weekly_block + marker)

          replace_once(
              '// Candidate BSL: active swing high, Asia High, or unswept PDH.\n// Candidate SSL: active swing low, Asia Low, or unswept PDL.',
              '// Candidate BSL: active swing high, Asia High, unswept PDH, or unswept PWH.\n// Candidate SSL: active swing low, Asia Low, unswept PDL, or unswept PWL.',
          )

          replace_once(
              '''if not pdhConsumed and not na(pdh) and pdh > close and (na(nearestBslTarget) or pdh < nearestBslTarget)
              nearestBslTarget := pdh
              nearestBslName := "PDH"

          float nearestSslTarget = na''',
              '''if not pdhConsumed and not na(pdh) and pdh > close and (na(nearestBslTarget) or pdh < nearestBslTarget)
              nearestBslTarget := pdh
              nearestBslName := "PDH"
          if not pwhConsumed and not na(pwh) and pwh > close and (na(nearestBslTarget) or pwh < nearestBslTarget)
              nearestBslTarget := pwh
              nearestBslName := "PWH"

          float nearestSslTarget = na''',
          )

          replace_once(
              '''if not pdlConsumed and not na(pdl) and pdl < close and (na(nearestSslTarget) or pdl > nearestSslTarget)
              nearestSslTarget := pdl
              nearestSslName := "PDL"

          bslDistance =''',
              '''if not pdlConsumed and not na(pdl) and pdl < close and (na(nearestSslTarget) or pdl > nearestSslTarget)
              nearestSslTarget := pdl
              nearestSslName := "PDL"
          if not pwlConsumed and not na(pwl) and pwl < close and (na(nearestSslTarget) or pwl > nearestSslTarget)
              nearestSslTarget := pwl
              nearestSslName := "PWL"

          bslDistance =''',
          )

          required = [
              'showPrevWeek = input.bool(true, "Show PWH / PWL", group=grpCore)',
              'pwh = request.security(syminfo.tickerid, "W", high[1]',
              'pwl = request.security(syminfo.tickerid, "W", low[1]',
              'nearestBslName := "PWH"',
              'nearestSslName := "PWL"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise RuntimeError(f"Missing expected additions: {missing}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit indicator update and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pwh-pwl.yml
          git add AMY_ICT_NextGen.pine
          git commit -m "Add PWH and PWL liquidity levels"
          git push
