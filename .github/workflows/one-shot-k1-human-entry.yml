name: One-shot K1 Human Entry Experiment Payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-k1-human-entry.yml'

permissions:
  contents: write

jobs:
  append-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append verified comment-only payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Amy-SMC-D.pine)" = 'd6e6d7c979dd5a852bddd9661bef0480caa2eb35'
          test "$(git hash-object Amy-SMC-D-LAB.pine)" = '8e008fc13c2245671a5963d71b9da1d33ba61db5'
          test -f .tmp/k1-human-entry-payload.txt
          ! grep -q 'AMY SMC D-LAB — K1 HUMAN ENTRY CONSTRUCTION — ACCEPTANCE/REJECTION + LOCAL SL' Amy-SMC-D-LAB.pine
          if grep -Ev '^[[:space:]]*(//.*)?$' .tmp/k1-human-entry-payload.txt; then
            echo 'Payload contains a non-comment line'
            exit 1
          fi
          cp Amy-SMC-D-LAB.pine /tmp/lab.before
          cat .tmp/k1-human-entry-payload.txt >> Amy-SMC-D-LAB.pine
          head -c "$(stat -c%s /tmp/lab.before)" Amy-SMC-D-LAB.pine | cmp - /tmp/lab.before
          grep -q 'HYPOTHESIS "LOCAL HUMAN SL REDUCES TIMEOUT": SUPPORTED STRONGLY' Amy-SMC-D-LAB.pine
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-D-LAB.pine
          git commit -m 'docs: add K1 human entry construction experiment'
          git push origin HEAD:main
