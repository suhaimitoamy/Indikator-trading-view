name: One-shot K1 Human Entry Experiment Payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-k1-human-entry.yml'

permissions:
  contents: write

jobs:
  append-payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable sources and append comment-only payload
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_BLOB='d6e6d7c979dd5a852bddd9661bef0480caa2eb35'
          LAB_BLOB='8e008fc13c2245671a5963d71b9da1d33ba61db5'
          MARKER='AMY SMC D-LAB — K1 HUMAN ENTRY CONSTRUCTION — ACCEPTANCE/REJECTION + LOCAL SL'

          test "$(git hash-object Amy-SMC-D.pine)" = "$BASELINE_BLOB"
          test "$(git hash-object Amy-SMC-D-LAB.pine)" = "$LAB_BLOB"
          ! grep -q "$MARKER" Amy-SMC-D-LAB.pine
          cp Amy-SMC-D-LAB.pine /tmp/lab.before

          cat >> Amy-SMC-D-LAB.pine <<'EOF'

//---------------------------------------------------------------------------------------------------------------------}
// AMY SMC D-LAB — K1 HUMAN ENTRY CONSTRUCTION — ACCEPTANCE/REJECTION + LOCAL SL (2026-08-12)
// EXPERIMENT / RESEARCH ONLY. This payload is documentation-only and changes no executable Pine logic.
// Frozen production baseline Amy-SMC-D.pine remains d6e6d7c979dd5a852bddd9661bef0480caa2eb35.
// Existing K1-K21, Pullback, Phase-1/Phase-2 autopsy payloads and all production fields above are untouched.
// Dataset: repaired/audited raw XAUUSD; 2004 warm-up; rolling 8y train -> 1y OOS, OOS 2012-2026; no synthetic candles.
// PARITY GATE reproduced before this experiment: source K1 M15 = 878 OOS events; directional structural survival
// = 796/878 = 90.6606%, exactly matching the locked Phase-1 K1 universe/metric.
//
// =====================================================================================================================
// EXPERIMENT CONSTRUCTION LOCK
// =====================================================================================================================
// SOURCE SIGNAL POPULATION
// - Source trigger is IDENTICAL to K1 M15: confirmed Qualified Valid Break + Internal Structure in the same direction.
// - No predictor/filter is added to create the 878 source events. Human-style construction begins only AFTER source K1 exists.
// - Broken level is the source swing/liquidity level: BSL for bullish QVB, SSL for bearish QVB.
//
// BUFFER / ENTRY
// - Candidate absolute buffers are exactly $1.00 and $2.00 XAUUSD, not ticks.
// - For bullish continuation: entry level = broken BSL + selected buffer. For bearish continuation: broken SSL - buffer.
// - Signal is known only at QVB close; no retroactive fill inside the QVB candle is allowed.
// - Retest starts on the next M15 candle and remains valid for max 32 M15 bars. Not touched = NO FILL, not Timeout.
// - Buffer is selected ONLY from the immediately preceding 8 calendar years for each OOS fold. OOS never selects itself.
// - Train objective for buffer selection = mean 0.40R lifecycle outcome per SOURCE signal; NO FILL/invalid = 0R;
//   unresolved filled trades are terminal-marked at the 32-bar horizon. Tie-break: more fills, then smaller buffer.
// - Selected OOS buffers: 2012 $2; 2013 $1; 2014 $1; 2015 $1; 2016 $1; 2017 $2; 2018 $2; 2019 $2;
//   2020 $2; 2021 $2; 2022 $2; 2023 $2; 2024 $2; 2025 $2; 2026 $1. Therefore $2 = 10/15 folds; $1 = 5/15.
// - The SAME train-selected buffer is reused for every parallel TP construction; TP constructors are not re-fit per fold.
//
// LOCAL SL
// - Continuation BUY SL = immediate latest CONFIRMED internalLow from native Internal Structure size-5, strictly before QVB.
// - Continuation SELL SL = immediate latest CONFIRMED internalHigh size-5, strictly before QVB.
// - No walk-back to older/farther local pivots. A pivot on the wrong side of entry makes that construction invalid.
// - Raw local SL distance <1.00 XAUUSD is INVALID under the realism floor; the pivot is NOT moved/floored artificially.
//
// IMMEDIATE REJECTION / SWEEP FORK
// - Exactly the next M15 candle after QVB is inspected; no multi-bar rejection window.
// - Bullish QVB rejected when next M15 CLOSE <= broken BSL -> reinterpret as reverse SELL.
// - Bearish QVB rejected when next M15 CLOSE >= broken SSL -> reinterpret as reverse BUY.
// - Reverse entry begins only AFTER rejection close: SELL = broken level-buffer; BUY = broken level+buffer; retest max 32 bars.
// - Reverse SL = immediate confirmed internalHigh/internalLow as of rejection close, with the same side-validity and >=1.00 floor.
//
// TP CONSTRUCTIONS / REALISM
// - Primary apple-to-apple: TP = 0.40R from NEW local R.
// - Parallel: TP = 1.00R and TP = 1.50R.
// - Fixed nominal descriptive buckets are predeclared, not optimized: local R 1.00-<7.50 = '~5' bucket; local R
//   7.50-<12.50 = '~10' bucket. Fixed targets: ~5/TP10; ~10/TP10; ~10/TP15; ~10/TP20.
// - TP distance <2.00 XAUUSD is INVALID for that TP construction; target is not artificially moved to the floor.
// - Same-M15-bar TP/SL collision = SL first. Filled trade lifecycle = 32 M15 bars inclusive of fill bar.
// - Timeout is a FILLED trade that touches neither TP nor SL within its 32-bar post-fill lifecycle. NO FILL is separate.
// - For expectancy/account replay, Timeout is marked to the terminal horizon close. Starting balance $10,000; risk 1%
//   of current balance per valid filled trade, sized from actual local R. Returns are compounded chronologically by source signal.
// - Event-level research does not suppress overlapping source signals; this preserves source-population comparability but is not
//   a portfolio-concurrency/margin simulation. HC = OOS year with >=30 valid executions for that construction.
//
// DIRECTIONAL / PATH AUTOPSY DEFINITION
// - Directional accuracy remains the ORIGINAL K1 source metric: 32 bars from QVB signal and locked FULL opposite Swing
//   structural-cancellation boundary. The new local SL does not redefine whether the K1 direction itself survived.
// - This means Directionally Correct, Execution Loss can now exist: local SL may fail before the old full structural boundary.
// - Winner taxonomy remains locked: Clean = TP first with pre-TP MAE <0.50R; Dirty = TP first with MAE >=0.50R;
//   #3 Directionally Correct Execution Loss; #4 True Directional Failure; #5 Ambiguous/Collision; #6 Timeout.
//
// =====================================================================================================================
// OOS ROUTING / EXECUTABILITY — SAME 878 SOURCE K1 SIGNALS
// =====================================================================================================================
// Route before TP-floor eligibility:
// - Continuation route: 707/878 = 80.52%.
//   Raw continuation retest: 580 FILLED; 127 NO FILL; no wrong-side/local-SL-floor failures before TP construction.
// - Immediate rejection/SWEEP route: 171/878 = 19.48%.
//   Raw reverse geometry: 27 FILLED; 5 NO FILL; 109 INVALID_LOCAL_STOP; 30 INVALID_SL_FLOOR.
//   Only 32/171 = 18.71% of rejection events therefore have mechanically valid immediate reverse local geometry.
//
// =====================================================================================================================
// MAIN ROUTED STRATEGY — TP CONSTRUCTION COMPARISON
// =====================================================================================================================
// Columns: TP | valid fills | NO FILL(source) | invalid(source) | TP WR | terminal-positive WR | Exp | End | Net | MaxDD | HC
// 0.40R | 517 | 132=15.03% | 229=26.08% | 63.06% | 68.28% | +0.06537R | $13,924.70 | +$3,924.70 | 6.94% | 11/15
// 1.00R | 589 | 132=15.03% | 157=17.88% | 29.20% | 51.27% | +0.03931R | $12,386.98 | +$2,386.98 | 12.62% | 14/15
// 1.50R | 598 | 132=15.03% | 148=16.86% | 12.21% | 46.66% | -0.00262R |  $9,641.45 |   -$358.55 | 23.61% | 14/15
// Outcome split among valid fills:
// - 0.40R: TP 63.06% | SL 13.35% | Timeout 23.60%. Timeout/source = 122/878 = 13.90%.
// - 1.00R: TP 29.20% | SL 23.60% | Timeout 47.20%.
// - 1.50R: TP 12.21% | SL 26.09% | Timeout 61.71%.
// 0.40R local R distribution P25/P50/P75 = 7.03 / 10.00 / 14.78 XAUUSD.
// Positive OOS years: 0.40R 11/15; 1.00R 10/15; 1.50R 8/15.
// Annual valid executions for primary 0.40R: 2012 37, 2013 36, 2014 32, 2015 22, 2016 29, 2017 28,
// 2018 34, 2019 42, 2020 41, 2021 44, 2022 39, 2023 35, 2024 43, 2025 35, 2026 20 -> HC 11/15.
//
// FIXED NOMINAL CONSTRUCTIONS — GROUP-SPECIFIC ELIGIBLE DENOMINATORS
// ~5 local SL bucket (R 1.00-<7.50), TP10:
// - eligible source events 285; filled 248; NO FILL 37=12.98%; TP WR 12.50%; terminal-positive WR 45.56%;
//   expectancy +0.02646R; Ending $10,491.50; Net +$491.50; MaxDD 17.90%; positive years 7/15; HC 2/15;
//   filled outcomes TP 12.50% | SL 37.50% | Timeout 50.00%; median local R 5.745.
// ~10 local SL bucket (R 7.50-<12.50), TP10:
// - eligible 229; filled 180; NO FILL 49=21.40%; TP WR 18.33%; terminal-positive WR 45.00%;
//   expectancy -0.04450R; Ending $9,186.53; Net -$813.47; MaxDD 14.05%; positive years 5/15; HC 0/15;
//   TP 18.33% | SL 23.89% | Timeout 57.78%.
// ~10 bucket, TP15: filled 180; TP WR 6.11%; terminal-positive WR 42.78%; Exp -0.06616R; End $8,831.33;
// Net -$1,168.67; MaxDD 14.36%; positive years 5/15; HC 0/15; Timeout 68.89%.
// ~10 bucket, TP20: filled 180; TP WR 2.78%; terminal-positive WR 42.22%; Exp -0.06966R; End $8,774.23;
// Net -$1,225.77; MaxDD 14.21%; positive years 5/15; HC 0/15; Timeout 72.22%.
// Fixed nominal results are exploratory bucket reports only; they are not train-selected exits and are not promoted.
//
// =====================================================================================================================
// CONTINUATION-ONLY ABlation / APPLE-TO-APPLE K1 COMPARISON
// =====================================================================================================================
// Continuation route, local 0.40R:
// - 707 source-routed signals; 516 valid primary fills; 127 NO FILL; 64 TP-floor invalids.
// - TP WR 62.98%; terminal-positive WR 68.22%; expectancy +0.06472R; Ending $13,869.22; Net +$3,869.22;
//   MaxDD 7.31%; positive years 11/15; HC 11/15; TP 62.98% | SL 13.37% | Timeout 23.64%.
// Continuation 1.00R: 580 valid fills; TP WR 29.14%; Exp +0.0440R; Net +$2,690.92; MaxDD 11.73%;
// Timeout 47.76%; HC 14/15.
// Continuation 1.50R: 580 valid fills; TP WR 11.90%; Exp +0.0100R; Net +$391.75; MaxDD 18.83%;
// Timeout 63.45%; HC 14/15. The combined routed 1.50R becomes negative because the reverse-SWEEP branch loses.
//
// STRONGEST ISOLATION TEST — SAME EXACT 516 CONTINUATION FILLS, ONLY SL/R GEOMETRY CHANGED
// Old full structural geometry on those same fills:
// - median R 18.0965; TP 210/516=40.70%; SL 32/516=6.20%; Timeout 274/516=53.10%;
//   expectancy +0.03169R; exact chronological Net +$1,725.02; MaxDD 9.31%.
// New immediate size-5 local geometry on the SAME fills:
// - median R 10.0000; TP 325/516=62.98%; SL 69/516=13.37%; Timeout 122/516=23.64%;
//   expectancy +0.06472R; exact chronological Net +$3,869.22; MaxDD 7.31%.
// Geometry-only delta on identical fills:
// - median R -44.74%; TP-hit +22.29 percentage points; Timeout -29.46 pp; SL-hit +7.17 pp;
//   expectancy approximately doubles. This isolates the local-SL effect from retest/no-fill selection.
// Across all 580 raw continuation fills, median local R 9.095 vs comparable full structural R 17.5375 (-48.14%);
// local R is smaller than full structural R on 92.07% of fills.
// R P25/P50/P75/P90: local 6.4725/9.0950/14.1748/21.7868 vs structural 11.3200/17.5375/28.2025/45.5840.
//
// HISTORICAL OLD K1 REFERENCE
// - Locked Phase-1 K1 headline: source 878; directional 90.66%; TP WR 39.98%; Timeout 468/878=53.30%; Exp +0.0146R;
//   HC 15/15. The existing ranking report's $11,368 ending balance is an aggregate-expectancy compounding projection,
//   not an exact stored trade-sequence replay.
// - Exact event-sequence reconstruction under the locked NEXT OPEN/full structural 0.40R lifecycle reproduces 351 TP,
//   59 SL, 468 Timeout and gives Ending $11,320.72; Net +$1,320.72; MaxDD 13.90%; median structural R 18.1835.
// - Do not mix the historical projected $11,368 with the new exact chronological account replay when judging dollar deltas.
//
// =====================================================================================================================
// PRIMARY 0.40R PATH AUTOPSY — 517 VALID ROUTED FILLS
// =====================================================================================================================
// Source directional structural survival inside this filled subset = 476/517 = 92.07%; full source remains 796/878=90.66%.
// #1 Clean Winner                          : 298 / 517 = 57.64%
// #2 Dirty Winner                          :  28 / 517 =  5.42%
// #3 Directionally Correct, Execution Loss :  48 / 517 =  9.28%
// #4 True Directional Failure              :  21 / 517 =  4.06%
// #5 Ambiguous/Intrabar Collision          :   0 / 517 =  0.00%
// #6 Timeout                               : 122 / 517 = 23.60%
// #3 is now non-zero by construction: local size-5 SL can be hit while the old full Swing cancellation boundary still survives.
//
// MAE/MFE BEFORE RESOLUTION — R NORMALIZED, P25 / P50 / P75 / P90
// Clean Winner: MAE 0.0824/0.1551/0.2529/0.3534 | MFE 0.4367/0.5010/0.6058/0.7383
// Dirty Winner: MAE 0.6026/0.7133/0.7920/0.8690 | MFE 0.4478/0.5213/0.5962/0.8121
// Directionally Correct Execution Loss:
//               MAE 1.0584/1.1343/1.2228/1.4769 | MFE 0.1240/0.2186/0.2943/0.3424
// True Directional Failure:
//               MAE 1.1840/1.2749/1.5399/1.9918 | MFE 0.0674/0.1634/0.2786/0.3324
// Timeout:       MAE 0.3097/0.4847/0.7408/0.9093 | MFE 0.1407/0.2321/0.3187/0.3677
// Ambiguous: N/A (n=0).
//
// =====================================================================================================================
// REJECTION / SWEEP FORK — SEPARATE VERDICT
// =====================================================================================================================
// Immediate rejection frequency = 171/878 = 19.48% of the unchanged source K1 population.
// Mechanical reverse-local-SL failure dominates: 109/171=63.74% wrong-side immediate pivot; 30/171=17.54% R<1;
// only 32/171=18.71% have valid reverse local geometry before target-specific floors (27 fill + 5 no-fill).
// Primary 0.40R requires local R>=5 to satisfy TP>=2, leaving only ONE valid filled sweep trade; it wins, n=1 meaningless.
// Sweep 1.00R: 9 valid fills; TP/terminal-positive WR 33.33%; expectancy -0.26481R; Net -$239.49; MaxDD 3.36%;
// TP 33.33% | SL 55.56% | Timeout 11.11%; HC 0/15.
// Sweep 1.50R: 18 valid fills; TP/terminal-positive WR 22.22%; expectancy -0.41018R; Net -$722.01; MaxDD 10.38%;
// TP 22.22% | SL 72.22% | Timeout 5.56%; HC 0/15.
// Sweep fixed ~5/TP10: 32 eligible; 27 fill; 5 no-fill; terminal-positive WR 14.81%; TP WR 11.11%;
// expectancy -0.14059R; Net -$442.69; MaxDD 14.90%; TP 11.11% | SL 81.48% | Timeout 7.41%; HC 0/15.
// No valid ~10-R reverse sweep population exists under the confirmed immediate size-5 SL construction.
// SWEEP VERDICT: NOT VALIDATED / REJECT CURRENT CONSTRUCTION. It is sparse after mechanical validity and loses where executable.
//
// =====================================================================================================================
// EXPERIMENT DIAGNOSIS / STATUS
// =====================================================================================================================
// HYPOTHESIS "LOCAL HUMAN SL REDUCES TIMEOUT": SUPPORTED STRONGLY FOR K1 CONTINUATION.
// The matched 516-fill ablation is decisive for this specific mechanism: no signal/fill changed, yet local size-5 R cuts
// median risk distance ~44.7%, Timeout 53.10% -> 23.64%, and TP hit 40.70% -> 62.98%. Therefore the Phase-2 structural-room
// diagnosis was actionable: the old full Swing R was materially inflating the 0.40R target distance in volatility units.
//
// IMPORTANT COST / TRADE-OFF:
// - A tighter local SL does not make K1 direction itself more accurate. It creates 48/517=9.28% Directionally Correct
//   Execution Losses where local structure is stopped while the old full structural directional thesis still survives.
// - Retest construction also creates NO FILL: primary routed test has 132/878=15.03% source signals unfilled.
// - Realism/geometry invalids further reduce primary 0.40R valid execution coverage to 517/878=58.88%.
//
// TP CONSTRUCTION VERDICT IN THIS EXPLORATION:
// - Local 0.40R is the strongest tested routed construction: +0.06537R, +$3,924.70, 6.94% DD, Timeout 23.60% of fills.
// - Local 1.00R remains positive but materially weaker/slower: +0.03931R, +$2,386.98, 12.62% DD, Timeout 47.20%.
// - Routed 1.50R is negative; higher RR did NOT automatically match pace better after R was tightened.
// - Fixed ~5/TP10 is mildly positive but low-HC (2/15); fixed ~10 targets are negative. None is promoted from this pass.
//
// FINAL STATUS:
// - CONTINUATION acceptance/retest + immediate size-5 local SL: RESEARCH-WORTHY / hypothesis supported; NOT production-promoted.
// - Reverse immediate rejection/SWEEP fork: REJECT CURRENT CONSTRUCTION; no production promotion.
// - K1 source predictor remains unchanged and locked. This experiment tests execution construction only.
//---------------------------------------------------------------------------------------------------------------------}
EOF

          python - <<'PY'
          from pathlib import Path
          before = Path('/tmp/lab.before').read_bytes()
          after = Path('Amy-SMC-D-LAB.pine').read_bytes()
          assert after.startswith(before), 'LAB prefix changed; append-only invariant violated'
          extra = after[len(before):].decode('utf-8')
          assert 'AMY SMC D-LAB — K1 HUMAN ENTRY CONSTRUCTION — ACCEPTANCE/REJECTION + LOCAL SL' in extra
          for line in extra.splitlines():
              if line.strip():
                  assert line.lstrip().startswith('//'), f'non-comment appended line: {line!r}'
          PY

          git diff --check
          git diff -- Amy-SMC-D-LAB.pine
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amy-SMC-D-LAB.pine
          git commit -m 'docs: add K1 human entry construction experiment'
          git push origin HEAD:main
