name: Amy SMC B LAB M15 Trade Management
on:
  push:
    paths:
      - '.github/workflows/amy-smc-b-lab-m15-tm.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch B-LAB only
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify frozen baselines and scope
        run: |
          test "$(git hash-object Amy-SMC-B.pine)" = "3b9b718a238e1c836920e76449bc5e4e11246440"
          test "$(git hash-object Amy-SMC-Z.pine)" = "389036df09d03125a2f71189722953658a901170"
          test "$(git hash-object Amy-SMC-A.pine)" = "edb769a2bcfc59fe53237eda2a926fe31a14003b"
          test "$(git hash-object Amy-SMC-A-LAB.pine)" = "66b80304c44556040dc587557913bda309ca7b7d"
          grep -F "float amyBM15TrailTriggerAtr = 0.25" Amy-SMC-B-LAB.pine
          grep -F "float amyBM15TrailDistanceAtr = 0.40" Amy-SMC-B-LAB.pine
          grep -F "int amyBM15ManagementExpiryBars = 32" Amy-SMC-B-LAB.pine
          grep -F "int amyTargetExpiryBarsNow = amyRound5M5 ? (amyBM5HighRisk ? 192 : 60) : amyRound5M15 ? 32" Amy-SMC-B-LAB.pine
          grep -F "int amyNextDirection = amyRound5M5 ? (amyRound9M5TradeRegime ? amyRound9M5TradeDirection : 0) : amyFinalBias" Amy-SMC-B-LAB.pine
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "Amy-SMC-B-LAB.pine "
      - name: Commit B-LAB experiment
        run: |
          git config user.name suhaimitoamy
          git config user.email 34860608+suhaimitoamy@users.noreply.github.com
          git add Amy-SMC-B-LAB.pine
          git commit -m 'test: add M15 ATR trade-management LAB'
          git push origin HEAD:main
