name: Apply NextGen market reading fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-nextgen-market-read-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply repair
        run: python .github/scripts/apply_nextgen_fix.py

      - name: Verify update
        run: |
          grep -q 'newPdhSweep =' AMY_ICT_NextGen.pine
          grep -q 'newPwhSweep =' AMY_ICT_NextGen.pine
          grep -q 'WAIT - UPPER REJECTION' AMY_ICT_NextGen.pine
          grep -q 'BSL TARGET' AMY_ICT_NextGen.pine
          grep -q 'AMY_ICT_NextGen.pine' README.md

      - name: Commit final update and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-nextgen-market-read-fix.yml
          git rm .github/scripts/apply_nextgen_fix.py
          git add AMY_ICT_NextGen.pine README.md
          git commit -m "Improve NextGen liquidity reading and rejection handling"
          git push origin HEAD:main
