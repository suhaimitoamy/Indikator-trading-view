name: Apply Market State v2

on:
  push:
    branches:
      - feature/direction-forecast-20260714
    paths:
      - .market-state-v2-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/direction-forecast-20260714

      - name: Apply isolated Market State update
        run: python scripts/apply_market_state_v2.py

      - name: Commit validated Market State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-market-state-v2.yml
          git rm .market-state-v2-trigger
          git rm scripts/apply_market_state_v2.py
          git add AMY_ICT_NextGen.pine MARKET_STATE_BACKTEST.md
          git commit -m "feat(mapping): validate Market State from dual swing structure"
          git push origin HEAD:feature/direction-forecast-20260714
