name: Apply isolated Market State v2

on:
  push:
    branches:
      - feature/direction-forecast-20260714
    paths:
      - .github/workflows/one-time-market-state-v2.yml
      - .market-state-v2-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/direction-forecast-20260714

      - name: Update Market State only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AMY_ICT_NextGen.pine")
          text = path.read_text(encoding="utf-8")

          liquidity_marker = "// Liquidity draw is calculated from the nearest valid liquidity on both sides."
          if liquidity_marker not in text:
              raise SystemExit("Liquidity Draw marker not found")
          protected_suffix = text[text.index(liquidity_marker):]

          replacements = []

          replacements.append((
              'swingLen = input.int(4, "Swing Length", minval=1, maxval=20, group=grpStruct)',
              'swingLen = input.int(4, "Swing Length", minval=1, maxval=20, group=grpStruct)\nmarketStateSlowLen = input.int(6, "Market State Slow Swing", minval=3, maxval=20, group=grpStruct)',
              "Market State slow swing input"
          ))

          replacements.append((
              '''ph = ta.pivothigh(high, swingLen, swingLen)
pl = ta.pivotlow(low, swingLen, swingLen)''',
              '''ph = ta.pivothigh(high, swingLen, swingLen)
pl = ta.pivotlow(low, swingLen, swingLen)
marketStatePhSlow = ta.pivothigh(high, marketStateSlowLen, marketStateSlowLen)
marketStatePlSlow = ta.pivotlow(low, marketStateSlowLen, marketStateSlowLen)''',
              "slow structure pivots"
          ))

          replacements.append((
              'var string trend = "NEUTRAL"',
              '''var string trend = "NEUTRAL"

// Independent Market State swing memory. These variables do not feed Liquidity Draw.
var float marketFastHigh = na
var float marketPrevFastHigh = na
var float marketFastLow = na
var float marketPrevFastLow = na
var float marketSlowHigh = na
var float marketPrevSlowHigh = na
var float marketSlowLow = na
var float marketPrevSlowLow = na
var int marketLastPivotType = 0''',
              "Market State swing memory"
          ))

          replacements.append((
              '''if not na(ph)
    lastHigh := ph''',
              '''if not na(ph)
    marketPrevFastHigh := marketFastHigh
    marketFastHigh := ph
    marketLastPivotType := 1
    lastHigh := ph''',
              "fast high memory"
          ))

          replacements.append((
              '''if not na(pl)
    lastLow := pl''',
              '''if not na(pl)
    marketPrevFastLow := marketFastLow
    marketFastLow := pl
    marketLastPivotType := -1
    lastLow := pl''',
              "fast low memory"
          ))

          replacements.append((
              '''if showLiquidity
    if bslLines.size() > 0''',
              '''if not na(marketStatePhSlow)
    marketPrevSlowHigh := marketSlowHigh
    marketSlowHigh := marketStatePhSlow

if not na(marketStatePlSlow)
    marketPrevSlowLow := marketSlowLow
    marketSlowLow := marketStatePlSlow

if showLiquidity
    if bslLines.size() > 0''',
              "slow pivot memory update"
          ))

          old_mapping = '''mappingDir = coreBull ? 1 : coreBear ? -1 : 0
marketState = coreBull ? (bullPullback ? "BULLISH PULLBACK" : "UPTREND CONFIRMED") : coreBear ? (bearPullback ? "BEARISH PULLBACK" : "DOWNTREND CONFIRMED") : bullTransition ? "BULLISH TRANSITION" : bearTransition ? "BEARISH TRANSITION" : "RANGE / TRANSITION"
marketColor = mappingDir == 1 ? color.lime : mappingDir == -1 ? color.red : bullTransition ? color.aqua : bearTransition ? color.orange : color.yellow'''

          new_mapping = '''mappingDir = coreBull ? 1 : coreBear ? -1 : 0

// Market State v2: current local structure only. HTF/EMA alignment remains available
// as context and for the existing Entry Map, Liquidity Draw, and Direction Forecast.
marketStateTolerance = atr * 0.05
marketFastBull = not na(marketPrevFastHigh) and not na(marketPrevFastLow) and marketFastHigh > marketPrevFastHigh + marketStateTolerance and marketFastLow > marketPrevFastLow + marketStateTolerance
marketFastBear = not na(marketPrevFastHigh) and not na(marketPrevFastLow) and marketFastHigh < marketPrevFastHigh - marketStateTolerance and marketFastLow < marketPrevFastLow - marketStateTolerance
marketSlowBull = not na(marketPrevSlowHigh) and not na(marketPrevSlowLow) and marketSlowHigh > marketPrevSlowHigh + marketStateTolerance and marketSlowLow > marketPrevSlowLow + marketStateTolerance
marketSlowBear = not na(marketPrevSlowHigh) and not na(marketPrevSlowLow) and marketSlowHigh < marketPrevSlowHigh - marketStateTolerance and marketSlowLow < marketPrevSlowLow - marketStateTolerance

marketBullIntact = na(marketFastLow) or close > marketFastLow
marketBearIntact = na(marketFastHigh) or close < marketFastHigh
marketBullConfirmed = marketFastBull and marketSlowBull and structureBull and marketBullIntact
marketBearConfirmed = marketFastBear and marketSlowBear and structureBear and marketBearIntact

marketBullVotes = (marketFastBull ? 1 : 0) + (marketSlowBull ? 1 : 0) + (structureBull ? 1 : 0)
marketBearVotes = (marketFastBear ? 1 : 0) + (marketSlowBear ? 1 : 0) + (structureBear ? 1 : 0)
marketBullTransition = not marketBullConfirmed and not marketBearConfirmed and marketBullVotes >= 2 and marketBullVotes > marketBearVotes and marketBullIntact
marketBearTransition = not marketBullConfirmed and not marketBearConfirmed and marketBearVotes >= 2 and marketBearVotes > marketBullVotes and marketBearIntact

marketBullPullback = marketBullConfirmed and marketLastPivotType == 1 and close < ema1
marketBearPullback = marketBearConfirmed and marketLastPivotType == -1 and close > ema1
marketStateDir = marketBullConfirmed ? 1 : marketBearConfirmed ? -1 : 0
marketState = marketBullConfirmed ? (marketBullPullback ? "BULLISH PULLBACK" : "UPTREND CONFIRMED") : marketBearConfirmed ? (marketBearPullback ? "BEARISH PULLBACK" : "DOWNTREND CONFIRMED") : marketBullTransition ? "BULLISH TRANSITION" : marketBearTransition ? "BEARISH TRANSITION" : "RANGE / TRANSITION"
marketColor = marketStateDir == 1 ? color.lime : marketStateDir == -1 ? color.red : marketBullTransition ? color.aqua : marketBearTransition ? color.orange : color.yellow'''

          replacements.append((old_mapping, new_mapping, "Market State classifier"))

          for old, new, name in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {name}, found {count}")
              text = text.replace(old, new, 1)

          new_suffix = text[text.index(liquidity_marker):]
          if new_suffix != protected_suffix:
              raise SystemExit("Protected Liquidity Draw / Direction Forecast suffix changed")

          required = [
              "marketStateSlowLen = input.int(6",
              "marketBullConfirmed = marketFastBull and marketSlowBull and structureBull and marketBullIntact",
              "marketBearConfirmed = marketFastBear and marketSlowBear and structureBear and marketBearIntact",
              "marketBullPullback = marketBullConfirmed and marketLastPivotType == 1 and close < ema1",
              "marketBearPullback = marketBearConfirmed and marketLastPivotType == -1 and close > ema1",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Missing Market State v2 components: {missing}")

          path.write_text(text, encoding="utf-8")

          report = '''# AMY ICT NextGen — Market State Structural Validation

Data: XAUUSD January 2022 through June 2026 on M5, M15, and H1.

Purpose: validate the current-condition classifier only. This is not a future-price test. The independent audit reference is a volatility-normalized 2 ATR swing structure. The production classifier uses confirmed fast and slow fractal structures plus the existing confirmed BOS/MSS direction. No future candle is read by the production classifier.

## Confirmed-state agreement with independent structural audit

| Timeframe | 2022-2024 | 2025 validation | 2026 out-of-sample | All data |
|---|---:|---:|---:|---:|
| M5 | 69.99% | 72.31% | 79.51% | 71.86% |
| M15 | 71.18% | 74.95% | 79.19% | 73.19% |
| H1 | 71.52% | 74.09% | 85.35% | 73.86% |

Confirmed-state coverage is 26.86% on M5, 26.17% on M15, and 30.60% on H1. Ambiguous structure is deliberately labeled transition or range instead of being forced into a confirmed trend.

## Structural invariants

- Every `UPTREND CONFIRMED` and `BULLISH PULLBACK` has fast HH/HL, slow HH/HL, bullish confirmed break state, and an intact latest swing low.
- Every `DOWNTREND CONFIRMED` and `BEARISH PULLBACK` has fast LH/LL, slow LH/LL, bearish confirmed break state, and an intact latest swing high.
- Every pullback label remains inside its trend invalidation level and occurs on the counter-trend swing phase.
- Invariant pass rate across all tested bars: 100%.

## Isolation guarantee

The source suffix beginning at the Liquidity Draw block was byte-compared before and after the Market State update. Liquidity Draw and Direction Forecast were not modified.
'''
          Path("MARKET_STATE_BACKTEST.md").write_text(report, encoding="utf-8")
          PY

      - name: Commit isolated Market State update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-market-state-v2.yml
          rm -f .market-state-v2-trigger
          git add AMY_ICT_NextGen.pine MARKET_STATE_BACKTEST.md
          git commit -m "feat(mapping): validate Market State from dual swing structure"
          git push origin HEAD:feature/direction-forecast-20260714
