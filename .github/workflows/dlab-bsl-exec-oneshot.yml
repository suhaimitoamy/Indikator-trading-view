name: One-shot D-LAB BSL executable append

on:
  push:
    paths:
      - '.github/workflows/dlab-bsl-exec-oneshot.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen baseline and append executable LAB block
        env:
          BLOCK_B64:    kKcGxvdChhbXlEbGFiU2hvd0JzbFN0cm9uZ0J1bGxBdHIgPyBhbXlEbGFiQnNsU3Ryb25nQnVsbEF0clN 
        run: |
          set -euo pipefail
          test "$(git hash-object Amy-SMC-D.pine)" = "d6e6d7c979dd5a852bddd9661bef0480caa2eb35"
          test "$(git hash-object Amy-SMC-D-LAB.pine)" = "1bad036de22ed720154bf14d32d9a7b0ff02b6fd"
          python - <<'PY'
          import os, base64
          from pathlib import Path
          p = Path("Amy-SMC-D-LAB.pine")
          text = p.read_text(encoding="utf-8")
          marker = "AMY SMC D-LAB — EXECUTABLE COMBINATORIAL SIGNAL (LAB ONLY)"
          if marker in text:
              raise SystemExit("Executable block already exists; refusing duplicate append.")
          block = base64.b64decode(os.environ["BLOCK_B64"]).decode("utf-8")
          if not text.endswith("\n"):
              text += "\n"
          p.write_text(text + block, encoding="utf-8")
          PY

      - name: Commit executable LAB signal and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/dlab-bsl-exec-oneshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-D-LAB.pine .github/workflows/dlab-bsl-exec-oneshot.yml
          git commit -m "feat: add executable BSL strong bull ATR LAB signal"
          git push origin HEAD:main
