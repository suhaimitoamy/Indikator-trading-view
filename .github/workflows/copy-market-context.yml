name: Copy AMY Market Context V4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/copy-market-context.yml

permissions:
  contents: write

jobs:
  copy-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Pine indicator
        run: |
          curl -fsSL "https://raw.githubusercontent.com/suhaimitoamy/Lab/main/AMY_Market_Context_V4.pine" -o AMY_Market_Context_V4.pine
          rm .github/workflows/copy-market-context.yml

      - name: Commit copied indicator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMY_Market_Context_V4.pine .github/workflows/copy-market-context.yml
          git commit -m "Add AMY Market Context V4 indicator"
          git push
