name: Fix Amy SMC X layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-amy-smc-x.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Amy SMC X
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('Amy-SMC-X.pine')
          s = p.read_text()

          # Move dashboard to bottom-right.
          old_dashboard = "var table amyDashboard = table.new(position.top_right, 2, 16, bgcolor = color.new(color.black, 12), border_color = color.new(GRAY, 65), border_width = 1)"
          new_dashboard = "var table amyDashboard = table.new(position.bottom_right, 2, 16, bgcolor = color.new(color.black, 12), border_color = color.new(GRAY, 65), border_width = 1)"
          if old_dashboard not in s:
              raise SystemExit('dashboard target not found')
          s = s.replace(old_dashboard, new_dashboard, 1)

          # Keep candlestick-pattern analysis for the dashboard, but show only the latest detected pattern on the chart.
          old_pattern = '''[amyPatternNow, amyPatternDirNow] = amyDetectPattern()
          var string amyLastPattern = 'NONE'
          var int amyLastPatternDir = 0
          float amyAtr14 = ta.atr(14)
          float amyOffset = math.max(nz(amyAtr14, high - low) * 0.30, syminfo.mintick * 10)

          if barstate.isconfirmed and amyPatternNow != 'NONE'
              amyLastPattern := amyPatternNow
              amyLastPatternDir := amyPatternDirNow
              if amyShowPatterns
                  bool patternAbove = amyPatternDirNow <= 0
                  float patternY = patternAbove ? high + amyOffset * 2.0 : low - amyOffset * 2.0
                  color patternColor = amyPatternDirNow == BULLISH ? GREEN : amyPatternDirNow == BEARISH ? RED : GRAY
                  amyAddChartLabel(bar_index, patternY, amyPatternNow, patternAbove, patternColor)
          '''

          new_pattern = '''[amyPatternNow, amyPatternDirNow] = amyDetectPattern()
          var string amyLastPattern = 'NONE'
          var int amyLastPatternDir = 0
          var int amyLastPatternBar = na
          var float amyLastPatternY = na
          var bool amyLastPatternAbove = false
          var color amyLastPatternColor = GRAY
          var label amyLatestPatternLabel = na
          float amyAtr14 = ta.atr(14)
          float amyOffset = math.max(nz(amyAtr14, high - low) * 0.30, syminfo.mintick * 10)

          if barstate.isconfirmed and amyPatternNow != 'NONE'
              amyLastPattern := amyPatternNow
              amyLastPatternDir := amyPatternDirNow
              amyLastPatternBar := bar_index
              amyLastPatternAbove := amyPatternDirNow <= 0
              amyLastPatternY := amyLastPatternAbove ? high + amyOffset * 2.0 : low - amyOffset * 2.0
              amyLastPatternColor := amyPatternDirNow == BULLISH ? GREEN : amyPatternDirNow == BEARISH ? RED : GRAY

          if barstate.islast
              if amyShowPatterns and not na(amyLastPatternBar) and amyLastPattern != 'NONE'
                  if na(amyLatestPatternLabel)
                      amyLatestPatternLabel := label.new(amyLastPatternBar, amyLastPatternY, amyLastPattern, xloc = xloc.bar_index, yloc = yloc.price, color = color.new(amyLastPatternColor, 83), style = amyLastPatternAbove ? label.style_label_down : label.style_label_up, textcolor = amyLastPatternColor, size = size.tiny)
                  else
                      label.set_xy(amyLatestPatternLabel, amyLastPatternBar, amyLastPatternY)
                      label.set_text(amyLatestPatternLabel, amyLastPattern)
                      label.set_color(amyLatestPatternLabel, color.new(amyLastPatternColor, 83))
                      label.set_textcolor(amyLatestPatternLabel, amyLastPatternColor)
                      label.set_style(amyLatestPatternLabel, amyLastPatternAbove ? label.style_label_down : label.style_label_up)
              else if not na(amyLatestPatternLabel)
                  label.delete(amyLatestPatternLabel)
                  amyLatestPatternLabel := na
          '''

          if old_pattern not in s:
              raise SystemExit('pattern target not found')
          s = s.replace(old_pattern, new_pattern, 1)

          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amy-SMC-X.pine
          git diff --cached --quiet && exit 0
          git commit -m "Fix Amy SMC X dashboard and pattern clutter"
          git push origin main
