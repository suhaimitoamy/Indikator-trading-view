name: Create Amy SMC C
on:
  push:
    paths:
      - '.github/workflows/create-amy-smc-c.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build files
        run: python .github/scripts/create_amy_smc_c.py
      - name: Verify diff
        run: |
          git diff --check
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "Amy-SMC-C-LAB.pine Amy-SMC-C.pine "
      - name: Commit files
        run: |
          git config user.name suhaimitoamy
          git config user.email 34860608+suhaimitoamy@users.noreply.github.com
          git add Amy-SMC-C.pine Amy-SMC-C-LAB.pine
          git commit -m 'feat: add Amy SMC C dealing-range redesign'
          git push origin HEAD:main
