name: Apply AMY Box Visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-amy-box-visuals.yml'

permissions:
  contents: write

jobs:
  apply-box-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply box visual patch
        run: python .github/scripts/apply_amy_box_visuals.py

      - name: Remove temporary automation
        run: |
          rm -f .github/scripts/apply_amy_box_visuals.py
          rm -f .github/workflows/apply-amy-box-visuals.yml

      - name: Commit final indicator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMY_Market_Context_Final.pine .github/scripts/apply_amy_box_visuals.py .github/workflows/apply-amy-box-visuals.yml
          git commit -m "Render AMY chart context as compact boxes"
          git push origin main
